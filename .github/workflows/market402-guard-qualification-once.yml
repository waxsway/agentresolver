name: One-shot Market402 Qualification Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/market402-guard-qualification-once.yml"

permissions:
  contents: read
  statuses: write

jobs:
  qualify:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Query exact Guard and settlement-canary paid-probe qualification
        id: submit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.request

          resources = [
              ("guard", "https://agentresolver.vercel.app/api/payment-guard?url=https%3A%2F%2Fagentresolver.vercel.app%2Fapi%2Fx402-ping&method=GET&maxPriceUsd=0.01&expectedNetwork=eip155%3A8453", 0.001),
              ("ping", "https://agentresolver.vercel.app/api/x402-ping", 0.001),
          ]

          results = {}
          for label, resource, price in resources:
              payload = json.dumps({
                  "resource": resource,
                  "declared_price_usd": price,
                  "paid_probe_optin": True,
              }).encode("utf-8")
              req = urllib.request.Request(
                  "https://market402.com/submit",
                  data=payload,
                  headers={"content-type":"application/json","user-agent":"agentresolver-market402-audit/1.0"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      code = resp.status
                      data = json.loads(resp.read().decode("utf-8","replace"))
              except urllib.error.HTTPError as exc:
                  code = exc.code
                  try:
                      data = json.loads(exc.read().decode("utf-8","replace"))
                  except Exception:
                      data = {}
              qualification = data.get("paid_probe_qualification") if isinstance(data,dict) else {}
              if not isinstance(qualification,dict):
                  qualification = {}
              instant = data.get("instant_check") if isinstance(data,dict) else {}
              if not isinstance(instant,dict):
                  instant = {}
              results[label] = {
                  "http_status": code,
                  "ok": data.get("ok") if isinstance(data,dict) else None,
                  "message": data.get("message") if isinstance(data,dict) else None,
                  "qualified": qualification.get("qualified"),
                  "reason": qualification.get("reason"),
                  "hint": qualification.get("hint"),
                  "instant_ok": instant.get("ok"),
                  "verdict": ((instant.get("summary") or {}).get("verdict") if isinstance(instant.get("summary"),dict) else None),
              }
              if code not in (200,201,202,409):
                  raise SystemExit(f"{label} Market402 submit returned HTTP {code}")

          print(json.dumps(results,separators=(",",":"),sort_keys=True))

          def codeify(v,limit=44):
              return re.sub(r'[^a-z0-9._-]+','-',str(v).lower()).strip("-")[:limit] or "unknown"

          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              for label in ("guard","ping"):
                  row=results[label]
                  out.write(f"{label}_qualified={'true' if row['qualified'] is True else 'false' if row['qualified'] is False else 'unknown'}\n")
                  out.write(f"{label}_reason={codeify(row['reason'])}\n")
                  out.write(f"{label}_verdict={codeify(row['verdict'])}\n")
          PY

      - name: Publish auditable qualification statuses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          GUARD_QUALIFIED: ${{ steps.submit.outputs.guard_qualified }}
          GUARD_REASON: ${{ steps.submit.outputs.guard_reason }}
          GUARD_VERDICT: ${{ steps.submit.outputs.guard_verdict }}
          PING_QUALIFIED: ${{ steps.submit.outputs.ping_qualified }}
          PING_REASON: ${{ steps.submit.outputs.ping_reason }}
          PING_VERDICT: ${{ steps.submit.outputs.ping_verdict }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          rows=[
            ("guard",os.environ.get("GUARD_QUALIFIED","unknown"),os.environ.get("GUARD_REASON","unknown"),os.environ.get("GUARD_VERDICT","unknown")),
            ("ping",os.environ.get("PING_QUALIFIED","unknown"),os.environ.get("PING_REASON","unknown"),os.environ.get("PING_VERDICT","unknown")),
          ]
          for label,qualified,reason,verdict in rows:
              state="success" if qualified=="true" else "pending"
              context=f"distribution/market402-{label}-qualified-{qualified}-{reason}-{verdict}"[:100]
              payload={
                "state":state,
                "context":context,
                "description":f"Market402 {label} paid-probe qualification",
                "target_url":"https://market402.com/methodology"
              }
              req=urllib.request.Request(
                f"https://api.github.com/repos/waxsway/agentresolver/statuses/{os.environ['SHA']}",
                data=json.dumps(payload).encode(),
                headers={
                  "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept":"application/vnd.github+json",
                  "Content-Type":"application/json",
                  "X-GitHub-Api-Version":"2022-11-28"
                },
                method="POST"
              )
              with urllib.request.urlopen(req,timeout=30) as resp: print(resp.status)
          PY
