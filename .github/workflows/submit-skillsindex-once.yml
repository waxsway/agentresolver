name: Submit AgentResolver Procurement to SkillsIndex

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/submit-skillsindex-once.yml"

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Submit AgentResolver procurement MCP
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/out -w "%{http_code}" \
            -X POST "https://skillsindex.dev/api/mcp/submit/" \
            -H "Content-Type: application/json" \
            --data '{"name":"AgentResolver","github_url":"https://github.com/waxsway/agentresolver","description":"Free non-custodial capability procurement for autonomous agents over MCP: discover and rank API, MCP, and x402 services under explicit budget, network, protocol, schema, side-effect, and auth constraints. Includes installable procurement and x402 payment-guard Agent Skills.","ecosystem":"mcp_server","category":"ai-llm"}')
          echo "HTTP $code"
          cat /tmp/out
          test "$code" -ge 200 && test "$code" -lt 300
