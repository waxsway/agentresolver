name: Audit Agent402 Routing Visibility

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-agent402-routing.yml

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Query free Agent402 finder
        id: query
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          q = "verify x402 payment before paying"
          url = "https://agent402.tools/api/find?" + urllib.parse.urlencode({"q": q})
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "agentresolver-discovery-audit/1.0 (+https://github.com/waxsway/agentresolver)"}
          )

          status = 0
          body = ""
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  status = resp.status
                  body = resp.read().decode("utf-8", "replace")
          except Exception as exc:
              body = f"{type(exc).__name__}: {exc}"

          lower = body.lower()
          found = "agentresolver.vercel.app" in lower or "agentresolver" in lower
          print(json.dumps({
              "status": status,
              "query": q,
              "agentresolverFound": found,
              "bodyPreview": body.replace("\n", " ").replace("\r", " ")[:1800]
          }))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"http_status={status}\n")
              out.write(f"found={'true' if found else 'false'}\n")
          if status != 200:
              raise SystemExit(1)
          PY

      - name: Query free external Smart Order Router quote
        id: external_route
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          q = "verify x402 payment before paying"
          url = "https://agent402.tools/api/route?" + urllib.parse.urlencode({"q": q, "include": "external"})
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "agentresolver-discovery-audit/1.0 (+https://github.com/waxsway/agentresolver)"}
          )
          status = 0
          body = ""
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  status = resp.status
                  body = resp.read().decode("utf-8", "replace")
          except Exception as exc:
              body = f"{type(exc).__name__}: {exc}"
          lower = body.lower()
          found = "agentresolver.vercel.app" in lower or "agentresolver" in lower
          print(json.dumps({
              "status": status,
              "query": q,
              "include": "external",
              "agentresolverSelected": found,
              "bodyPreview": body.replace("\n", " ").replace("\r", " ")[:2400]
          }))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"http_status={status}\n")
              out.write(f"found={'true' if found else 'false'}\n")
          if status != 200:
              raise SystemExit(1)
          PY

      - name: Verify selected AgentResolver route is executable
        id: route_contract
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, urllib.parse, urllib.request

          q = "verify x402 payment before paying"
          url = "https://agent402.tools/api/route?" + urllib.parse.urlencode({"q": q, "include": "external"})
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "agentresolver-discovery-audit/1.0 (+https://github.com/waxsway/agentresolver)"}
          )
          with urllib.request.urlopen(req, timeout=60) as resp:
              status = resp.status
              raw = resp.read().decode("utf-8", "replace")
          data = json.loads(raw)

          def walk(value, parents=()):
              if isinstance(value, dict):
                  yield value, parents
                  for k, v in value.items():
                      yield from walk(v, parents + (str(k),))
              elif isinstance(value, list):
                  for i, v in enumerate(value):
                      yield from walk(v, parents + (str(i),))

          selected = None
          for obj, parents in walk(data):
              blob = json.dumps(obj, separators=(",", ":"), sort_keys=True).lower()
              if "agentresolver.vercel.app" in blob:
                  selected = obj
                  break

          selected_blob = json.dumps(selected or {}, separators=(",", ":"), sort_keys=True)
          lower = selected_blob.lower()
          urls = re.findall(r'https://agentresolver\.vercel\.app[^"\\\s]*', selected_blob)
          endpoint = urls[0] if urls else ""
          path = urllib.parse.urlparse(endpoint).path if endpoint else ""
          path_code = path.strip("/").replace("/", "-") or "unknown"
          has_url_input = (
              '"required":["url"]' in lower
              or '"url":{"' in lower
              or '"url": {' in lower
              or '"url"' in lower and ("inputschema" in lower or "queryparams" in lower)
          )
          is_preflight = "/api/x402-payment-preflight" in lower or "/api/payment-guard" in lower
          price_ok = any(token in lower for token in ['"0.001"', '"0.0010"', '"1000"', '"price":0.001', '"priceusd":0.001'])

          print(json.dumps({
              "httpStatus": status,
              "endpoint": endpoint,
              "path": path,
              "isPreflightOrGuard": is_preflight,
              "hasUrlInput": has_url_input,
              "priceLooksEligible": price_ok,
              "selectedPreview": selected_blob[:2400]
          }))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"path_code={path_code[:48]}\n")
              out.write(f"is_preflight={'true' if is_preflight else 'false'}\n")
              out.write(f"has_url_input={'true' if has_url_input else 'false'}\n")
              out.write(f"price_ok={'true' if price_ok else 'false'}\n")

          if status != 200 or not selected or not is_preflight or not has_url_input:
              raise SystemExit(1)
          PY

      - name: Publish selected-route contract status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          PATH_CODE: ${{ steps.route_contract.outputs.path_code }}
          IS_PREFLIGHT: ${{ steps.route_contract.outputs.is_preflight }}
          HAS_URL_INPUT: ${{ steps.route_contract.outputs.has_url_input }}
          PRICE_OK: ${{ steps.route_contract.outputs.price_ok }}
        run: |
          if [ "$IS_PREFLIGHT" = "true" ] && [ "$HAS_URL_INPUT" = "true" ]; then
            STATE=success
            CONTRACT=executable
          else
            STATE=failure
            CONTRACT=blocked
          fi
          CONTEXT="distribution/agent402-route-${PATH_CODE:-unknown}-${CONTRACT}-url-${HAS_URL_INPUT:-false}"
          export STATE CONTEXT
          python - <<'PY'
          import json, os, urllib.request
          payload = {
              "state": os.environ["STATE"],
              "context": os.environ["CONTEXT"][:100],
              "description": "Agent402 selected route contract checked for canonical Preflight input",
              "target_url": "https://agent402.tools/guides/smart-order-router"
          }
          req = urllib.request.Request(
              f"https://api.github.com/repos/waxsway/agentresolver/statuses/{os.environ['SHA']}",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28"
              },
              method="POST"
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print(resp.status)
          PY

      - name: Publish external-route quote status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          HTTP_STATUS: ${{ steps.external_route.outputs.http_status }}
          FOUND: ${{ steps.external_route.outputs.found }}
        run: |
          if [ "$HTTP_STATUS" = "200" ] && [ "$FOUND" = "true" ]; then
            STATE=success
            CONTEXT="distribution/agent402-external-route-selected"
            DESC="AgentResolver selected by Agent402 external route quote"
          elif [ "$HTTP_STATUS" = "200" ]; then
            STATE=success
            CONTEXT="distribution/agent402-external-route-not-selected"
            DESC="Agent402 external route quote works; another seller selected"
          else
            STATE=failure
            CONTEXT="distribution/agent402-external-route-http-${HTTP_STATUS:-0}"
            DESC="Agent402 external route quote failed"
          fi
          export STATE CONTEXT DESC
          python - <<'PY'
          import json, os, urllib.request
          payload = {
              "state": os.environ["STATE"],
              "context": os.environ["CONTEXT"],
              "description": os.environ["DESC"][:140],
              "target_url": "https://agent402.tools/guides/smart-order-router"
          }
          req = urllib.request.Request(
              f"https://api.github.com/repos/waxsway/agentresolver/statuses/{os.environ['SHA']}",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28"
              },
              method="POST"
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print(resp.status)
          PY

      - name: Publish visibility status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          HTTP_STATUS: ${{ steps.query.outputs.http_status }}
          FOUND: ${{ steps.query.outputs.found }}
        run: |
          if [ "$HTTP_STATUS" = "200" ] && [ "$FOUND" = "true" ]; then
            STATE=success
            CONTEXT="distribution/agent402-router-visible"
            DESC="AgentResolver found by Agent402 free finder"
          elif [ "$HTTP_STATUS" = "200" ]; then
            STATE=success
            CONTEXT="distribution/agent402-router-not-yet"
            DESC="Agent402 query worked; AgentResolver not returned yet"
          else
            STATE=failure
            CONTEXT="distribution/agent402-router-http-${HTTP_STATUS:-0}"
            DESC="Agent402 free finder query failed"
          fi
          export STATE CONTEXT DESC
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/waxsway/agentresolver/statuses/{os.environ['SHA']}"
          payload = {
              "state": os.environ["STATE"],
              "context": os.environ["CONTEXT"],
              "description": os.environ["DESC"][:140],
              "target_url": "https://agent402.tools/marketplace"
          }
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28"
              },
              method="POST"
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print(resp.status, resp.read().decode("utf-8", "replace")[:500])
          PY
