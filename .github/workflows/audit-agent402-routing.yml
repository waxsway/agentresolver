name: Audit Agent402 Routing Visibility

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-agent402-routing.yml

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Query free Agent402 finder
        id: query
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          q = "verify x402 payment before paying"
          url = "https://agent402.tools/api/find?" + urllib.parse.urlencode({"q": q})
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "agentresolver-discovery-audit/1.0 (+https://github.com/waxsway/agentresolver)"}
          )

          status = 0
          body = ""
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  status = resp.status
                  body = resp.read().decode("utf-8", "replace")
          except Exception as exc:
              body = f"{type(exc).__name__}: {exc}"

          lower = body.lower()
          found = "agentresolver.vercel.app" in lower or "agentresolver" in lower
          print(json.dumps({
              "status": status,
              "query": q,
              "agentresolverFound": found,
              "bodyPreview": body.replace("\n", " ").replace("\r", " ")[:1800]
          }))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"http_status={status}\n")
              out.write(f"found={'true' if found else 'false'}\n")
          if status != 200:
              raise SystemExit(1)
          PY

      - name: Query free external Smart Order Router quote
        id: external_route
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          q = "verify x402 payment before paying"
          url = "https://agent402.tools/api/route?" + urllib.parse.urlencode({"q": q, "include": "external"})
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "agentresolver-discovery-audit/1.0 (+https://github.com/waxsway/agentresolver)"}
          )
          status = 0
          body = ""
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  status = resp.status
                  body = resp.read().decode("utf-8", "replace")
          except Exception as exc:
              body = f"{type(exc).__name__}: {exc}"
          rank = 0
          agent = None
          top = None
          if status == 200:
              try:
                  payload = json.loads(body)
                  results = payload.get("results") or []
                  top = results[0] if results else None
                  for idx, item in enumerate(results, 1):
                      blob = json.dumps(item, separators=(",", ":"), sort_keys=True).lower()
                      if "agentresolver.vercel.app" in blob or '"sellername":"agentresolver"' in blob:
                          rank = idx
                          agent = item
                          break
              except Exception:
                  pass
          print(json.dumps({
              "status": status,
              "query": q,
              "include": "external",
              "agentresolverRank": rank or None,
              "topResult": top,
              "agentresolverResult": agent
          }, separators=(",", ":"), sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"http_status={status}\n")
              out.write(f"rank={rank}\n")
          if status != 200:
              raise SystemExit(1)
          PY

      - name: Verify selected AgentResolver route is executable
        id: route_contract
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, urllib.parse, urllib.request

          q = "verify x402 payment before paying"
          url = "https://agent402.tools/api/route?" + urllib.parse.urlencode({"q": q, "include": "external"})
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "agentresolver-discovery-audit/1.0 (+https://github.com/waxsway/agentresolver)"}
          )
          with urllib.request.urlopen(req, timeout=60) as resp:
              status = resp.status
              raw = resp.read().decode("utf-8", "replace")
          payload = json.loads(raw)
          results = payload.get("results") or []

          agent = None
          rank = 0
          for idx, item in enumerate(results, 1):
              blob = json.dumps(item, separators=(",", ":"), sort_keys=True).lower()
              if "agentresolver.vercel.app" in blob or '"sellername":"agentresolver"' in blob:
                  agent = item
                  rank = idx
                  break

          def strings(value):
              if isinstance(value, str):
                  yield value
              elif isinstance(value, dict):
                  for v in value.values():
                      yield from strings(v)
              elif isinstance(value, list):
                  for v in value:
                      yield from strings(v)

          agent_blob = json.dumps(agent or {}, separators=(",", ":"), sort_keys=True)
          lower = agent_blob.lower()
          candidates = []
          for value in strings(agent or {}):
              if "agentresolver.vercel.app" not in value.lower():
                  continue
              match = re.search(r'https://agentresolver\.vercel\.app[^\s"<>]*', value)
              if match:
                  candidates.append(match.group(0).rstrip("),.;"))

          endpoint = candidates[0] if candidates else ""
          path = urllib.parse.urlparse(endpoint).path if endpoint else ""
          path_code = path.strip("/").replace("/", "-") or "unknown"
          is_preflight = any(
              p in lower
              for p in ("/api/x402-payment-preflight", "/api/payment-guard")
          )
          has_url_input = (
              '"required":["url"]' in lower
              or '"url":{"' in lower
              or '"url": {' in lower
              or ("inputschema" in lower and '"url"' in lower)
              or ("queryparams" in lower and '"url"' in lower)
          )
          keys_code = "-".join(sorted(str(k).lower().replace("_","-") for k in (agent or {}).keys()))[:45] or "none"

          print(json.dumps({
              "httpStatus": status,
              "rank": rank or None,
              "endpoint": endpoint,
              "path": path,
              "isPreflightOrGuard": is_preflight,
              "hasUrlInputInQuote": has_url_input,
              "itemKeys": sorted((agent or {}).keys()),
              "agentResult": agent
          }, separators=(",", ":"), sort_keys=True))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"path_code={path_code[:48]}\n")
              out.write(f"rank={rank}\n")
              out.write(f"is_preflight={'true' if is_preflight else 'false'}\n")
              out.write(f"has_url_input={'true' if has_url_input else 'false'}\n")
              out.write(f"keys_code={keys_code}\n")

          if status != 200 or agent is None or not is_preflight:
              raise SystemExit(1)
          PY

      - name: Publish selected-route contract status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          PATH_CODE: ${{ steps.route_contract.outputs.path_code }}
          IS_PREFLIGHT: ${{ steps.route_contract.outputs.is_preflight }}
          HAS_URL_INPUT: ${{ steps.route_contract.outputs.has_url_input }}
          PRICE_OK: ${{ steps.route_contract.outputs.price_ok }}
        run: |
          if [ "$IS_PREFLIGHT" = "true" ] && [ "$HAS_URL_INPUT" = "true" ]; then
            STATE=success
            CONTRACT=executable
          else
            STATE=failure
            CONTRACT=blocked
          fi
          CONTEXT="distribution/agent402-route-${PATH_CODE:-unknown}-${CONTRACT}-url-${HAS_URL_INPUT:-false}"
          export STATE CONTEXT
          python - <<'PY'
          import json, os, urllib.request
          payload = {
              "state": os.environ["STATE"],
              "context": os.environ["CONTEXT"][:100],
              "description": "Agent402 selected route contract checked for canonical Preflight input",
              "target_url": "https://agent402.tools/guides/smart-order-router"
          }
          req = urllib.request.Request(
              f"https://api.github.com/repos/waxsway/agentresolver/statuses/{os.environ['SHA']}",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28"
              },
              method="POST"
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print(resp.status)
          PY

      - name: Measure AgentResolver external rank by settlement chain
        id: chain_rank
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          q = "verify x402 payment before paying"
          ranks = {}
          for network in ("base", "solana"):
              url = "https://agent402.tools/api/route?" + urllib.parse.urlencode({
                  "q": q,
                  "include": "external",
                  "network": network,
              })
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "agentresolver-discovery-audit/1.0 (+https://github.com/waxsway/agentresolver)"}
              )
              rank = 0
              result = None
              with urllib.request.urlopen(req, timeout=60) as resp:
                  payload = json.loads(resp.read().decode("utf-8", "replace"))
              for item_idx, item in enumerate(payload.get("results") or [], 1):
                  blob = json.dumps(item, separators=(",", ":"), sort_keys=True).lower()
                  if "agentresolver.vercel.app" in blob or '"sellername":"agentresolver"' in blob:
                      rank = item_idx
                      result = item
                      break
              ranks[network] = {"rank": rank or None, "result": result}
              print(json.dumps({"network":network,"rank":rank or None,"result":result}, separators=(",",":"), sort_keys=True))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"base_rank={ranks['base']['rank'] or 0}\n")
              out.write(f"solana_rank={ranks['solana']['rank'] or 0}\n")
          PY

      - name: Publish chain-specific route ranks
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          BASE_RANK: ${{ steps.chain_rank.outputs.base_rank }}
          SOLANA_RANK: ${{ steps.chain_rank.outputs.solana_rank }}
        run: |
          for pair in "base:$BASE_RANK" "solana:$SOLANA_RANK"; do
            network="${pair%%:*}"
            rank="${pair#*:}"
            if [ "${rank:-0}" -gt 0 ]; then
              STATE=success
              CONTEXT="distribution/agent402-${network}-rank-${rank}"
              DESC="AgentResolver external route rank ${rank} on ${network}"
            else
              STATE=success
              CONTEXT="distribution/agent402-${network}-not-ranked"
              DESC="AgentResolver absent from external ${network} route results"
            fi
            export STATE CONTEXT DESC
            python - <<'PY'
          import json, os, urllib.request
          payload = {
              "state": os.environ["STATE"],
              "context": os.environ["CONTEXT"][:100],
              "description": os.environ["DESC"][:140],
              "target_url": "https://agent402.tools/guides/smart-order-router"
          }
          req = urllib.request.Request(
              f"https://api.github.com/repos/waxsway/agentresolver/statuses/{os.environ['SHA']}",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28"
              },
              method="POST"
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print(resp.status)
          PY
          done

      - name: Fingerprint #1 external route competitor
        id: top_competitor
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, urllib.parse, urllib.request

          q = "verify x402 payment before paying"
          url = "https://agent402.tools/api/route?" + urllib.parse.urlencode({"q": q, "include": "external"})
          req = urllib.request.Request(url, headers={"User-Agent":"agentresolver-discovery-audit/1.0 (+https://github.com/waxsway/agentresolver)"})
          with urllib.request.urlopen(req, timeout=60) as resp:
              payload = json.loads(resp.read().decode("utf-8", "replace"))
          results = payload.get("results") or []
          top = results[0] if results else {}

          def strings(v):
              if isinstance(v, str):
                  yield v
              elif isinstance(v, dict):
                  for x in v.values():
                      yield from strings(x)
              elif isinstance(v, list):
                  for x in v:
                      yield from strings(x)

          blob = json.dumps(top, separators=(",", ":"), sort_keys=True)
          urls = []
          for value in strings(top):
              for match in re.finditer(r'https://[^\s"<>]+', value):
                  urls.append(match.group(0).rstrip("),.;"))
          endpoint = urls[0] if urls else ""
          parsed = urllib.parse.urlparse(endpoint)
          host = (parsed.hostname or str(top.get("sellerName") or top.get("seller") or "unknown")).lower()
          path = parsed.path or str(top.get("route") or top.get("slug") or "unknown")
          host_code = re.sub(r'[^a-z0-9.-]+', '-', host)[:34]
          path_code = re.sub(r'[^a-z0-9-]+', '-', path.lower().strip("/").replace("/","-"))[:30] or "unknown"

          price = None
          for key in ("underlyingPriceUsd","priceUsd","price","price_amount","priceAmount"):
              if key in top:
                  price = top.get(key)
                  break
          if price is None:
              m = re.search(r'"(?:underlyingpriceusd|priceusd|price|price_amount|priceamount)":("?)([0-9.]+)', blob.lower())
              if m:
                  price = m.group(2)
          price_code = re.sub(r'[^0-9.]','',str(price or "unknown"))[:10] or "unknown"

          print(json.dumps({"top":top,"endpoint":endpoint,"host":host,"path":path,"price":price}, separators=(",",":"), sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write(f"host={host_code}\n")
              out.write(f"path={path_code}\n")
              out.write(f"price={price_code}\n")
          PY

      - name: Publish #1 competitor fingerprint
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          HOST: ${{ steps.top_competitor.outputs.host }}
          PATH_CODE: ${{ steps.top_competitor.outputs.path }}
          PRICE: ${{ steps.top_competitor.outputs.price }}
        shell: bash
        run: |
          CONTEXT="distribution/agent402-top-${HOST:-unknown}-${PATH_CODE:-unknown}-usd-${PRICE:-unknown}"
          export CONTEXT
          python - <<'PY'
          import json, os, urllib.request
          payload={
            "state":"success",
            "context":os.environ["CONTEXT"][:100],
            "description":"Current #1 external route result for AgentResolver payment-verification intent",
            "target_url":"https://agent402.tools/guides/smart-order-router"
          }
          req=urllib.request.Request(
            f"https://api.github.com/repos/waxsway/agentresolver/statuses/{os.environ['SHA']}",
            data=json.dumps(payload).encode(),
            headers={
              "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
              "Accept":"application/vnd.github+json",
              "Content-Type":"application/json",
              "X-GitHub-Api-Version":"2022-11-28"
            },
            method="POST"
          )
          with urllib.request.urlopen(req,timeout=30) as resp:
              print(resp.status)
          PY

      - name: Compare Agent402 seller health for #1 and #2
        id: seller_health
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, urllib.request

          req = urllib.request.Request(
              "https://agent402.tools/api/index",
              headers={"User-Agent":"agentresolver-discovery-audit/1.0 (+https://github.com/waxsway/agentresolver)"}
          )
          with urllib.request.urlopen(req, timeout=60) as resp:
              payload = json.loads(resp.read().decode("utf-8", "replace"))
          sellers = payload.get("sellers") or []

          def find_seller(needle):
              for seller in sellers:
                  blob = json.dumps(seller, separators=(",",":"), sort_keys=True).lower()
                  if needle in blob:
                      return seller
              return None

          def extract(seller):
              seller = seller or {}
              flat = {}
              def walk(v, prefix=""):
                  if isinstance(v, dict):
                      for k, x in v.items():
                          key = f"{prefix}.{k}" if prefix else str(k)
                          if isinstance(x, (str,int,float,bool)) or x is None:
                              flat[key] = x
                          else:
                              walk(x, key)
              walk(seller)
              health = None
              health_key = None
              for key, value in flat.items():
                  lk=key.lower()
                  if "health" in lk and isinstance(value,(str,int,float,bool)):
                      health_key, health = key, value
                      if lk.endswith("health") or "rolling" in lk:
                          break
              eligible = None
              reason = None
              for key,value in flat.items():
                  lk=key.lower()
                  if "routerdispatcheligible" in lk or ("dispatch" in lk and "eligible" in lk):
                      eligible=value
                  if "routerdispatchreason" in lk or ("dispatch" in lk and "reason" in lk):
                      reason=value
              return health_key, health, eligible, reason, sorted(flat.keys())

          ar = find_seller("agentresolver.vercel.app")
          dx = find_seller("api.delx.ai")
          ar_info = extract(ar)
          dx_info = extract(dx)

          print(json.dumps({
              "agentresolver":{"seller":ar,"healthKey":ar_info[0],"health":ar_info[1],"dispatchEligible":ar_info[2],"dispatchReason":ar_info[3],"keys":ar_info[4]},
              "delx":{"seller":dx,"healthKey":dx_info[0],"health":dx_info[1],"dispatchEligible":dx_info[2],"dispatchReason":dx_info[3],"keys":dx_info[4]}
          }, separators=(",",":"), sort_keys=True))

          def code(v):
              return re.sub(r'[^a-z0-9.-]+','-',str(v).lower())[:24] if v is not None else "unknown"

          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write(f"ar_found={'true' if ar else 'false'}\n")
              out.write(f"ar_health={code(ar_info[1])}\n")
              out.write(f"ar_dispatch={code(ar_info[2])}\n")
              out.write(f"ar_reason={code(ar_info[3])}\n")
              out.write(f"dx_found={'true' if dx else 'false'}\n")
              out.write(f"dx_health={code(dx_info[1])}\n")
              out.write(f"dx_dispatch={code(dx_info[2])}\n")
              out.write(f"dx_reason={code(dx_info[3])}\n")
          PY

      - name: Publish seller health comparison
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          AR_FOUND: ${{ steps.seller_health.outputs.ar_found }}
          AR_HEALTH: ${{ steps.seller_health.outputs.ar_health }}
          AR_DISPATCH: ${{ steps.seller_health.outputs.ar_dispatch }}
          AR_REASON: ${{ steps.seller_health.outputs.ar_reason }}
          DX_FOUND: ${{ steps.seller_health.outputs.dx_found }}
          DX_HEALTH: ${{ steps.seller_health.outputs.dx_health }}
          DX_DISPATCH: ${{ steps.seller_health.outputs.dx_dispatch }}
          DX_REASON: ${{ steps.seller_health.outputs.dx_reason }}
        shell: bash
        run: |
          for item in "agentresolver:$AR_FOUND:$AR_HEALTH:$AR_DISPATCH:$AR_REASON" "delx:$DX_FOUND:$DX_HEALTH:$DX_DISPATCH:$DX_REASON"; do
            IFS=: read -r seller found health dispatch reason <<< "$item"
            if [ "$found" = "true" ]; then state=success; else state=failure; fi
            CONTEXT="distribution/agent402-health-${seller}-${health}-dispatch-${dispatch}-${reason}"
            export state CONTEXT
            python - <<'PY'
          import json, os, urllib.request
          payload={
            "state":os.environ["state"],
            "context":os.environ["CONTEXT"][:100],
            "description":"Agent402 current seller health/dispatch snapshot",
            "target_url":"https://agent402.tools/api/index"
          }
          req=urllib.request.Request(
            f"https://api.github.com/repos/waxsway/agentresolver/statuses/{os.environ['SHA']}",
            data=json.dumps(payload).encode(),
            headers={
              "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
              "Accept":"application/vnd.github+json",
              "Content-Type":"application/json",
              "X-GitHub-Api-Version":"2022-11-28"
            },
            method="POST"
          )
          with urllib.request.urlopen(req,timeout=30) as resp:
              print(resp.status)
          PY
          done

      - name: Publish external-route quote status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          HTTP_STATUS: ${{ steps.external_route.outputs.http_status }}
          RANK: ${{ steps.external_route.outputs.rank }}
        run: |
          if [ "$HTTP_STATUS" = "200" ] && [ "${RANK:-0}" -gt 0 ]; then
            STATE=success
            CONTEXT="distribution/agent402-external-route-rank-${RANK}"
            if [ "$RANK" = "1" ]; then
              DESC="AgentResolver is #1 external route result"
            else
              DESC="AgentResolver is external route result #${RANK}"
            fi
          elif [ "$HTTP_STATUS" = "200" ]; then
            STATE=success
            CONTEXT="distribution/agent402-external-route-not-ranked"
            DESC="AgentResolver absent from Agent402 external route results"
          else
            STATE=failure
            CONTEXT="distribution/agent402-external-route-http-${HTTP_STATUS:-0}"
            DESC="Agent402 external route quote failed"
          fi
          export STATE CONTEXT DESC
          python - <<'PY'
          import json, os, urllib.request
          payload = {
              "state": os.environ["STATE"],
              "context": os.environ["CONTEXT"],
              "description": os.environ["DESC"][:140],
              "target_url": "https://agent402.tools/guides/smart-order-router"
          }
          req = urllib.request.Request(
              f"https://api.github.com/repos/waxsway/agentresolver/statuses/{os.environ['SHA']}",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28"
              },
              method="POST"
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print(resp.status)
          PY

      - name: Publish visibility status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          HTTP_STATUS: ${{ steps.query.outputs.http_status }}
          FOUND: ${{ steps.query.outputs.found }}
        run: |
          if [ "$HTTP_STATUS" = "200" ] && [ "$FOUND" = "true" ]; then
            STATE=success
            CONTEXT="distribution/agent402-router-visible"
            DESC="AgentResolver found by Agent402 free finder"
          elif [ "$HTTP_STATUS" = "200" ]; then
            STATE=success
            CONTEXT="distribution/agent402-router-not-yet"
            DESC="Agent402 query worked; AgentResolver not returned yet"
          else
            STATE=failure
            CONTEXT="distribution/agent402-router-http-${HTTP_STATUS:-0}"
            DESC="Agent402 free finder query failed"
          fi
          export STATE CONTEXT DESC
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/waxsway/agentresolver/statuses/{os.environ['SHA']}"
          payload = {
              "state": os.environ["STATE"],
              "context": os.environ["CONTEXT"],
              "description": os.environ["DESC"][:140],
              "target_url": "https://agent402.tools/marketplace"
          }
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28"
              },
              method="POST"
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print(resp.status, resp.read().decode("utf-8", "replace")[:500])
          PY
