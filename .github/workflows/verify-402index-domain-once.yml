name: Verify 402 Index Domain Once

on:
  push:
    branches:
      - main
    paths:
      - public/.well-known/402index-verify.txt
      - .github/workflows/verify-402index-domain-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for public verification proof
        shell: bash
        env:
          VERIFY_URL: https://agentresolver.vercel.app/.well-known/402index-verify.txt
          EXPECTED_HASH: 19cb26d6891c575b335365fcdf7afc2f6b2958b5b0a71391f18a0d79eabd3c2a
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            value="$(curl -fsS "$VERIFY_URL" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$value" = "$EXPECTED_HASH" ]; then
              echo 'Public 402 Index verification proof is live.'
              exit 0
            fi
            echo "Waiting for canonical verification proof (attempt $attempt/30)..."
            sleep 10
          done
          echo 'Verification proof did not become live in time.'
          exit 1

      - name: Verify domain with 402 Index
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS \
            -o /tmp/verify.json \
            -w '%{http_code}' \
            -X POST 'https://402index.io/api/v1/claim/verify' \
            -H 'content-type: application/json' \
            --data '{"domain":"agentresolver.vercel.app"}')"

          jq '{domain, status, services_count, message, error}' /tmp/verify.json || true
          if [ "$status" != "200" ]; then
            echo "402 Index domain verification failed with HTTP $status"
            exit 1
          fi

          verified="$(jq -r '.status // empty' /tmp/verify.json)"
          if [ "$verified" != "verified" ]; then
            echo "Expected verified status, got: $verified"
            exit 1
          fi

          echo 'AgentResolver hostname verified with 402 Index.'
