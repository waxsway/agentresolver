name: Prepare NoHumans Single Purchase Invoice

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/prepare-nohumans-single-invoice.yml'

permissions:
  contents: read

jobs:
  invoice:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request public $3 single-plan x402 challenge
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 30 -D /tmp/headers.txt -o /tmp/body.json -w '%{http_code}' \
            -X POST 'https://api.nohumans.directory/v1/listings/28e33786-f07/verify-now?plan=single')"
          echo "NOHUMANS_INVOICE_HTTP=$code"
          test "$code" = "402"

          echo '=== response body ==='
          jq . /tmp/body.json 2>/dev/null || cat /tmp/body.json

          echo '=== selected headers ==='
          awk 'BEGIN{IGNORECASE=1} /^(payment-required|content-type|x402-version|www-authenticate):/ {print}' /tmp/headers.txt

          python3 - <<'PY'
          import base64, json
          value=None
          for line in open('/tmp/headers.txt', errors='ignore'):
              if line.lower().startswith('payment-required:'):
                  value=line.split(':',1)[1].strip()
                  break
          if not value:
              raise SystemExit('payment-required header missing')
          pad='='*((4-len(value)%4)%4)
          obj=json.loads(base64.b64decode(value+pad).decode())
          print('=== decoded payment-required ===')
          print(json.dumps(obj,indent=2))
          PY
