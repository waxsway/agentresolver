name: Update CDP Lockfile Once

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - '.github/workflows/update-cdp-lockfile-once.yml'

permissions:
  contents: write

jobs:
  update-lock:
    if: github.head_ref == 'feat/cdp-facilitator-ready-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/cdp-facilitator-ready-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "agentresolver-lock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "deps: lock Coinbase CDP SDK"
          git push origin HEAD:feat/cdp-facilitator-ready-20260916
