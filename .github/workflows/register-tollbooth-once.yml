name: Register AgentResolver CDP Guard with Tollbooth

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/register-tollbooth-once.yml"

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TOLLBOOTH_API: https://www.trytollbooth.com
      ENDPOINT_URL: "https://agentresolver.vercel.app/api/cdp-payment-guard?url=https%3A%2F%2Fagentresolver.vercel.app%2Fapi%2Fx402-ping&method=GET"
      PAYOUT_WALLET: "0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8"
    steps:
      - name: Validate live Coinbase-CDP Guard challenge
        shell: bash
        run: |
          set -euo pipefail

          # Use the external request contract Tollbooth itself will see.
          # The target query is required so Guard reaches its 402 payment boundary.
          code="$(curl -sS --connect-timeout 5 --max-time 20             -o /tmp/agentresolver-tollbooth-guard.json             -w '%{http_code}'             "$ENDPOINT_URL" || true)"

          test "$code" = "402"
          jq -e '
            .x402Version == 2 and
            ([.accepts[] | select(
              .scheme == "exact" and
              .network == "eip155:8453" and
              .amount == "2000" and
              .asset == "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913" and
              .payTo == "0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8"
            )] | length) >= 1
          ' /tmp/agentresolver-tollbooth-guard.json >/dev/null

      - name: Register CDP Guard with Tollbooth if absent
        shell: bash
        run: |
          set -euo pipefail

          catalog_status="$(curl -sS             --connect-timeout 10             --max-time 30             -o /tmp/tollbooth-services.json             -w '%{http_code}'             "$TOLLBOOTH_API/api/services?q=AgentResolver" || printf '000')"

          case "$catalog_status" in
            200) ;;
            429|500|502|503|504|000)
              echo "::warning::Tollbooth catalog is temporarily unavailable (HTTP $catalog_status); registration deferred without spend."
              exit 0
              ;;
            *)
              echo "Unexpected Tollbooth catalog status: $catalog_status" >&2
              exit 1
              ;;
          esac

          if jq -e --arg endpoint "$ENDPOINT_URL" '
            [
              .. |
              objects |
              select((.endpoint? // .endpointUrl? // .url? // "") == $endpoint)
            ] | length > 0
          ' /tmp/tollbooth-services.json >/dev/null; then
            echo "AgentResolver CDP Guard is already present in Tollbooth."
            exit 0
          fi

          payload="$(jq -nc             --arg name "AgentResolver CDP Payment Guard"             --arg endpoint "$ENDPOINT_URL"             --arg wallet "$PAYOUT_WALLET"             --arg description "Verify an x402 payment contract before an autonomous agent signs it; Base USDC, non-custodial, Coinbase CDP settlement rail."             '{
              name: $name,
              endpoint: $endpoint,
              category: "developer-tools",
              priceUsdc: 0.002,
              wallet: $wallet,
              chain: "base",
              description: $description
            }')"

          status="$(curl -sS             --connect-timeout 10             --max-time 60             -o /tmp/tollbooth-register.json             -w '%{http_code}'             -X POST "$TOLLBOOTH_API/api/services"             -H 'content-type: application/json'             --data "$payload" || printf '000')"

          echo "Tollbooth CDP Guard registration -> HTTP $status"

          case "$status" in
            200|201|202)
              jq '{
                serviceId: (.service.id // .id // .serviceId // null),
                serviceStatus: (.service.status // .status // null),
                verificationStatus: (.verification.status // null),
                verificationSteps: [
                  (.verification.steps // [])[]? |
                  {
                    name: (.name // .step // null),
                    status: (.status // .result // null),
                    detail: (.detail // .message // null)
                  }
                ]
              }' /tmp/tollbooth-register.json
              ;;
            409)
              echo "Tollbooth reports the CDP Guard is already registered."
              ;;
            429|500|502|503|504|000)
              echo "::warning::Tollbooth registration is temporarily unavailable (HTTP $status); no user spend or identity submission occurred."
              ;;
            *)
              echo "Unexpected Tollbooth registration status: $status" >&2
              jq '{
                error: (.error // null),
                message: (.message // null),
                code: (.code // null)
              }' /tmp/tollbooth-register.json >&2 || true
              exit 1
              ;;
          esac

      - name: Re-check catalog visibility
        shell: bash
        run: |
          set -euo pipefail

          status="$(curl -sS             --connect-timeout 10             --max-time 30             -o /tmp/tollbooth-after.json             -w '%{http_code}'             "$TOLLBOOTH_API/api/services?q=AgentResolver" || printf '000')"

          if [ "$status" != "200" ]; then
            echo "::warning::Tollbooth visibility re-check unavailable (HTTP $status)."
            exit 0
          fi

          if jq -e --arg endpoint "$ENDPOINT_URL" '
            [
              .. |
              objects |
              select((.endpoint? // .endpointUrl? // .url? // "") == $endpoint)
            ] | length > 0
          ' /tmp/tollbooth-after.json >/dev/null; then
            echo "AgentResolver CDP Guard is visible in Tollbooth."
          else
            echo "::notice::Tollbooth accepted or deferred registration but the CDP Guard is not visible in the public catalog yet."
          fi
