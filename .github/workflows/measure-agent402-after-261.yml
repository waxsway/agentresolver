name: Measure Agent402 current routing index

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/measure-agent402-after-261.yml'

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact production SHA
        shell: bash
        run: |
          set -euo pipefail
          expected='b914d834b38460399f682a6015523862489f884d'
          code="$(curl -sS -D /tmp/ping.headers -o /tmp/ping.body -w '%{http_code}' 'https://agentresolver.vercel.app/api/x402-ping')"
          live="$(awk 'BEGIN{IGNORECASE=1} /^x-agentresolver-deployment:/ {gsub("\r",""); print $2; exit}' /tmp/ping.headers)"
          echo "http=$code live_sha=$live"
          test "$code" = "402"
          test "$live" = "$expected"

      - name: Inspect Agent402 seller snapshot read-only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -G 'https://agent402.tools/api/index' \
            --data-urlencode 'seller=agentresolver.vercel.app' \
            -o /tmp/index.json
          jq '{
            origin,
            name:(.manifest.name // .name // null),
            fetchedAt,
            source,
            discoveryPath,
            health,
            routable,
            routerDispatchEligible,
            routerDispatchReason,
            toolCount:((.tools // []) | length),
            relevantTools:[(.tools // [])[]? | select((.route // "") == "/api/x402-ping" or (.route // "") == "/api/x402-payment-preflight") | {name,slug,route,price,priceUsd,method}]
          }' /tmp/index.json

      - name: Measure six buyer intents read-only
        shell: bash
        run: |
          set -euo pipefail
          queries=(
            "x402 settlement test"
            "USDC payment check"
            "endpoint safety"
            "verify endpoint before paying"
            "payTo verification"
            "wallet facilitator payment test"
          )
          visible=0
          eligible=0
          canonical_name_hits=0
          for q in "${queries[@]}"; do
            echo "=== QUERY: $q ==="
            curl -fsS -G 'https://agent402.tools/api/route' \
              --data-urlencode "q=$q" \
              --data-urlencode 'include=external' \
              --data-urlencode 'network=base' \
              -o /tmp/route.json
            jq --arg q "$q" '{
              query:$q,
              top5:[(.results // .routes // .data // [])[0:5][]? | {
                seller,name,route,slug,priceUsd,score,health,routerDispatchEligible,routerDispatchReason,executeVia
              }],
              agentresolver:[(.results // .routes // .data // [])[]? | select(
                ((.seller // "") | tostring | contains("agentresolver.vercel.app")) or
                ((.origin // "") | tostring | contains("agentresolver.vercel.app")) or
                ((.host // "") | tostring | contains("agentresolver.vercel.app"))
              ) | {
                seller,name,route,slug,priceUsd,score,health,routerDispatchEligible,routerDispatchReason,executeVia
              }]
            }' /tmp/route.json
            if grep -Fq 'agentresolver.vercel.app' /tmp/route.json; then
              visible=$((visible+1))
              if jq -e '[(.results // .routes // .data // [])[]? | select(
                  (((.seller // "") | tostring | contains("agentresolver.vercel.app")) or
                   ((.origin // "") | tostring | contains("agentresolver.vercel.app")) or
                   ((.host // "") | tostring | contains("agentresolver.vercel.app"))) and
                  .routerDispatchEligible == true
                )] | length > 0' /tmp/route.json >/dev/null; then
                eligible=$((eligible+1))
              fi
              if jq -e '[(.results // .routes // .data // [])[]? | select(
                  (((.seller // "") | tostring | contains("agentresolver.vercel.app")) or
                   ((.origin // "") | tostring | contains("agentresolver.vercel.app")) or
                   ((.host // "") | tostring | contains("agentresolver.vercel.app"))) and
                  (((.name // "") | tostring | contains("Endpoint Safety")) or
                   ((.name // "") | tostring | contains("USDC Payment Check")) or
                   ((.name // "") | tostring | contains("Wallet Facilitator Payment Test Canary")))
                )] | length > 0' /tmp/route.json >/dev/null; then
                canonical_name_hits=$((canonical_name_hits+1))
              fi
            fi
          done
          echo "AGENTRESOLVER_VISIBLE_QUERIES=$visible"
          echo "AGENTRESOLVER_DISPATCH_ELIGIBLE_QUERIES=$eligible"
          echo "AGENTRESOLVER_CANONICAL_NAME_QUERIES=$canonical_name_hits"
          echo "READ_ONLY_PROBE=true"
