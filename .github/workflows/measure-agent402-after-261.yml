name: Measure AgentResolver discovery surfaces

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/measure-agent402-after-261.yml'

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact production SHA
        shell: bash
        run: |
          set -euo pipefail
          expected='39579d351d9fcbd40e2455359bc42f09eb60e49f'
          code="$(curl -sS -D /tmp/ping.headers -o /tmp/ping.body -w '%{http_code}' 'https://agentresolver.vercel.app/api/x402-ping')"
          live="$(awk 'BEGIN{IGNORECASE=1} /^x-agentresolver-deployment:/ {gsub("\r",""); print $2; exit}' /tmp/ping.headers)"
          echo "http=$code live_sha=$live"
          test "$code" = "402"
          test "$live" = "$expected"

      - name: Verify live OpenAPI exact-intent bindings
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://agentresolver.vercel.app/openapi.json' -o /tmp/openapi.json
          jq '{
            settlementGet:{
              summary:.paths["/api/x402-ping"].get.summary,
              operationId:.paths["/api/x402-ping"].get.operationId,
              description:.paths["/api/x402-ping"].get.description
            },
            usdcCheck:{
              summary:.paths["/api/usdc-payment-check"].post.summary,
              operationId:.paths["/api/usdc-payment-check"].post.operationId,
              description:.paths["/api/usdc-payment-check"].post.description,
              paymentFields:(.paths["/api/usdc-payment-check"].post | with_entries(select(.key | test("payment|x402"; "i"))))
            }
          }' /tmp/openapi.json
          test "$(jq -r '.paths["/api/x402-ping"].get.summary' /tmp/openapi.json)" = 'x402 Settlement Test'
          test "$(jq -r '.paths["/api/x402-ping"].get.operationId' /tmp/openapi.json)" = 'x402SettlementPingGet'
          test "$(jq -r '.paths["/api/usdc-payment-check"].post.summary' /tmp/openapi.json)" = 'USDC Payment Check'
          test "$(jq -r '.paths["/api/usdc-payment-check"].post.operationId' /tmp/openapi.json)" = 'usdcPaymentCheck'

      - name: Inspect Agent402 seller snapshot read-only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -G 'https://agent402.tools/api/index' \
            --data-urlencode 'seller=agentresolver.vercel.app' \
            -o /tmp/index.json
          jq '{
            origin,
            name:(.manifest.name // .name // null),
            fetchedAt,
            fetchedAtIso:(if .fetchedAt then (.fetchedAt / 1000 | todateiso8601) else null end),
            source,
            discoveryPath,
            health,
            routable,
            routerDispatchEligible,
            routerDispatchReason,
            toolCount:((.tools // []) | length),
            relevantTools:[(.tools // [])[]? | select((.route // "") == "/api/x402-ping" or (.route // "") == "/api/x402-payment-preflight" or (.route // "") == "/api/usdc-payment-check") | {name,slug,route,price,priceUsd,method}]
          }' /tmp/index.json

      - name: Measure six Agent402 buyer intents read-only
        shell: bash
        run: |
          set -euo pipefail
          queries=(
            "x402 settlement test"
            "USDC payment check"
            "endpoint safety"
            "verify endpoint before paying"
            "payTo verification"
            "wallet facilitator payment test"
          )
          visible=0
          eligible=0
          for q in "${queries[@]}"; do
            echo "=== QUERY: $q ==="
            curl -fsS -G 'https://agent402.tools/api/route' \
              --data-urlencode "q=$q" \
              --data-urlencode 'include=external' \
              --data-urlencode 'network=base' \
              -o /tmp/route.json
            jq --arg q "$q" '{
              query:$q,
              top5:[(.results // .routes // .data // [])[0:5][]? | {
                seller,name,route,slug,priceUsd,score,health,routerDispatchEligible,routerDispatchReason,executeVia
              }],
              agentresolver:[(.results // .routes // .data // [])[]? | select(
                ((.seller // "") | tostring | contains("agentresolver.vercel.app")) or
                ((.origin // "") | tostring | contains("agentresolver.vercel.app")) or
                ((.host // "") | tostring | contains("agentresolver.vercel.app"))
              ) | {
                seller,name,route,slug,priceUsd,score,health,routerDispatchEligible,routerDispatchReason,executeVia
              }]
            }' /tmp/route.json
            if grep -Fq 'agentresolver.vercel.app' /tmp/route.json; then
              visible=$((visible+1))
              if jq -e '[(.results // .routes // .data // [])[]? | select(
                  (((.seller // "") | tostring | contains("agentresolver.vercel.app")) or
                   ((.origin // "") | tostring | contains("agentresolver.vercel.app")) or
                   ((.host // "") | tostring | contains("agentresolver.vercel.app"))) and
                  .routerDispatchEligible == true
                )] | length > 0' /tmp/route.json >/dev/null; then
                eligible=$((eligible+1))
              fi
            fi
          done
          echo "AGENTRESOLVER_VISIBLE_QUERIES=$visible"
          echo "AGENTRESOLVER_DISPATCH_ELIGIBLE_QUERIES=$eligible"

      - name: Deep-inspect two exact-intent routes read-only
        shell: bash
        run: |
          set -euo pipefail
          for q in 'x402 settlement test' 'USDC payment check'; do
            echo "=== TOP20: $q ==="
            curl -fsS -G 'https://agent402.tools/api/route' \
              --data-urlencode "q=$q" \
              --data-urlencode 'include=external' \
              --data-urlencode 'network=base' \
              --data-urlencode 'top=20' \
              -o /tmp/deep.json
            jq --arg q "$q" '{
              query:$q,
              agentresolver:[(.results // .routes // .data // [])[]? | select(
                ((.seller // "") | tostring | contains("agentresolver.vercel.app")) or
                ((.origin // "") | tostring | contains("agentresolver.vercel.app")) or
                ((.host // "") | tostring | contains("agentresolver.vercel.app"))
              ) | {seller,name,route,slug,score,matched,matchedOn,why,health,routerDispatchEligible,routerDispatchReason}],
              top20:[(.results // .routes // .data // [])[]? | {seller,name,route,slug,score,matched,matchedOn,why}]
            }' /tmp/deep.json
          done

      - name: Probe Circle x402 Discovery read-only
        shell: bash
        run: |
          set -euo pipefail
          base='https://api.circle.com/v2/x402/discovery/resources'
          payto='0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8'
          curl -fsS -G "$base" --data-urlencode 'query=agentresolver' --data-urlencode 'limit=100' --data-urlencode 'offset=0' -o /tmp/circle-name.json
          curl -fsS -G "$base" --data-urlencode "payTo=$payto" --data-urlencode 'limit=100' --data-urlencode 'offset=0' -o /tmp/circle-payto.json
          python - <<'PY'
          import json
          from pathlib import Path
          def rows(path):
              data=json.loads(Path(path).read_text())
              if isinstance(data, list): return data
              for key in ('resources','items','data'):
                  value=data.get(key) if isinstance(data, dict) else None
                  if isinstance(value, list): return value
              return []
          def ours(items):
              return [item for item in items if 'agentresolver.vercel.app' in json.dumps(item).lower() or '0x66e19457ffc829e8ed74706f5c1399c6f6466de8' in json.dumps(item).lower()]
          by_name=rows('/tmp/circle-name.json')
          by_payto=rows('/tmp/circle-payto.json')
          matches=ours(by_name+by_payto)
          print('CIRCLE_QUERY_ROWS=', len(by_name))
          print('CIRCLE_PAYTO_ROWS=', len(by_payto))
          print('CIRCLE_AGENTRESOLVER_MATCHES=', len(matches))
          PY
          echo "READ_ONLY_PROBE=true"
