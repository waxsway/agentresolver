name: Measure AgentResolver discovery surfaces

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/measure-agent402-after-261.yml'

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production and Agent402 crawl freshness
        shell: bash
        run: |
          set -euo pipefail
          expected='39579d351d9fcbd40e2455359bc42f09eb60e49f'
          code="$(curl -sS -D /tmp/ping.headers -o /tmp/ping.body -w '%{http_code}' 'https://agentresolver.vercel.app/api/x402-ping')"
          live="$(awk 'BEGIN{IGNORECASE=1} /^x-agentresolver-deployment:/ {gsub("\r",""); print $2; exit}' /tmp/ping.headers)"
          echo "production_http=$code production_sha=$live"
          test "$code" = "402"
          test "$live" = "$expected"

          curl -fsS -G 'https://agent402.tools/api/index' \
            --data-urlencode 'seller=agentresolver.vercel.app' \
            -o /tmp/index.json
          jq '{
            origin,
            fetchedAt,
            fetchedAtIso:(if .fetchedAt then (.fetchedAt / 1000 | todateiso8601) else null end),
            health,routable,routerDispatchEligible,routerDispatchReason,
            toolCount:((.tools // []) | length),
            relevantTools:[(.tools // [])[]? | select(
              (.route // "") == "/api/x402-ping" or
              (.route // "") == "/api/x402-payment-preflight" or
              (.route // "") == "/api/usdc-payment-check"
            ) | {name,slug,route,price,priceUsd,method}]
          }' /tmp/index.json

      - name: Measure six buyer intents
        shell: bash
        run: |
          set -euo pipefail
          queries=(
            "x402 settlement test"
            "USDC payment check"
            "endpoint safety"
            "verify endpoint before paying"
            "payTo verification"
            "wallet facilitator payment test"
          )
          visible=0
          eligible=0
          for q in "${queries[@]}"; do
            curl -fsS -G 'https://agent402.tools/api/route' \
              --data-urlencode "q=$q" \
              --data-urlencode 'include=external' \
              --data-urlencode 'network=base' \
              --data-urlencode 'top=20' \
              -o /tmp/route.json
            ours="$(jq '[ (.results // .routes // .data // [])[]? | select(
              ((.seller // "") | tostring | contains("agentresolver.vercel.app")) or
              ((.origin // "") | tostring | contains("agentresolver.vercel.app")) or
              ((.host // "") | tostring | contains("agentresolver.vercel.app"))
            ) | {seller,name,route,slug,priceUsd,score,health,routerDispatchEligible,routerDispatchReason,executeVia,why} ]' /tmp/route.json)"
            echo "=== $q ==="
            echo "$ours"
            if [ "$(jq 'length' <<<"$ours")" -gt 0 ]; then
              visible=$((visible+1))
              if jq -e 'any(.routerDispatchEligible == true)' <<<"$ours" >/dev/null; then eligible=$((eligible+1)); fi
            fi
          done
          echo "AGENTRESOLVER_VISIBLE_QUERIES=$visible"
          echo "AGENTRESOLVER_DISPATCH_ELIGIBLE_QUERIES=$eligible"

      - name: Circle discovery sanity check
        shell: bash
        run: |
          set -euo pipefail
          base='https://api.circle.com/v2/x402/discovery/resources'
          payto='0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8'
          curl -fsS -G "$base" --data-urlencode 'query=agentresolver' --data-urlencode 'limit=100' --data-urlencode 'offset=0' -o /tmp/circle-name.json
          curl -fsS -G "$base" --data-urlencode "payTo=$payto" --data-urlencode 'limit=100' --data-urlencode 'offset=0' -o /tmp/circle-payto.json
          python - <<'PY'
          import json
          from pathlib import Path
          def rows(path):
              data=json.loads(Path(path).read_text())
              if isinstance(data,list): return data
              if isinstance(data,dict):
                  for key in ('resources','items','data'):
                      if isinstance(data.get(key),list): return data[key]
              return []
          def is_ours(x):
              s=json.dumps(x,sort_keys=True).lower()
              return 'agentresolver.vercel.app' in s or '0x66e19457ffc829e8ed74706f5c1399c6f6466de8' in s
          a,b=rows('/tmp/circle-name.json'),rows('/tmp/circle-payto.json')
          print('CIRCLE_AGENTRESOLVER_MATCHES=',sum(is_ours(x) for x in a+b))
          PY
