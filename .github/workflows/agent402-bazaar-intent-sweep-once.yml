name: One-shot Agent402 Bazaar and Intent Sweep

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent402-bazaar-intent-sweep-once.yml"

permissions:
  contents: read
  statuses: write

jobs:
  inspect:
    runs-on: ubuntu-slim
    timeout-minutes: 6
    steps:
      - name: Measure Bazaar quality and intent ranks
        id: sweep
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, urllib.parse, urllib.request

          queries=[
            "verify x402 payment before paying",
            "prepayment authorization gate",
            "x402 transaction path payment gate",
            "USDC payment check",
            "verify endpoint before paying",
            "x402 preflight",
            "payTo verification",
            "endpoint safety",
          ]

          rows_out={}
          exact=None
          for q in queries:
              u="https://agent402.tools/api/route?"+urllib.parse.urlencode({"q":q,"include":"external"})
              req=urllib.request.Request(u,headers={"User-Agent":"agentresolver-revenue-sweep/1.0"})
              with urllib.request.urlopen(req,timeout=60) as r:
                  p=json.loads(r.read().decode())
              rows=p.get("results") or []
              rank=0; ar=None
              for i,row in enumerate(rows,1):
                  blob=json.dumps(row,separators=(",",":"),sort_keys=True).lower()
                  if "agentresolver.vercel.app" in blob or '"sellername":"agentresolver"' in blob:
                      rank=i; ar=row; break
              rows_out[q]={"rank":rank or None,"agentresolver":ar,"top":rows[0] if rows else None}
              if q=="verify x402 payment before paying":
                  exact=rows_out[q]

          def baz(row):
              b=(row or {}).get("bazaar")
              if not isinstance(b,dict): return {}
              return b

          top_b=baz((exact or {}).get("top"))
          ar_b=baz((exact or {}).get("agentresolver"))

          print(json.dumps({"queries":rows_out,"exactBazaar":{"top":top_b,"agentresolver":ar_b}},separators=(",",":"),sort_keys=True))

          def c(v,limit=50):
              if v is None:return "na"
              if isinstance(v,(dict,list)):v=json.dumps(v,separators=(",",":"),sort_keys=True)
              return re.sub(r'[^a-zA-Z0-9._-]+','-',str(v))[:limit] or "na"

          def payer(b):
              for k in ("l30DaysUniquePayers","uniquePayers30d","uniquePayers","payers30d","payers"):
                  if k in b:return b[k]
              return None
          def calls(b):
              for k in ("l30DaysTotalCalls","calls30d","totalCalls","calls"):
                  if k in b:return b[k]
              return None

          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"top_payers={c(payer(top_b))}\n")
              f.write(f"ar_payers={c(payer(ar_b))}\n")
              f.write(f"top_calls={c(calls(top_b))}\n")
              f.write(f"ar_calls={c(calls(ar_b))}\n")
              f.write(f"top_bazaar_keys={c('.'.join(sorted(top_b.keys())))}\n")
              f.write(f"ar_bazaar_keys={c('.'.join(sorted(ar_b.keys())))}\n")
              for idx,(q,v) in enumerate(rows_out.items(),1):
                  f.write(f"rank_q{idx}={v['rank'] or 0}\n")
          PY

      - name: Publish Bazaar quality
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TOP_PAYERS: ${{ steps.sweep.outputs.top_payers }}
          AR_PAYERS: ${{ steps.sweep.outputs.ar_payers }}
          TOP_CALLS: ${{ steps.sweep.outputs.top_calls }}
          AR_CALLS: ${{ steps.sweep.outputs.ar_calls }}
          TOP_KEYS: ${{ steps.sweep.outputs.top_bazaar_keys }}
          AR_KEYS: ${{ steps.sweep.outputs.ar_bazaar_keys }}
          R1: ${{ steps.sweep.outputs.rank_q1 }}
          R2: ${{ steps.sweep.outputs.rank_q2 }}
          R3: ${{ steps.sweep.outputs.rank_q3 }}
          R4: ${{ steps.sweep.outputs.rank_q4 }}
          R5: ${{ steps.sweep.outputs.rank_q5 }}
          R6: ${{ steps.sweep.outputs.rank_q6 }}
          R7: ${{ steps.sweep.outputs.rank_q7 }}
          R8: ${{ steps.sweep.outputs.rank_q8 }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          contexts=[
            f"distribution/a402-bazaar-payers-top-{os.environ.get('TOP_PAYERS','na')}-ar-{os.environ.get('AR_PAYERS','na')}",
            f"distribution/a402-bazaar-calls-top-{os.environ.get('TOP_CALLS','na')}-ar-{os.environ.get('AR_CALLS','na')}",
            f"distribution/a402-bazaar-keys-top-{os.environ.get('TOP_KEYS','na')}-ar-{os.environ.get('AR_KEYS','na')}",
          ]
          ranks=[
            ("verify-pay",os.environ.get("R1","0")),
            ("preauth-gate",os.environ.get("R2","0")),
            ("tx-path-gate",os.environ.get("R3","0")),
            ("usdc-check",os.environ.get("R4","0")),
            ("verify-endpoint",os.environ.get("R5","0")),
            ("x402-preflight",os.environ.get("R6","0")),
            ("payto",os.environ.get("R7","0")),
            ("endpoint-safety",os.environ.get("R8","0")),
          ]
          contexts += [f"distribution/a402-intent-{name}-rank-{rank}" for name,rank in ranks]
          for c in contexts:
              payload={"state":"success","context":c[:100],"description":"Agent402 Bazaar quality / external intent rank","target_url":"https://agent402.tools/api/route"}
              req=urllib.request.Request(
                f"https://api.github.com/repos/waxsway/agentresolver/statuses/{os.environ['SHA']}",
                data=json.dumps(payload).encode(),
                headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"},
                method="POST")
              with urllib.request.urlopen(req,timeout=30) as r: print(r.status)
          PY
