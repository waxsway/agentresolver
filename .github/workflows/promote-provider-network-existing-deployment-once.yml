name: Promote Existing Provider Network Deployment Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-provider-network-existing-deployment-once.yml"

permissions:
  contents: read

concurrency:
  group: promote-provider-network-existing-deployment-once
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERCEL_ORG_ID: team_ciQJak0lFZjXNgqry88ZDIKN
      VERCEL_PROJECT_ID: prj_uJKVWBawxKkEjIWV5EQkbkQPIABD
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TARGET_DEPLOYMENT_ID: dpl_Hh3SU83Ee4bS4a23eftmovdbDhks
      TARGET_SHA: 2d3175cfc983ecf27503d28adba9db936c5b8e5a
      FALLBACK_DEPLOYMENT_ID: dpl_7f6Up6NZNjjRWUeYFrf3u7sKA8UQ
      FALLBACK_SHA: fe1f69b03fa03e845a516e745772383d46da71d2
      CANONICAL_ALIAS: agentresolver.vercel.app
      BASE_URL: https://agentresolver.vercel.app

    steps:
      - name: Require Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::VERCEL_TOKEN is not configured."; exit 1; }

      - name: Promote already-built provider deployment
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --connect-timeout 10 --max-time 30             -o /tmp/promote-alias.json -w '%{http_code}'             -X POST "https://api.vercel.com/v2/deployments/$TARGET_DEPLOYMENT_ID/aliases?teamId=$VERCEL_ORG_ID"             -H "Authorization: Bearer $VERCEL_TOKEN"             -H 'Content-Type: application/json'             --data-binary "$(jq -nc --arg alias "$CANONICAL_ALIAS" '{alias:$alias,redirect:null}')")"
          case "$code" in
            200|201) ;;
            *) cat /tmp/promote-alias.json; exit 1 ;;
          esac

      - name: Verify provider, procurement and CDP contracts
        id: smoke
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          ready=0
          for attempt in {1..30}; do
            suffix="providerRepromote=$GITHUB_RUN_ID-$attempt"

            preflight_code="$(curl -sS --max-time 15 -D /tmp/preflight-h -o /tmp/preflight-b -w '%{http_code}'               "$BASE_URL/api/x402-payment-preflight?url=https%3A%2F%2Fexample.com%2Fpaid&method=GET&maxPriceUsd=0.01&$suffix" || true)"
            deployment_sha="$(awk 'BEGIN{IGNORECASE=1} /^x-agentresolver-deployment:/ {gsub("\r",""); print $2; exit}' /tmp/preflight-h)"

            procure_ok=0
            if curl -fsS --max-time 20               -H 'content-type: application/json'               -H 'cache-control: no-cache'               -d '{"goal":"compute a SHA-256 digest","limit":3,"constraints":{"maxPriceUsd":0.01,"requireHttps":true}}'               "$BASE_URL/api/procure?$suffix" -o /tmp/procure.json &&
              jq -e '
                .resolver == "AgentResolver" and
                .mode == "open_world_non_custodial_procurement" and
                .boundaries.callerWalletControlledByAgentResolver == false and
                .boundaries.callerSpendAuthorizedByAgentResolver == false
              ' /tmp/procure.json >/dev/null; then
              procure_ok=1
            fi

            provider_ok=0
            if curl -fsS --max-time 20 -H 'cache-control: no-cache' "$BASE_URL/api/providers?$suffix" -o /tmp/providers.json &&
              jq -e '
                .service == "AgentResolver Provider Network" and
                .domainEnrollment.status == "open" and
                .domainEnrollment.accountRequired == false and
                .domainEnrollment.emailRequired == false and
                .domainEnrollment.operatorReviewRequired == false and
                .sellerMonetization.model == "provider-success-fee" and
                .sellerMonetization.successFeeBps == 200 and
                .sellerMonetization.minimumSuccessFeeUsd == 0.001 and
                .sellerMonetization.buyerExtraFeeUsd == 0
              ' /tmp/providers.json >/dev/null &&
              curl -fsS --max-time 20 -H 'cache-control: no-cache' "$BASE_URL/provider-integration.json?$suffix" -o /tmp/provider-integration.json &&
              jq -e '
                .providerEnrollment.mode == "domain-controlled-well-known" and
                .providerEnrollment.reviewRequired == false and
                .commercial.successFeeBps == 200 and
                .commercial.minimumSuccessFeeUsd == 0.001 and
                .commercial.buyerExtraFeeUsd == 0
              ' /tmp/provider-integration.json >/dev/null; then
              provider_ok=1
            fi

            cdp_code="$(curl -sS --max-time 15 -o /tmp/cdp-b -w '%{http_code}' "$BASE_URL/api/x402-cdp-canary?$suffix" || true)"
            cdp_ok=0
            if [ "$cdp_code" = "402" ] &&
              jq -e '
                .x402Version == 2 and
                (.accepts | length) == 1 and
                .accepts[0].network == "eip155:8453" and
                .accepts[0].amount == "2000"
              ' /tmp/cdp-b >/dev/null; then
              cdp_ok=1
            fi

            if [ "$preflight_code" = "402" ] &&
              [ "$deployment_sha" = "$TARGET_SHA" ] &&
              [ "$procure_ok" = "1" ] &&
              [ "$provider_ok" = "1" ] &&
              [ "$cdp_ok" = "1" ]; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" != "1" ]; then
            echo "::error::Existing provider deployment did not pass corrected production smoke."
            cat /tmp/providers.json 2>/dev/null || true
            cat /tmp/procure.json 2>/dev/null || true
            cat /tmp/cdp-b 2>/dev/null || true
            exit 1
          fi

          echo "PROVIDER_NETWORK_REPROMOTE_SMOKE=true"

      - name: Restore procurement deployment if smoke fails
        if: steps.smoke.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --connect-timeout 10 --max-time 30             -o /tmp/fallback-alias.json -w '%{http_code}'             -X POST "https://api.vercel.com/v2/deployments/$FALLBACK_DEPLOYMENT_ID/aliases?teamId=$VERCEL_ORG_ID"             -H "Authorization: Bearer $VERCEL_TOKEN"             -H 'Content-Type: application/json'             --data-binary "$(jq -nc --arg alias "$CANONICAL_ALIAS" '{alias:$alias,redirect:null}')")"
          case "$code" in
            200|201) ;;
            *) cat /tmp/fallback-alias.json; exit 1 ;;
          esac

          restored=0
          for attempt in {1..30}; do
            suffix="procurementFallback=$GITHUB_RUN_ID-$attempt"
            preflight_code="$(curl -sS --max-time 15 -D /tmp/fallback-h -o /tmp/fallback-b -w '%{http_code}'               "$BASE_URL/api/x402-payment-preflight?url=https%3A%2F%2Fexample.com%2Fpaid&method=GET&maxPriceUsd=0.01&$suffix" || true)"
            sha="$(awk 'BEGIN{IGNORECASE=1} /^x-agentresolver-deployment:/ {gsub("\r",""); print $2; exit}' /tmp/fallback-h)"
            procure_code="$(curl -sS --max-time 20 -o /tmp/fallback-procure -w '%{http_code}'               -H 'content-type: application/json'               -d '{"goal":"compute a SHA-256 digest","limit":1}'               "$BASE_URL/api/procure?$suffix" || true)"
            if [ "$preflight_code" = "402" ] && [ "$sha" = "$FALLBACK_SHA" ] && [ "$procure_code" = "200" ]; then
              restored=1
              break
            fi
            sleep 2
          done
          if [ "$restored" != "1" ]; then
            echo "::error::Failed smoke and could not restore known-good procurement deployment."
            exit 1
          fi
          echo "PROCUREMENT_FALLBACK_RESTORED=true"
          exit 1
