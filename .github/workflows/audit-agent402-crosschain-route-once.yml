name: Audit Agent402 Cross-Chain Route Once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-agent402-crosschain-route-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Quote exact AgentResolver intent on Base and Solana
        shell: bash
        run: |
          set -euo pipefail
          q='verify x402 payment before paying'
          for network in base solana; do
            body="$(mktemp)"
            code="$(curl -sS --connect-timeout 5 --max-time 25 -G               -o "$body" -w '%{http_code}'               'https://agent402.tools/api/route'               --data-urlencode "q=$q"               --data-urlencode "network=$network"               --data-urlencode 'include=external' || printf '000')"
            echo "=== $network HTTP $code ==="
            if [ "$code" = "200" ]; then
              jq '{network,query,slug,route,name,provider,external,price,priceUsd,underlyingPriceUsd,executeVia,executeViaCallableNow,routerDispatchEligible,routerDispatchReason,gate,reason,candidates:(.candidates // [] | map({name,slug,route,provider,external,routerDispatchEligible,routerDispatchReason,price,priceUsd,underlyingPriceUsd})[:8])}' "$body" 2>/dev/null || cat "$body"
            else
              head -c 3000 "$body" || true
              echo
            fi
          done
