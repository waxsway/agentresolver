name: Audit Circle x402 Discovery

on:
  push:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Search Circle Discovery for AgentResolver
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS --connect-timeout 5 --max-time 30 -o "$body" -w '%{http_code}'             'https://api.circle.com/v2/x402/discovery/resources' || printf '000')"
          echo "HTTP=$code"
          test "$code" = "200"
          python3 - "$body" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          def walk(v):
            if isinstance(v,dict):
              blob=json.dumps(v,separators=(",",":"),sort_keys=True).lower()
              if "agentresolver" in blob or "agentresolver.vercel.app" in blob:
                print(json.dumps(v,separators=(",",":"),sort_keys=True))
              for x in v.values(): walk(x)
            elif isinstance(v,list):
              for x in v: walk(x)
          walk(d)
          PY
