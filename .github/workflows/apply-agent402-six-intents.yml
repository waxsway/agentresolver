name: Apply Agent402 Six Intent Patch

on:
  push:
    branches: [feat/agent402-six-intents-20260917]
    paths:
      - '.github/workflows/apply-agent402-six-intents.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[six-intent-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agent402-six-intents-20260917
      - name: Apply focused discovery patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          factory = 'src/lib/createDeterministicPaidRoute.ts'
          replace_once(factory, 'export type DeterministicPaidRouteOptions = Readonly<{ paidGet?: boolean }>;\n', 'export type DeterministicPaidRouteOptions = Readonly<{ paidGet?: boolean; endpoint?: string }>;\n')
          replace_once(factory, '  const product = getPaidCapability(capabilityId);\n  const wireMetadata = x402WireResourceMetadata(product);\n', '  const product = getPaidCapability(capabilityId);\n  const endpoint = options.endpoint?.trim() || product.endpoint;\n  if (!endpoint.startsWith("/api/")) throw new Error("Paid route endpoint override must start with /api/.");\n  const wireMetadata = x402WireResourceMetadata(product);\n')
          replace_once(factory, '      [product.endpoint]: {\n', '      [endpoint]: {\n')
          replace_once(factory, '    const traffic = classifyTraffic(req, { path: product.endpoint });\n', '    const traffic = classifyTraffic(req, { path: endpoint });\n')
          replace_once(factory, '    const traffic = classifyTraffic(req, { path: product.endpoint, isDiscovery: true });\n', '    const traffic = classifyTraffic(req, { path: endpoint, isDiscovery: true });\n')
          replace_once(factory, '    return stampInfrastructureHeaders(x402DiscoveryChallenge(capabilityId), capabilityId, requestId);\n', '    return stampInfrastructureHeaders(x402DiscoveryChallenge(capabilityId, { endpoint }), capabilityId, requestId);\n')

          challenge = 'src/lib/x402DiscoveryChallenge.ts'
          replace_once(challenge, 'export type DiscoveryCapability = PaidCapabilityId;\n\nexport function x402DiscoveryChallenge(capabilityId: DiscoveryCapability) {\n  const config = getPaidCapability(capabilityId);\n', 'export type DiscoveryCapability = PaidCapabilityId;\nexport type X402DiscoveryChallengeOptions = Readonly<{ endpoint?: string }>;\n\nexport function x402DiscoveryChallenge(\n  capabilityId: DiscoveryCapability,\n  options: X402DiscoveryChallengeOptions = {}\n) {\n  const config = getPaidCapability(capabilityId);\n  const endpoint = options.endpoint?.trim() || config.endpoint;\n  if (!endpoint.startsWith("/api/")) throw new Error("Discovery endpoint override must start with /api/.");\n')
          replace_once(challenge, '  const resourceUrl = `https://agentresolver.vercel.app${config.endpoint}`;\n', '  const resourceUrl = `https://agentresolver.vercel.app${endpoint}`;\n')

          shared = '''import { NextRequest } from "next/server";
import { inspectHttpResource } from "@/lib/httpInspect";
import { buildProviderEvidenceReceipt } from "@/lib/providerEvidenceReceipt";
import { buildX402PrepayDecision } from "@/lib/x402PrepayDecision";

export async function executeX402PaymentPreflight(req: NextRequest) {
  const body = (await req.json().catch(() => null)) as {
    url?: unknown;
    maxPriceUsd?: unknown;
    expectedPayTo?: unknown;
    expectedNetwork?: unknown;
    method?: unknown;
    body?: unknown;
    allowUnpaidPostProbe?: unknown;
  } | null;

  const url = String(body?.url || "").trim();
  const methodRaw = typeof body?.method === "string" ? body.method.toUpperCase() : "GET";
  const method = methodRaw === "GET" || methodRaw === "HEAD" || methodRaw === "POST" ? methodRaw : undefined;
  if (!method) throw new Error("method must be GET, HEAD, or POST.");

  const constraints = {
    maxPriceUsd: typeof body?.maxPriceUsd === "number" ? body.maxPriceUsd : undefined,
    expectedPayTo: typeof body?.expectedPayTo === "string" ? body.expectedPayTo.trim() : undefined,
    expectedNetwork: typeof body?.expectedNetwork === "string" ? body.expectedNetwork.trim() : undefined
  };

  const report = await inspectHttpResource(url, {
    ...constraints,
    method,
    body: body?.body,
    allowUnpaidPostProbe: body?.allowUnpaidPostProbe === true
  });
  const evidenceReceipt = buildProviderEvidenceReceipt(report);
  const prepaymentDecision = buildX402PrepayDecision(report, evidenceReceipt, constraints);

  console.log(JSON.stringify({
    event: "provider_evidence_observed",
    at: evidenceReceipt.observedAt,
    capabilityId: "x402-payment-preflight",
    endpointOrigin: evidenceReceipt.endpoint.origin,
    paymentIdentityFingerprint: evidenceReceipt.observedPaymentIdentity.paymentIdentityFingerprint,
    endpointPaymentFingerprint: evidenceReceipt.observedPaymentIdentity.endpointPaymentFingerprint,
    paymentTermsFingerprint: evidenceReceipt.observedPaymentTerms.paymentTermsFingerprint,
    evidenceDigest: evidenceReceipt.evidence.digest,
    network: evidenceReceipt.observedPaymentIdentity.network,
    ownershipVerified: false,
    providerLegitimacyVerified: false,
    prepaymentDecision: prepaymentDecision.decision,
    eligibleForCallerAuthorization: prepaymentDecision.eligibleForCallerAuthorization,
    prepaymentReasonCodes: prepaymentDecision.reasons
  }));

  return { ...report, prepaymentDecision, evidenceReceipt };
}
'''
          Path('src/lib/executeX402PaymentPreflight.ts').write_text(shared)

          Path('src/app/api/x402-payment-preflight/route.ts').write_text('''import { createDeterministicPaidRoute } from "@/lib/createDeterministicPaidRoute";
import { executeX402PaymentPreflight } from "@/lib/executeX402PaymentPreflight";

export const dynamic = "force-dynamic";

const route = createDeterministicPaidRoute("x402-payment-preflight", executeX402PaymentPreflight);

export const POST = route.POST;
export const GET = route.GET;
export const OPTIONS = route.OPTIONS;
''')

          alias_dir = Path('src/app/api/usdc-payment-check')
          alias_dir.mkdir(parents=True, exist_ok=True)
          (alias_dir / 'route.ts').write_text('''import { createDeterministicPaidRoute } from "@/lib/createDeterministicPaidRoute";
import { executeX402PaymentPreflight } from "@/lib/executeX402PaymentPreflight";

export const dynamic = "force-dynamic";

const route = createDeterministicPaidRoute(
  "x402-payment-preflight",
  executeX402PaymentPreflight,
  { endpoint: "/api/usdc-payment-check" }
);

export const POST = route.POST;
export const GET = route.GET;
export const OPTIONS = route.OPTIONS;
''')

          publish = 'scripts/publish-x402-get-canary.ts'
          replace_once(publish, 'const POST_RESOURCE = `POST ${ENDPOINT}`;\n', 'const POST_RESOURCE = `POST ${ENDPOINT}`;\nconst PREFLIGHT_ENDPOINT = "/api/x402-payment-preflight";\nconst USDC_CHECK_ENDPOINT = "/api/usdc-payment-check";\nconst USDC_CHECK_RESOURCE = `POST ${USDC_CHECK_ENDPOINT}`;\n')
          replace_once(publish, 'getResource.resource = GET_RESOURCE;\ngetResource.description = ', 'getResource.id = "x402-settlement-test";\ngetResource.name = "x402 Settlement Test";\ngetResource.slug = "x402-settlement-test";\ngetResource.method = "GET";\ngetResource.resource = GET_RESOURCE;\ngetResource.description = ')
          replace_once(publish, 'manifest.resources = [\n  getResource,\n  ...manifest.resources.filter((item: any) => item.resource !== GET_RESOURCE)\n];\n', '''const preflightResource = manifest.resources?.find((item: any) => item.resource === `POST ${PREFLIGHT_ENDPOINT}`);
if (!preflightResource) throw new Error("x402-payment-preflight POST resource is missing from the generated manifest.");
const usdcCheckResource = clone(preflightResource);
usdcCheckResource.id = "usdc-payment-check";
usdcCheckResource.name = "USDC Payment Check";
usdcCheckResource.slug = "usdc-payment-check";
usdcCheckResource.endpoint = `https://agentresolver.vercel.app${USDC_CHECK_ENDPOINT}`;
usdcCheckResource.method = "POST";
usdcCheckResource.resource = USDC_CHECK_RESOURCE;
usdcCheckResource.description = "Paid $0.001 USDC x402 endpoint-safety and payment-contract check. Alias of AgentResolver's canonical fail-closed x402 payment preflight, exposed under the exact buyer intent USDC Payment Check.";
if (Array.isArray(usdcCheckResource.accepts)) {
  for (const accept of usdcCheckResource.accepts) accept.resource = `https://agentresolver.vercel.app${USDC_CHECK_ENDPOINT}`;
}
manifest.resources = [
  getResource,
  usdcCheckResource,
  ...manifest.resources.filter((item: any) => item.resource !== GET_RESOURCE && item.resource !== USDC_CHECK_RESOURCE)
];
''')
          replace_once(publish, 'getOperation.operationId = "x402SettlementPingGet";\ngetOperation.summary = `${postOperation.summary} (GET)`;\n', 'getOperation.operationId = "x402SettlementTest";\ngetOperation.summary = "x402 Settlement Test";\n')
          replace_once(publish, 'pathItem.get = getOperation;\nwriteJson("public/openapi.json", openapi);\n', '''pathItem.get = getOperation;
const preflightPost = openapi.paths?.[PREFLIGHT_ENDPOINT]?.post;
if (!preflightPost) throw new Error("x402-payment-preflight POST is missing from openapi.json.");
const usdcCheckOperation = clone(preflightPost);
usdcCheckOperation.operationId = "usdcPaymentCheck";
usdcCheckOperation.summary = "USDC Payment Check";
usdcCheckOperation.description = "Price: $0.001 USDC on Base or Solana via x402. Exact-intent alias of AgentResolver's canonical fail-closed payment preflight. Checks target endpoint safety and observed x402 payment terms before caller authorization; execution logic is shared with /api/x402-payment-preflight.";
openapi.paths[USDC_CHECK_ENDPOINT] = { post: usdcCheckOperation };
writeJson("public/openapi.json", openapi);
''')

          Path('tests/agent402BuyerIntents.test.ts').write_text('''import test from "node:test";
import assert from "node:assert/strict";
import { readFileSync } from "node:fs";
import { PAID_CAPABILITIES } from "../src/lib/paidCapabilities";

test("Agent402-facing canonical product names retain the four established buyer intents", () => {
  const preflight = PAID_CAPABILITIES["x402-payment-preflight"];
  assert.match(preflight.name, /verify endpoint before paying/i);
  assert.match(preflight.name, /endpoint safety/i);
  assert.match(preflight.name, /USDC payment check/i);
  assert.match(PAID_CAPABILITIES["x402-ping"].name, /wallet facilitator payment test/i);
});

test("generated x402-ping GET owns the exact settlement-test buyer intent without changing POST", () => {
  const openapi = JSON.parse(readFileSync("public/openapi.json", "utf8"));
  assert.match(openapi.paths?.["/api/x402-ping"]?.post?.summary, /wallet facilitator payment test/i);
  assert.equal(openapi.paths?.["/api/x402-ping"]?.get?.summary, "x402 Settlement Test");
  assert.equal(openapi.paths?.["/api/x402-ping"]?.get?.operationId, "x402SettlementTest");
});

test("USDC payment-check alias is a real advertised paid route with exact buyer-intent identity", () => {
  const openapi = JSON.parse(readFileSync("public/openapi.json", "utf8"));
  const operation = openapi.paths?.["/api/usdc-payment-check"]?.post;
  assert.equal(operation?.summary, "USDC Payment Check");
  assert.equal(operation?.operationId, "usdcPaymentCheck");

  const manifest = JSON.parse(readFileSync("public/.well-known/x402", "utf8"));
  const resource = manifest.resources?.find((item: any) => item.resource === "POST /api/usdc-payment-check");
  assert.equal(resource?.name, "USDC Payment Check");
  assert.equal(resource?.slug, "usdc-payment-check");
  assert.equal(resource?.endpoint, "https://agentresolver.vercel.app/api/usdc-payment-check");
});

test("alias route shares the canonical preflight executor and only overrides its public endpoint", () => {
  const canonical = readFileSync("src/app/api/x402-payment-preflight/route.ts", "utf8");
  const alias = readFileSync("src/app/api/usdc-payment-check/route.ts", "utf8");
  assert.match(canonical, /executeX402PaymentPreflight/);
  assert.match(alias, /executeX402PaymentPreflight/);
  assert.match(alias, /endpoint: "\\/api\\/usdc-payment-check"/);
});
''')

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'agentresolver-ops'
          git config user.email 'actions@users.noreply.github.com'
          git add src scripts tests
          git diff --cached --check
          git commit -m 'growth: cover all six Agent402 buyer intents [six-intent-applied]'
          git push origin HEAD:feat/agent402-six-intents-20260917
