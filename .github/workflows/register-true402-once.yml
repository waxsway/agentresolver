name: Register true402 Once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/.well-known/x402-service.json'
      - '.github/workflows/register-true402-once.yml'

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for true402 bootstrap canary manifest and paid route
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            manifest_ok=0
            challenge_ok=0

            if curl -fsS -H 'x-agentresolver-internal: 1' https://agentresolver.vercel.app/.well-known/x402-service.json > /tmp/manifest.json; then
              if jq -e '
                .name == "agentresolver-settlement-ping" and
                .pricing.base == "0.001" and
                .endpoint == "https://agentresolver.vercel.app/api/x402-ping"
              ' /tmp/manifest.json >/dev/null; then
                manifest_ok=1
              fi
            fi

            code="$(curl -sS -H 'x-agentresolver-internal: 1' -o /tmp/challenge.json -w '%{http_code}' https://agentresolver.vercel.app/api/x402-ping || true)"
            if [ "$code" = "402" ] && jq -e '
              .accepts[0].amount == "1000" and
              .accepts[0].payTo == "0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8"
            ' /tmp/challenge.json >/dev/null; then
              challenge_ok=1
            fi

            if [ "$manifest_ok" = "1" ] && [ "$challenge_ok" = "1" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Settlement canary manifest or x402 challenge did not become ready." >&2
          exit 1

      - name: Register AgentResolver with true402
        shell: bash
        run: |
          set -euo pipefail
          body="/tmp/true402-register.json"
          code="000"
          for attempt in 1 2 3 4; do
            : > "$body"
            code="$(curl -4 -sS -o "$body" -w '%{http_code}' \
              --connect-timeout 8 --max-time 20 \
              -X POST https://true402.dev/api/v1/services \
              -H 'content-type: application/json' \
              -d '{"url":"https://agentresolver.vercel.app"}' || printf '000')"
            echo "true402 registration attempt $attempt -> HTTP $code"
            cat "$body" || true
            echo
            case "$code" in
              200|201|202|409) break ;;
              000|408|425|429|500|502|503|504)
                if [ "$attempt" -lt 4 ]; then
                  sleep $((attempt * 3))
                  continue
                fi
                ;;
              *) break ;;
            esac
          done

          case "$code" in
            200|201|202|409) ;;
            *)
              echo "true402 registration failed after bounded retries with HTTP $code" >&2
              exit 1
              ;;
          esac

      - name: Verify live true402 buyer catalog visibility
        shell: bash
        run: |
          set -euo pipefail
          target_id='58e2dff8-a1d8-45e3-9861-b0dc7e2e320b'
          found=0
          offset=0
          total=0

          for page in {1..20}; do
            body="/tmp/services-$offset.json"
            code="000"
            for attempt in 1 2 3; do
              code="$(curl -4 -sS -o "$body" -w '%{http_code}' \
                --connect-timeout 8 --max-time 20 \
                -G 'https://true402.dev/api/v1/services' \
                --data-urlencode 'limit=100' \
                --data-urlencode "offset=$offset" || printf '000')"
              echo "true402 catalog page=$page offset=$offset attempt=$attempt -> HTTP $code"
              if [ "$code" = "200" ]; then break; fi
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 2)); fi
            done
            test "$code" = "200"

            total="$(jq -r '.total // 0' "$body")"
            if jq -e --arg id "$target_id" '
              [(.data // [])[]? | select(
                .id == $id or
                .url == "https://agentresolver.vercel.app" or
                (.manifest.name // "") == "agentresolver-settlement-ping" or
                (.manifest.endpoint // "") == "https://agentresolver.vercel.app/api/x402-ping"
              )] | length > 0
            ' "$body" >/dev/null; then
              echo "AgentResolver settlement canary is present in the live true402 buyer catalog."
              jq --arg id "$target_id" '
                [(.data // [])[]? | select(
                  .id == $id or
                  .url == "https://agentresolver.vercel.app" or
                  (.manifest.name // "") == "agentresolver-settlement-ping" or
                  (.manifest.endpoint // "") == "https://agentresolver.vercel.app/api/x402-ping"
                ) | {
                  id,
                  url,
                  name:.manifest.name,
                  endpoint:.manifest.endpoint,
                  price:.manifest.pricing.base,
                  trustScore:.reputation.trustScore,
                  registeredAt:.reputation.registeredAt,
                  lastSeen:.reputation.lastSeen
                }]
              ' "$body"
              found=1
              break
            fi

            has_more="$(jq -r '.has_more // false' "$body")"
            if [ "$has_more" != "true" ]; then break; fi
            offset=$((offset + 100))
          done

          echo "true402 total=$total searched_through_offset=$offset"
          if [ "$found" != "1" ]; then
            echo "true402 registration exists but AgentResolver was not found after walking the live paginated buyer catalog." >&2
            exit 1
          fi
