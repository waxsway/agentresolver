name: Register true402 Once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/.well-known/x402-service.json'
      - '.github/workflows/register-true402-once.yml'

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for true402 bootstrap canary manifest and paid route
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            manifest_ok=0
            challenge_ok=0

            if curl -fsS https://agentresolver.vercel.app/.well-known/x402-service.json > /tmp/manifest.json; then
              if jq -e '
                .name == "agentresolver-settlement-ping" and
                .pricing.base == "0.001" and
                .endpoint == "https://agentresolver.vercel.app/api/x402-ping"
              ' /tmp/manifest.json >/dev/null; then
                manifest_ok=1
              fi
            fi

            code="$(curl -sS -o /tmp/challenge.json -w '%{http_code}' https://agentresolver.vercel.app/api/x402-ping || true)"
            if [ "$code" = "402" ] && jq -e '
              .accepts[0].amount == "1000" and
              .accepts[0].payTo == "0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8"
            ' /tmp/challenge.json >/dev/null; then
              challenge_ok=1
            fi

            if [ "$manifest_ok" = "1" ] && [ "$challenge_ok" = "1" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Settlement canary manifest or x402 challenge did not become ready." >&2
          exit 1

      - name: Register AgentResolver with true402
        shell: bash
        run: |
          set -euo pipefail
          body="/tmp/true402-register.json"
          code="$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST https://true402.dev/api/v1/services \
            -H 'content-type: application/json' \
            -d '{"url":"https://agentresolver.vercel.app"}')"
          cat "$body"
          echo
          case "$code" in
            200|201|202|409) ;;
            *)
              echo "true402 registration failed with HTTP $code" >&2
              exit 1
              ;;
          esac

          if jq -e '.reputation' "$body" >/dev/null 2>&1; then
            jq '{registration:{id,url}, reputation:{
              transactions:.reputation.transactions,
              settled:.reputation.settled,
              settledVolumeUsd:.reputation.settledVolumeUsd,
              distinctPayers:.reputation.distinctPayers,
              trustScore:.reputation.trustScore,
              lastSettledAt:.reputation.lastSettledAt
            }}' "$body"
          fi

      - name: Verify live true402 buyer catalog visibility
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -D /tmp/services.headers -o /tmp/services.body -w '%{http_code}' 'https://true402.dev/api/v1/services')"
          echo "true402 catalog HTTP $code"
          grep -i '^content-type:' /tmp/services.headers || true
          test "$code" = "200"
          if grep -Fq 'agentresolver-settlement-ping' /tmp/services.body || grep -Fq 'agentresolver.vercel.app/api/x402-ping' /tmp/services.body; then
            echo "AgentResolver settlement canary is present in the live true402 buyer catalog."
            python - <<'PY'
          from pathlib import Path
          text=Path("/tmp/services.body").read_text(errors="replace")
          needle="agentresolver-settlement-ping"
          if needle not in text:
              needle="agentresolver.vercel.app/api/x402-ping"
          i=text.find(needle)
          print(text[max(0,i-400):i+1800])
          PY
          else
            echo "::warning::true402 accepted AgentResolver registration but the public buyer catalog does not contain the settlement canary yet."
            echo "This is buyer-visibility/reputation state, not a production-health failure."
          fi
