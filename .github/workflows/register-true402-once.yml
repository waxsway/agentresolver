name: Register true402 Once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/.well-known/x402-service.json'
      - '.github/workflows/register-true402-once.yml'

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for true402 bootstrap canary manifest and paid route
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            manifest_ok=0
            challenge_ok=0

            if curl -fsS -H 'x-agentresolver-internal: 1' https://agentresolver.vercel.app/.well-known/x402-service.json > /tmp/manifest.json; then
              if jq -e '
                .name == "agentresolver-settlement-ping" and
                .pricing.base == "0.001" and
                .endpoint == "https://agentresolver.vercel.app/api/x402-ping"
              ' /tmp/manifest.json >/dev/null; then
                manifest_ok=1
              fi
            fi

            code="$(curl -sS -H 'x-agentresolver-internal: 1' -o /tmp/challenge.json -w '%{http_code}' https://agentresolver.vercel.app/api/x402-ping || true)"
            if [ "$code" = "402" ] && jq -e '
              .accepts[0].amount == "1000" and
              .accepts[0].payTo == "0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8"
            ' /tmp/challenge.json >/dev/null; then
              challenge_ok=1
            fi

            if [ "$manifest_ok" = "1" ] && [ "$challenge_ok" = "1" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Settlement canary manifest or x402 challenge did not become ready." >&2
          exit 1

      - name: Register AgentResolver with true402
        id: register
        shell: bash
        run: |
          set -euo pipefail
          body="/tmp/true402-register.json"
          code="000"
          for attempt in 1 2 3 4; do
            : > "$body"
            code="$(curl -4 -sS -o "$body" -w '%{http_code}' \
              --connect-timeout 8 --max-time 20 \
              -X POST https://true402.dev/api/v1/services/register \
              -H 'content-type: application/json' \
              -d '{"url":"https://agentresolver.vercel.app"}' || printf '000')"
            echo "true402 registration attempt $attempt -> HTTP $code"
            cat "$body" || true
            echo
            case "$code" in
              200|201|202|409) break ;;
              000|408|425|429|500|502|503|504)
                if [ "$attempt" -lt 4 ]; then
                  sleep $((attempt * 3))
                  continue
                fi
                ;;
              *) break ;;
            esac
          done

          case "$code" in
            200|201|202|409) ;;
            *)
              echo "true402 registration failed after bounded retries with HTTP $code" >&2
              exit 1
              ;;
          esac

          service_id="$(jq -r '.id // .data.id // empty' "$body")"
          if [ -z "$service_id" ]; then
            echo "true402 registration response omitted service id." >&2
            exit 1
          fi
          echo "service_id=$service_id" >> "$GITHUB_OUTPUT"

      - name: Verify exact true402 registered service
        shell: bash
        env:
          SERVICE_ID: ${{ steps.register.outputs.service_id }}
        run: |
          set -euo pipefail
          test -n "$SERVICE_ID"
          code="$(curl -4 -sS -o /tmp/service.json -w '%{http_code}' \
            --connect-timeout 8 --max-time 20 \
            "https://true402.dev/api/v1/services/$SERVICE_ID" || printf '000')"
          echo "true402 exact service lookup -> HTTP $code"
          test "$code" = "200"
          jq -e '
            .id == env.SERVICE_ID and
            .url == "https://agentresolver.vercel.app" and
            .manifest.name == "agentresolver-settlement-ping" and
            .manifest.endpoint == "https://agentresolver.vercel.app/api/x402-ping" and
            (.manifest.pricing.base | tostring) == "0.001"
          ' /tmp/service.json >/dev/null
          jq '{
            id,
            url,
            name:.manifest.name,
            endpoint:.manifest.endpoint,
            price:.manifest.pricing.base,
            trustScore:.reputation.trustScore,
            registeredAt:.reputation.registeredAt,
            lastSeen:.reputation.lastSeen
          }' /tmp/service.json
          echo "AgentResolver exact true402 service is registered and retrievable."
