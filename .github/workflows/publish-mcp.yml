name: Publish MCP Registry
# Registry republish trigger: runtime untouched; publish current server.json metadata.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server.json"
      - ".github/workflows/publish-mcp.yml"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate with MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish AgentResolver
        shell: bash
        run: |
          set +e
          output="$(./mcp-publisher publish server.json 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if grep -Fqi 'cannot publish duplicate version' <<<"$output"; then
            echo "::notice::MCP Registry already has this server.json version; treating publish as idempotent success."
            exit 0
          fi
          exit "$status"
