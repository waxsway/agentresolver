name: Submit AgentResolver to PayAPI Market

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/submit-payapi-market.yml'

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Verify live settlement canary
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 20 -o /tmp/ping.json -w '%{http_code}' 'https://agentresolver.vercel.app/api/x402-ping')"
          test "$code" = "402"
          jq -e '
            .x402Version == 2 and
            (.accepts | any(
              .network == "eip155:8453" and
              .amount == "1000" and
              .payTo == "0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8"
            ))
          ' /tmp/ping.json >/dev/null

      - name: Submit free PayAPI listing
        shell: bash
        run: |
          set -euo pipefail

          provider_name="$(git log -1 --format='%an' | tr -d '\r\n')"
          provider_email="$(git log -1 --format='%ae' | tr -d '\r\n')"

          test -n "$provider_name"
          echo "$provider_email" | grep -Eq '^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$'
          case "$provider_email" in
            *noreply.github.com) echo "Refusing noreply identity." >&2; exit 1 ;;
          esac

          jq -n             --arg provider_name "$provider_name"             --arg provider_email "$provider_email"             '{
              provider: {
                name: $provider_name,
                email: $provider_email,
                company_name: "AgentResolver",
                wallet_address: "0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8"
              },
              api: {
                name: "AgentResolver Settlement Canary",
                description: "Minimal $0.001 x402 settlement canary for autonomous agents. GET requires no body and returns a timestamped pong only after verified USDC settlement on Base.",
                category: "Tools",
                base_url: "https://agentresolver.vercel.app/api/x402-ping",
                mcp_endpoint: "",
                endpoints_count: "1",
                tools_count: "1",
                price_min: "0.001",
                price_max: "0.001"
              },
              tier: "free"
            }' > /tmp/payload.json

          code="$(curl -sS --max-time 40 -o /tmp/payapi-response.json -w '%{http_code}'             -X POST 'https://payapi.market/api/submit-listing'             -H 'content-type: application/json'             --data-binary @/tmp/payload.json || true)"

          echo "HTTP=$code"
          if [ -s /tmp/payapi-response.json ]; then
            jq '
              walk(
                if type == "object" then
                  del(.email, .contact_email, .provider_email)
                else .
                end
              )
            ' /tmp/payapi-response.json 2>/dev/null || echo "Non-JSON response received."
          fi

          case "$code" in
            200|201|202) ;;
            *) echo "PayAPI listing submission failed with HTTP $code" >&2; exit 1 ;;
          esac
