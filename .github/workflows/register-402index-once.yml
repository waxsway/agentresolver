name: Register Canonical Preflight with 402 Index

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Production"]
    types: [completed]
  push:
    branches:
      - main
    paths:
      - .github/workflows/register-402index-once.yml
permissions:
  contents: read

jobs:
  register:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Confirm canonical preflight returns x402 challenge
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/preflight-402.json -w '%{http_code}'             -X POST 'https://agentresolver.vercel.app/api/x402-payment-preflight'             -H 'content-type: application/json'             --data '{"url":"https://agentresolver.vercel.app/api/x402-ping","method":"GET","maxPriceUsd":0.01,"expectedNetwork":"eip155:8453"}')"
          cat /tmp/preflight-402.json
          echo
          test "$status" = "402"

      - name: Register canonical x402 payment preflight
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS             -o /tmp/register.json             -w '%{http_code}'             -X POST 'https://402index.io/api/v1/register'             -H 'content-type: application/json'             --data-binary @- <<'JSON'
          {
            "url": "https://agentresolver.vercel.app/api/x402-payment-preflight",
            "name": "AgentResolver x402 Payment Preflight / PayTo Verification",
            "description": "Verify an unfamiliar x402 endpoint before paying: challenge reachability, quoted USDC price, payTo recipient, Base or Solana network, asset, resource binding, TLS, and optional buyer limits.",
            "protocol": "x402",
            "http_method": "POST",
            "probe_body": "{\"url\":\"https://agentresolver.vercel.app/api/x402-ping\",\"method\":\"GET\",\"maxPriceUsd\":0.01,\"expectedNetwork\":\"eip155:8453\"}",
            "price_usd": 0.001,
            "payment_asset": "USDC",
            "payment_network": "Base / Solana",
            "category": "security/verification",
            "provider": "AgentResolver"
          }
          JSON
          )"
          cat /tmp/register.json
          echo
          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "402 Index canonical preflight registration failed with HTTP $status"
            exit 1
          fi

      - name: Confirm buyer-search retrieval
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://402index.io/api/v1/services?q=x402%20payment%20preflight&protocol=x402&limit=20' -o /tmp/search.json
          jq '{
            total: (.total // .meta.total // null),
            agentresolver: [
              (.services // .data // [])[]? |
              select((.url // "") | contains("agentresolver.vercel.app/api/x402-payment-preflight")) |
              {id,name,url,price_usd,payment_asset,payment_network,category,health_status,source}
            ]
          }' /tmp/search.json
          if ! grep -Fq 'agentresolver.vercel.app/api/x402-payment-preflight' /tmp/search.json; then
            echo "::warning::402 Index accepted registration but buyer-search retrieval has not refreshed yet."
          fi
