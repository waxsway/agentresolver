name: Register 402 Index Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/register-402index-once.yml

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for paid endpoints on canonical production
        shell: bash
        env:
          BASE_URL: https://agentresolver.vercel.app
        run: |
          set -euo pipefail

          wait_for_402() {
            local path="$1"
            local body="$2"
            for attempt in $(seq 1 24); do
              status="$(curl -sS -o /dev/null -w '%{http_code}' \
                -H 'content-type: application/json' \
                --data "$body" \
                "$BASE_URL$path" || true)"
              if [ "$status" = "402" ]; then
                echo "$path is live with an x402 challenge."
                return 0
              fi
              echo "Waiting for $path to return 402 (attempt $attempt/24, got $status)..."
              sleep 10
            done
            echo "$path did not become payable in time."
            return 1
          }

          wait_for_402 '/api/mcp-probe' '{"endpoint":"https://agentresolver.vercel.app/mcp"}'
          wait_for_402 '/api/agent-readiness' '{"target":"https://agentresolver.vercel.app"}'

      - name: Register MCP Probe with 402 Index
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS \
            -o /tmp/mcp-register.json \
            -w '%{http_code}' \
            -X POST 'https://402index.io/api/v1/register' \
            -H 'content-type: application/json' \
            --data-binary @- <<'JSON'
          {
            "url": "https://agentresolver.vercel.app/api/mcp-probe",
            "name": "AgentResolver MCP Probe",
            "description": "Probe a public MCP endpoint for compatibility, latency, server metadata, and tool inventory before connecting.",
            "protocol": "x402",
            "http_method": "POST",
            "probe_body": "{\"endpoint\":\"https://agentresolver.vercel.app/mcp\"}",
            "price_usd": 0.01,
            "payment_asset": "USDC",
            "payment_network": "Base",
            "category": "agent-tools/mcp",
            "provider": "AgentResolver"
          }
          JSON
          )"
          cat /tmp/mcp-register.json
          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "402 Index MCP Probe registration failed with HTTP $status"
            exit 1
          fi

      - name: Register Agent Readiness Audit with 402 Index
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS \
            -o /tmp/readiness-register.json \
            -w '%{http_code}' \
            -X POST 'https://402index.io/api/v1/register' \
            -H 'content-type: application/json' \
            --data-binary @- <<'JSON'
          {
            "url": "https://agentresolver.vercel.app/api/agent-readiness",
            "name": "AgentResolver Agent Readiness Audit",
            "description": "Audit a public website for agent discoverability and machine-readable integration signals.",
            "protocol": "x402",
            "http_method": "POST",
            "probe_body": "{\"target\":\"https://agentresolver.vercel.app\"}",
            "price_usd": 0.05,
            "payment_asset": "USDC",
            "payment_network": "Base",
            "category": "agent-tools/discovery",
            "provider": "AgentResolver"
          }
          JSON
          )"
          cat /tmp/readiness-register.json
          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "402 Index Agent Readiness registration failed with HTTP $status"
            exit 1
          fi

      - name: Registration complete
        run: echo 'Submitted both AgentResolver x402 capabilities to 402 Index without paid placement.'
