name: Activate Coinbase CDP x402 Ping Flags Only

on:
  push:
    branches:
      - ops/cdp-x402-ping-enable-20260918
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type ENABLE_CDP_X402_PING to approve production activation"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cdp-x402-ping-activation
  cancel-in-progress: false

jobs:
  activate-flags:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      VERCEL_ORG_ID: team_ciQJak0lFZjXNgqry88ZDIKN
      VERCEL_PROJECT_ID: prj_uJKVWBawxKkEjIWV5EQkbkQPIABD
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      BASE_URL: https://agentresolver.vercel.app
    steps:
      - name: Require explicit CDP activation approval
        env:
          CDP_ACTIVATION_CONFIRMATION: ${{ github.event_name == 'push' && 'ENABLE_CDP_X402_PING' || inputs.confirm }}
        run: |
          set -euo pipefail
          test "$CDP_ACTIVATION_CONFIRMATION" = "ENABLE_CDP_X402_PING"

      - name: Require supported production credentials and Circle off
        id: gate
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"

          env_file="$(mktemp)"
          trap 'rm -f "$env_file"' EXIT
          status="$(curl -sS --connect-timeout 10 --max-time 30 -o "$env_file" -w '%{http_code}'             "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID"             -H "Authorization: Bearer $VERCEL_TOKEN")"
          test "$status" = "200"

          ready="$(python3 - "$env_file" <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1], "r", encoding="utf-8"))
          envs=payload.get("envs", []) if isinstance(payload, dict) else []
          production=set()
          for item in envs:
              if not isinstance(item, dict):
                  continue
              target=item.get("target") or []
              if isinstance(target, str):
                  target=[target]
              key=item.get("key")
              if "production" in target and isinstance(key, str):
                  production.add(key)
          id_keys={"CDP_API_KEY_ID","CDI_API_KEY_ID"}
          secret_keys={"CDP_API_KEY_SECRET","CDP_API_SECRET","CDI_API_KEY_SECRET","CDI_API_SECRET"}
          print("true" if (id_keys & production) and (secret_keys & production) else "false")
          PY
          )"
          test "$ready" = "true"

          curl -fsS -H 'cache-control: no-cache' "$BASE_URL/api/health?cdpFlagGate=$GITHUB_RUN_ID" -o /tmp/health.json
          test "$(jq -r '.paymentRails.circleGatewayEnabled // false' /tmp/health.json)" = "false"

      - name: Enable x402-ping CDP flags without deploying
        run: |
          set -euo pipefail
          req="$(mktemp)"
          res="$(mktemp)"
          trap 'rm -f "$req" "$res"' EXIT
          python3 - "$req" <<'PY'
          import json, sys
          payload=[
            {
              "key":"AGENTRESOLVER_CDP_FACILITATOR_ENABLED",
              "value":"1",
              "type":"plain",
              "target":["production"],
              "comment":"Approved scoped Coinbase CDP x402-ping canary"
            },
            {
              "key":"AGENTRESOLVER_CDP_FACILITATOR_CAPABILITIES",
              "value":"x402-ping",
              "type":"plain",
              "target":["production"],
              "comment":"Keep Coinbase CDP bounded to x402-ping only"
            }
          ]
          json.dump(payload, open(sys.argv[1],"w",encoding="utf-8"), separators=(",",":"))
          PY

          status="$(curl -sS --connect-timeout 10 --max-time 30 -o "$res" -w '%{http_code}'             -X POST "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true&teamId=$VERCEL_ORG_ID"             -H "Authorization: Bearer $VERCEL_TOKEN"             -H 'Content-Type: application/json'             --data-binary @"$req")"
          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "::error::Vercel rejected scoped CDP flag update with HTTP $status"
            exit 1
          fi

          python3 - "$res" <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1],"r",encoding="utf-8"))
          if isinstance(payload, dict) and payload.get("failed"):
              raise SystemExit("Vercel reported a failed env update")
          PY
          echo "Scoped CDP flags enabled. No Vercel build or deployment was started by this workflow."
