name: x402discovery Read-Only Contract Probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/x402discovery-readonly-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect x402discovery live catalog and register schema
        shell: bash
        run: |
          set -euo pipefail
          base='https://x402-discovery-api.onrender.com'

          for spec in openapi.json docs; do
            code="$(curl -sS --connect-timeout 10 --max-time 30 -o "/tmp/x402discovery-$spec" -w '%{http_code}' "$base/$spec" || printf '000')"
            echo "GET /$spec -> HTTP $code"
          done

          test -s /tmp/x402discovery-openapi.json
          jq '{
            catalog: .paths["/catalog"],
            register: .paths["/register"],
            wellKnown: .paths["/.well-known/x402-discovery"]
          }' /tmp/x402discovery-openapi.json

          catalog_code="$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/x402discovery-catalog.json -w '%{http_code}' "$base/catalog?limit=500" || printf '000')"
          echo "GET /catalog -> HTTP $catalog_code"
          test "$catalog_code" = "200"

          python3 - /tmp/x402discovery-catalog.json <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],"r",encoding="utf-8"))
          rows=data if isinstance(data,list) else data.get("services") or data.get("items") or data.get("data") or []
          blob=json.dumps(rows,separators=(",",":")).lower()
          print(json.dumps({
            "rowCount": len(rows) if isinstance(rows,list) else None,
            "agentresolverPresent": "agentresolver.vercel.app" in blob
          },separators=(",",":")))
          PY
