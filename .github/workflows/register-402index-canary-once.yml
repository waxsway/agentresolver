name: Register 402 Index Paid GET Canary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/register-402index-canary-once.yml'

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify live GET canary challenge
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}'             'https://agentresolver.vercel.app/api/x402-ping')"
          test "$code" = "402"
          python3 - "$body" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], "r", encoding="utf-8"))
          assert payload.get("x402Version") == 2
          accepts = payload.get("accepts") or []
          assert any(
              item.get("network") == "eip155:8453"
              and str(item.get("amount")) == "1000"
              and item.get("payTo") == "0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8"
              for item in accepts
          )
          PY

      - name: Register paid GET canary with 402 Index
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}'             -X POST 'https://402index.io/api/v1/register'             -H 'content-type: application/json'             --data '{
              "url":"https://agentresolver.vercel.app/api/x402-ping",
              "name":"AgentResolver Settlement Ping",
              "protocol":"x402",
              "http_method":"GET",
              "description":"Minimal $0.001 USDC x402 settlement canary for autonomous buyers. Use it to verify wallet, facilitator, payment and delivery end to end before higher-value calls.",
              "price_usd":0.001,
              "payment_asset":"USDC",
              "payment_network":"Base",
              "category":"security/verification",
              "provider":"AgentResolver"
            }')"
          cat "$body"
          echo
          case "$code" in
            200|201) ;;
            429)
              echo "::warning::402 Index registration is rate-limited; existing listing/search state will be checked."
              ;;
            *)
              echo "402 Index GET canary registration failed with HTTP $code" >&2
              exit 1
              ;;
          esac

      - name: Confirm buyer-search retrieval
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://402index.io/api/v1/services?q=AgentResolver%20Settlement%20Ping&protocol=x402&limit=20'             -o /tmp/search.json
          cat /tmp/search.json
          echo
          if ! grep -Fq 'agentresolver.vercel.app/api/x402-ping' /tmp/search.json; then
            echo "::notice::402 Index accepted verification but public search may still be pending review."
          fi
