name: Ops Circle Discovery Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-circle-discovery-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query Circle for AgentResolver directly
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -G -o "$body" -w '%{http_code}' \
            'https://api.circle.com/v2/x402/discovery/resources' \
            --data-urlencode 'query=agentresolver.vercel.app' \
            --data-urlencode 'limit=100')"
          echo "CIRCLE_DISCOVERY_HTTP=$code"
          test "$code" = "200"
          python3 - "$body" <<'PY'
          import json, pathlib, sys
          p=json.loads(pathlib.Path(sys.argv[1]).read_text())
          items=p.get("items") or []
          matches=[]
          for item in items:
              raw=json.dumps(item,separators=(",",":"),sort_keys=True).lower()
              if "agentresolver.vercel.app" in raw or "0x66e19457ffc829e8ed74706f5c1399c6f6466de8" in raw:
                  matches.append(item)
          print(json.dumps({
              "pagination":p.get("pagination"),
              "returned":len(items),
              "agentresolverMatchCount":len(matches),
              "matches":matches[:25],
          },indent=2)[:30000])
          PY
