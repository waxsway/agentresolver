name: Ops Circle Discovery Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-circle-discovery-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Exhaust Circle keyless x402 discovery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          base="https://api.circle.com/v2/x402/discovery/resources"
          needle_host="agentresolver.vercel.app"
          needle_payto="0x66e19457ffc829e8ed74706f5c1399c6f6466de8"
          limit=100
          offset=0
          matches=[]
          pages=0
          total=None
          while True:
              url=base+"?"+urllib.parse.urlencode({"limit":limit,"offset":offset})
              req=urllib.request.Request(url,headers={"user-agent":"AgentResolver-Circle-Diagnostic/1.0"})
              with urllib.request.urlopen(req,timeout=20) as res:
                  p=json.loads(res.read().decode())
              pages+=1
              items=p.get("items") or []
              pag=p.get("pagination") or {}
              if total is None:
                  try: total=int(pag.get("total"))
                  except Exception: total=None
                  print("CIRCLE_PAGINATION="+json.dumps(pag,separators=(",",":")))
              for item in items:
                  raw=json.dumps(item,separators=(",",":"),sort_keys=True).lower()
                  if needle_host in raw or needle_payto in raw:
                      matches.append(item)
              if not items or len(items)<limit: break
              offset += len(items)
              if total is not None and offset>=total: break
              if pages>=100: raise SystemExit("pagination safety cap reached")
          print(json.dumps({
              "pages":pages,
              "itemsScanned":offset + (len(items) if 'items' in locals() else 0),
              "reportedTotal":total,
              "agentresolverMatchCount":len(matches),
              "matches":matches[:25],
          },indent=2)[:30000])
          PY
