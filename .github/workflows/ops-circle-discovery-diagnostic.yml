name: Ops Circle Discovery Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-circle-discovery-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query Circle keyless x402 discovery
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' 'https://api.circle.com/v2/x402/discovery/resources')"
          echo "CIRCLE_DISCOVERY_HTTP=$code"
          test "$code" = "200"
          python3 - "$body" <<'PY'
          import json, pathlib, sys
          p=json.loads(pathlib.Path(sys.argv[1]).read_text())
          needle_host="agentresolver.vercel.app"
          needle_payto="0x66e19457ffc829e8ed74706f5c1399c6f6466de8"
          matches=[]
          def walk(v,path="$"):
              if isinstance(v,dict):
                  raw=json.dumps(v,separators=(",",":"),sort_keys=True).lower()
                  if needle_host in raw or needle_payto in raw:
                      matches.append((path,v))
                  for k,x in v.items(): walk(x,f"{path}.{k}")
              elif isinstance(v,list):
                  for i,x in enumerate(v): walk(x,f"{path}[{i}]")
          walk(p)
          uniq=[]
          seen=set()
          for path,obj in matches:
              raw=json.dumps(obj,separators=(",",":"),sort_keys=True)
              key=(obj.get("resource") if isinstance(obj,dict) else None) or raw
              if key in seen: continue
              seen.add(key)
              uniq.append({"path":path,"record":obj})
          print(json.dumps({
              "topLevelType":type(p).__name__,
              "topLevelKeys":sorted(p.keys()) if isinstance(p,dict) else None,
              "agentresolverMatchCount":len(uniq),
              "matches":uniq[:25],
          },indent=2)[:30000])
          PY
