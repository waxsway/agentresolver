name: One-off Verified Resolve buyer distribution

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  distribute:
    if: github.head_ref == 'distribution/verified-resolve-buyers-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERIFIED_URL: "https://agentresolver.vercel.app/api/verified-resolve?goal=Verify%20a%20public%20MCP%20capability%20before%20agent%20execution&protocol=mcp&requireHttps=true"
      PAY_TO: "0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8"
    steps:
      - name: Verify exact GET-compatible paid contract
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS --connect-timeout 5 --max-time 25 -o "$body" -w '%{http_code}' -X GET "$VERIFIED_URL")"
          test "$code" = "402"
          python3 - "$body" "$PAY_TO" <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1], "r", encoding="utf-8"))
          assert payload.get("x402Version") == 2
          accepts=payload.get("accepts") or []
          assert any(
              item.get("network") == "eip155:8453"
              and str(item.get("amount")) == "20000"
              and item.get("payTo") == sys.argv[2]
              for item in accepts
          )
          print("Verified Resolve GET paid contract is live at $0.02 USDC.")
          PY

      - name: Opt Verified Resolve into Market402 real paid delivery probes
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          payload="$(jq -cn --arg resource "$VERIFIED_URL" '{resource:$resource,declared_price_usd:0.02,paid_probe_optin:true}')"
          code="$(curl -sS --connect-timeout 5 --max-time 25 -o "$body" -w '%{http_code}' -X POST 'https://market402.com/submit' -H 'content-type: application/json' --data "$payload" || printf '000')"
          cat "$body" 2>/dev/null || true
          echo
          case "$code" in
            200|201|202|409) ;;
            429|500|502|503|504|000) echo "::notice::Market402 temporarily unavailable/rate-limited (HTTP $code); no funds used." ;;
            *) echo "::warning::Unexpected Market402 status $code; no funds used." ;;
          esac

      - name: Submit Verified Resolve to NoHumans free verification queue
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          payload="$(jq -cn --arg endpoint "$VERIFIED_URL" '{
            name:"AgentResolver Verified Resolve",
            description:"$0.02 USDC provider-neutral capability procurement plus fail-closed live MCP/x402 compatibility evidence before an autonomous agent trusts, executes, or pays an unfamiliar capability.",
            endpoint_url:$endpoint,
            category:"tools.verification",
            price_amount:0.02,
            price_currency:"USDC",
            chains:["base","solana"]
          }')"
          code="$(curl -sS --connect-timeout 5 --max-time 25 -o "$body" -w '%{http_code}' -X POST 'https://nohumans.directory/v1/listings' -H 'content-type: application/json' --data "$payload" || printf '000')"
          python3 - "$body" <<'PY'
          import json, sys
          raw=open(sys.argv[1], "r", encoding="utf-8").read()
          try:
              payload=json.loads(raw)
          except Exception:
              print(raw)
              raise SystemExit(0)
          if isinstance(payload, dict) and "claim_token" in payload:
              payload["claim_token"]="[REDACTED]"
          if isinstance(payload, dict) and isinstance(payload.get("data"), dict) and "claim_token" in payload["data"]:
              payload["data"]["claim_token"]="[REDACTED]"
          print(json.dumps(payload,separators=(",",":")))
          PY
          case "$code" in
            200|201|202|409) ;;
            429|500|502|503|504|000) echo "::notice::NoHumans temporarily unavailable/rate-limited (HTTP $code); no funds used." ;;
            *) echo "::warning::Unexpected NoHumans status $code; no funds used." ;;
          esac

      - name: Self-list Verified Resolve with Paywitness when free
        shell: bash
        run: |
          set -euo pipefail
          if ! curl --fail-with-body -sS --retry 2 --retry-delay 2 'https://paywitness.ai/openapi.json' -o /tmp/paywitness-openapi.json; then
            echo "::notice::Paywitness OpenAPI unavailable; skip without spending."
            exit 0
          fi
          python3 - "$VERIFIED_URL" "$PAY_TO" <<'PY'
          import json, sys
          from pathlib import Path
          spec=json.loads(Path("/tmp/paywitness-openapi.json").read_text())
          post=((spec.get("paths") or {}).get("/list") or {}).get("post")
          if not post:
              raise SystemExit("Paywitness no longer exposes POST /list")
          schema=(((post.get("requestBody") or {}).get("content") or {}).get("application/json") or {}).get("schema") or {}
          def resolve(node):
              seen=set()
              while isinstance(node,dict) and "$ref" in node:
                  ref=node["$ref"]
                  if ref in seen or not ref.startswith("#/"): break
                  seen.add(ref); cur=spec
                  for part in ref[2:].split("/"):
                      cur=cur[part.replace("~1","/").replace("~0","~")]
                  node=cur
              return node if isinstance(node,dict) else {}
          schema=resolve(schema); props=schema.get("properties") or {}; required=list(schema.get("required") or [])
          target=sys.argv[1]
          values={
            "resource":target,"url":target,"endpoint":target,"endpoint_url":target,"resource_url":target,
            "name":"AgentResolver Verified Resolve",
            "description":"$0.02 provider-neutral fail-closed live verification of unfamiliar MCP/x402 capabilities before trust, execution, or payment.",
            "method":"GET","price":0.02,"price_usd":0.02,"priceUsd":0.02,"declared_price_usd":0.02,
            "network":"eip155:8453","chain":"base","payTo":sys.argv[2],"pay_to":sys.argv[2],
            "tags":["x402","mcp","capability-verification","agent-procurement","trust"]
          }
          payload={}
          for key in props:
              if key not in values: continue
              value=values[key]; prop=resolve(props[key]); enum=prop.get("enum")
              if enum and value not in enum:
                  if key in ("network","chain"):
                      value=next((v for v in enum if "8453" in str(v) or str(v).lower()=="base"), None)
                      if value is None: continue
                  else: continue
              payload[key]=value
          missing=[k for k in required if k not in payload]
          if missing:
              print(json.dumps({"missing":missing,"properties":sorted(props.keys())}))
              raise SystemExit("Paywitness schema changed; refusing to guess.")
          if not any(k in payload for k in ("resource","url","endpoint","endpoint_url","resource_url")):
              raise SystemExit("No recognized Paywitness target URL field.")
          Path("/tmp/paywitness-verified.json").write_text(json.dumps(payload,separators=(",",":")))
          print(json.dumps({"fields":sorted(payload.keys())}))
          PY
          body="$(mktemp)"
          code="$(curl -sS --connect-timeout 5 --max-time 25 -o "$body" -w '%{http_code}' -X POST 'https://paywitness.ai/list' -H 'content-type: application/json' --data-binary @/tmp/paywitness-verified.json || printf '000')"
          cat "$body" 2>/dev/null || true
          echo
          case "$code" in
            200|201|202|204|409) ;;
            402) echo "::notice::Paywitness listing requires payment; no payment attempted." ;;
            429|500|502|503|504|000) echo "::notice::Paywitness unavailable/rate-limited (HTTP $code); no payment attempted." ;;
            *) echo "::warning::Unexpected Paywitness status $code; no payment attempted." ;;
          esac

      - name: Attempt free Aegis registration only
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS --connect-timeout 5 --max-time 20 -G -o "$body" -w '%{http_code}' 'https://aegis.borisinc.com/submit' --data-urlencode "url=$VERIFIED_URL" --data-urlencode 'name=AgentResolver Verified Resolve' --data-urlencode 'category=verification' --data-urlencode 'price_usd=0.02' || printf '000')"
          cat "$body" 2>/dev/null || true
          echo
          case "$code" in
            200|201|202|204|409) ;;
            402) echo "::notice::Aegis registration is paid; stopped without payment." ;;
            429|500|502|503|504|530|000) echo "::notice::Aegis unavailable/rate-limited (HTTP $code); no payment attempted." ;;
            *) echo "::warning::Unexpected Aegis status $code; no payment attempted." ;;
          esac

      - name: Attempt exact AgentCash registration
        env:
          HOME: ${{ runner.temp }}/agentcash-home
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          if npx -y agentcash@0.17.1 register "$VERIFIED_URL" --yes --format json; then
            echo "AgentCash accepted exact Verified Resolve resource registration."
          else
            echo "::notice::AgentCash did not accept endpoint-specific registration; origin indexing remains authoritative."
          fi

      - name: Confirm Market402 roster visibility
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://market402.com/optin.json' -o /tmp/market402-optin.json || exit 0
          if grep -Fq 'agentresolver.vercel.app/api/verified-resolve' /tmp/market402-optin.json; then
            echo "Verified Resolve is visible in Market402 paid-probe roster."
          else
            echo "::notice::Market402 accepted/queued the resource but roster has not refreshed yet."
          fi
