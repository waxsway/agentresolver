name: Audit AgentBIT AgentResolver Discovery

on:
  push:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-slim
    timeout-minutes: 4
    steps:
      - name: Query free AgentBIT discovery
        shell: bash
        run: |
          set -euo pipefail
          for q in 'AgentResolver' 'payment guard' 'x402 payment preflight'; do
            echo "=== QUERY: $q ==="
            body="$(mktemp)"
            code="$(curl -sS --connect-timeout 5 --max-time 30               -o "$body" -w '%{http_code}'               --get 'https://agentbit.app/api/discover'               --data-urlencode "q=$q"               --data-urlencode 'limit=25' || printf '000')"
            echo "HTTP $code"
            if [ "$code" != "200" ]; then
              head -c 1500 "$body" || true
              echo
              exit 1
            fi
            python3 -c 'import json,sys; data=json.load(open(sys.argv[1],"r",encoding="utf-8")); rows=data.get("results") or data.get("data") or data.get("tools") or []; rows=rows if isinstance(rows,list) else []; sel=[{"rank":i,"row":r} for i,r in enumerate(rows,1) if "agentresolver" in json.dumps(r,separators=(",",":"),sort_keys=True).lower() or "agentresolver.vercel.app" in json.dumps(r,separators=(",",":"),sort_keys=True).lower() or "payment-guard" in json.dumps(r,separators=(",",":"),sort_keys=True).lower()]; print(json.dumps({"total_returned":len(rows),"matches":sel},separators=(",",":"),sort_keys=True))' "$body"
          done
