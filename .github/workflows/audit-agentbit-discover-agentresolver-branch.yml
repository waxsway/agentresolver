name: Audit AgentBIT OpenAPI Contracts

on:
  push:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-slim
    timeout-minutes: 4
    steps:
      - name: Read AgentBIT discovery and execute contracts
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS --connect-timeout 5 --max-time 30 -o "$body" -w '%{http_code}' 'https://agentbit.app/openapi.json' || printf '000')"
          echo "HTTP $code"
          test "$code" = "200"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); p=d.get("paths",{}); print(json.dumps({"discover":p.get("/api/discover"),"routeExecute":p.get("/v1/route/execute")},separators=(",",":"),sort_keys=True))' "$body"
