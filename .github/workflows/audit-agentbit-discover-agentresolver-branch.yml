name: Audit AgentBIT OpenAPI Route Paths

on:
  push:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-slim
    timeout-minutes: 4
    steps:
      - name: Read route/discovery path names
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS --connect-timeout 5 --max-time 30 -o "$body" -w '%{http_code}' 'https://agentbit.app/openapi.json' || printf '000')"
          echo "HTTP $code"
          test "$code" = "200"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); p=d.get("paths",{}); out={k:v for k,v in p.items() if any(t in k.lower() for t in ("route","discover","recommend"))}; print(json.dumps(out,separators=(",",":"),sort_keys=True))' "$body"
