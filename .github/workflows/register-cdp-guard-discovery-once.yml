name: Register CDP Guard Discovery Once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/register-cdp-guard-discovery-once.yml"

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RESOURCE: "https://agentresolver.vercel.app/api/cdp-payment-guard?url=https%3A%2F%2Fagentresolver.vercel.app%2Fapi%2Fx402-ping&method=GET"
      PAYOUT: "0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8"
    steps:
      - name: Validate live CDP Guard before distribution
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          code="$(curl -sS --connect-timeout 5 --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' "$RESOURCE")"
          test "$code" = "402"
          jq -e '
            .x402Version == 2 and
            any(.accepts[];
              .scheme=="exact" and
              .network=="eip155:8453" and
              .amount=="2000" and
              .asset=="0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913" and
              .payTo=="0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8"
            )
          ' "$body" >/dev/null
          python3 - "$headers" <<'PY'
          import base64,json,sys
          lines=open(sys.argv[1],encoding="utf-8",errors="replace").read().splitlines()
          raw=next((x.split(":",1)[1].strip() for x in lines if x.lower().startswith("payment-required:")),None)
          if not raw:
              raise SystemExit("missing PAYMENT-REQUIRED header")
          raw += "=" * (-len(raw) % 4)
          data=json.loads(base64.urlsafe_b64decode(raw).decode("utf-8"))
          info=((((data.get("extensions") or {}).get("bazaar") or {}).get("info") or {}))
          assert (info.get("input") or {}).get("method") == "GET"
          PY

      - name: Register with x402 Arena
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          payload="$(jq -cn --arg endpoint "$RESOURCE" --arg wallet "$PAYOUT" '{
            name:"agentresolver-cdp-payment-guard",
            endpoint:$endpoint,
            niche:"developer-tools",
            description:"$0.002 Base USDC verify-before-pay guard on Coinbase CDP. Checks a live x402 challenge before autonomous wallet authorization.",
            walletAddress:$wallet,
            method:"GET",
            resourceType:"http",
            inputSchema:{
              type:"object",
              properties:{
                url:{type:"string",format:"uri"},
                method:{type:"string",enum:["GET","HEAD","POST"]},
                maxPriceUsd:{type:"number",minimum:0},
                expectedPayTo:{type:"string"},
                expectedNetwork:{type:"string"}
              },
              required:["url"],
              additionalProperties:false
            },
            outputSchema:{
              type:"object",
              properties:{
                prepaymentDecision:{
                  type:"object",
                  properties:{
                    decision:{type:"string",enum:["eligible","blocked"]},
                    eligibleForCallerAuthorization:{type:"boolean"}
                  }
                }
              }
            }
          }')"
          code="$(curl -sS --connect-timeout 10 --max-time 45             -o "$body" -w '%{http_code}'             -X POST 'https://core.x402arena.gg/register'             -H 'content-type: application/json'             -H 'user-agent: agentresolver-free-distribution/1.0'             --data "$payload" || printf '000')"
          echo "x402_arena_http=$code"
          python3 - "$body" <<'PY'
          import json,sys
          raw=open(sys.argv[1],encoding="utf-8",errors="replace").read()
          try:
              data=json.loads(raw)
              safe={k:data.get(k) for k in ("id","name","status","active","verified","price","network","bazaarCompatible","message","error") if k in data}
              print(json.dumps(safe,separators=(",",":"),sort_keys=True))
          except Exception:
              print(raw[:1500])
          PY
          case "$code" in
            200|201|202|409) ;;
            429|500|502|503|504|000) echo "::notice::x402 Arena temporarily unavailable; no paid retry attempted." ;;
            *) echo "::warning::x402 Arena returned HTTP $code; no retry loop created." ;;
          esac

      - name: Register with x402dash
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          payload="$(jq -cn --arg url "$RESOURCE" '{
            url:$url,
            name:"AgentResolver CDP Payment Guard",
            description:"$0.002 Base USDC x402 verify-before-pay guard using Coinbase CDP. Validates live recipient, amount, network, asset, scheme and resource binding before caller authorization.",
            category:"Agents/Developer Tools",
            tags:["x402","coinbase-cdp","payment-guard","preflight","agent-payments"]
          }')"
          code="$(curl -sS --connect-timeout 10 --max-time 45             -o "$body" -w '%{http_code}'             -X POST 'https://api.x402dash.com/v1/register'             -H 'content-type: application/json'             --data "$payload" || printf '000')"
          echo "x402dash_http=$code"
          python3 - "$body" <<'PY'
          import json,sys
          raw=open(sys.argv[1],encoding="utf-8",errors="replace").read()
          try:
              data=json.loads(raw)
              if isinstance(data,dict):
                  safe={k:data.get(k) for k in ("id","serviceId","name","status","message","error","url") if k in data}
                  print(json.dumps(safe,separators=(",",":"),sort_keys=True))
              else:
                  print(json.dumps(data)[:1500])
          except Exception:
              print(raw[:1500])
          PY
          case "$code" in
            200|201|202|409) ;;
            429|500|502|503|504|000) echo "::notice::x402dash temporarily unavailable; no paid retry attempted." ;;
            *) echo "::warning::x402dash returned HTTP $code; no retry loop created." ;;
          esac
