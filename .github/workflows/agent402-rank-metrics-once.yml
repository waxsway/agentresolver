name: One-shot Agent402 Rank Metrics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent402-rank-metrics-once.yml"

permissions:
  contents: read
  statuses: write

jobs:
  measure:
    runs-on: ubuntu-slim
    timeout-minutes: 4
    steps:
      - name: Measure
        id: m
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, urllib.parse, urllib.request
          q="verify x402 payment before paying"
          u="https://agent402.tools/api/route?"+urllib.parse.urlencode({"q":q,"include":"external"})
          req=urllib.request.Request(u,headers={"User-Agent":"agentresolver-rank-metric/1.0"})
          with urllib.request.urlopen(req,timeout=60) as r:
              p=json.loads(r.read().decode())
          rows=p.get("results") or []
          top=rows[0] if rows else {}
          ar={}
          rank=0
          for i,row in enumerate(rows,1):
              b=json.dumps(row,separators=(",",":"),sort_keys=True).lower()
              if "agentresolver.vercel.app" in b or '"sellername":"agentresolver"' in b:
                  ar=row; rank=i; break
          def flat(v,p=""):
              o={}
              if isinstance(v,dict):
                  for k,x in v.items():
                      q=f"{p}.{k}" if p else str(k); o.update(flat(x,q))
              elif isinstance(v,(str,int,float,bool)) or v is None:
                  o[p]=v
              return o
          def pick(v,needle):
              for k,x in flat(v).items():
                  if needle in k.lower() and isinstance(x,(str,int,float,bool)):
                      return x
              return "na"
          vals={
            "rank":rank,
            "ts":pick(top,"score"),"as":pick(ar,"score"),
            "th":pick(top,"health"),"ah":pick(ar,"health"),
            "tp":pick(top,"price"),"ap":pick(ar,"price"),
            "tk":".".join(sorted(top.keys())) or "none",
            "ak":".".join(sorted(ar.keys())) or "none",
          }
          print(json.dumps({"top":top,"agentresolver":ar,"metrics":vals},separators=(",",":"),sort_keys=True))
          def c(v):
              return re.sub(r'[^a-zA-Z0-9._-]+','-',str(v))[:55] or "na"
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              for k,v in vals.items(): f.write(f"{k}={c(v)}\n")
          PY

      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RANK: ${{ steps.m.outputs.rank }}
          TS: ${{ steps.m.outputs.ts }}
          AS: ${{ steps.m.outputs.as }}
          TH: ${{ steps.m.outputs.th }}
          AH: ${{ steps.m.outputs.ah }}
          TP: ${{ steps.m.outputs.tp }}
          AP: ${{ steps.m.outputs.ap }}
          TK: ${{ steps.m.outputs.tk }}
          AK: ${{ steps.m.outputs.ak }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          rows=[
            (f"distribution/a402-rank-{os.environ['RANK']}","rank"),
            (f"distribution/a402-score-top-{os.environ['TS']}-ar-{os.environ['AS']}","score"),
            (f"distribution/a402-health-top-{os.environ['TH']}-ar-{os.environ['AH']}","health"),
            (f"distribution/a402-price-top-{os.environ['TP']}-ar-{os.environ['AP']}","price"),
            (f"distribution/a402-topkeys-{os.environ['TK']}","top keys"),
            (f"distribution/a402-arkeys-{os.environ['AK']}","AR keys"),
          ]
          for context,desc in rows:
              payload={"state":"success","context":context[:100],"description":desc,"target_url":"https://agent402.tools/faq"}
              req=urllib.request.Request(
                f"https://api.github.com/repos/waxsway/agentresolver/statuses/{os.environ['SHA']}",
                data=json.dumps(payload).encode(),
                headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"},
                method="POST"
              )
              with urllib.request.urlopen(req,timeout=30) as r: print(r.status)
          PY
