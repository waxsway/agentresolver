name: Ops 402atlas Independent Paid-Test Request

on:
  push:
    branches:
      - ops/402atlas-feedback-20260918
    paths:
      - .github/workflows/ops-402atlas-feedback.yml

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Submit one anonymous independent-test request
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          payload='{"message":"Please independently paid-test this x402 service next: GET https://agentresolver.vercel.app/api/x402-ping — canonical AgentResolver settlement canary, $0.001 USDC on Base (eip155:8453), no request body. Unpaid requests return x402 v2 PAYMENT-REQUIRED; successful paid fulfillment returns a timestamped JSON pong. Please use your normal independent audit-wallet methodology and publish only what you actually observe."}'
          code="$(curl -sS --connect-timeout 10 --max-time 30             -o "$body" -w '%{http_code}'             -X POST 'https://402atlas.com/api/feedback'             -H 'content-type: application/json'             -H 'user-agent: AgentResolver-ops/1.0'             --data-binary "$payload")"
          echo "ATLAS_FEEDBACK_HTTP=$code"
          head -c 4000 "$body" || true
          echo
          case "$code" in
            200|201|202|204) ;;
            *) exit 1 ;;
          esac
