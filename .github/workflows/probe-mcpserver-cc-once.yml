name: Probe mcpserver.cc Submit Form

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-mcpserver-cc-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public submit page request code
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -L "https://mcpserver.cc/submit" -o /tmp/page.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path("/tmp/page.html").read_text(errors="ignore")
          needles=["/api/submit-server","fetch(","serverName","description","JSON.stringify","FormData","name:","url:"]
          for needle in needles:
              print("\n===", needle, "===")
              start=0
              for _ in range(8):
                  i=s.find(needle,start)
                  if i<0: break
                  print(s[max(0,i-500):min(len(s),i+1200)])
                  start=i+len(needle)
          PY
