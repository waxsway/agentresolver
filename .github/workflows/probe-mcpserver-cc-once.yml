name: Probe mcpserver.cc Submit Form

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-mcpserver-cc-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public submit page
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -L "https://mcpserver.cc/submit" -o /tmp/page.html
          echo "=== direct endpoint references ==="
          grep -Eo '(/api/[A-Za-z0-9_./?-]+|https://mcpserver\.cc/api/[A-Za-z0-9_./?-]+)' /tmp/page.html | sort -u || true
          echo "=== input/form references ==="
          grep -Eo '(name|repo|repository|url|description|connect|serverName|server_name)[A-Za-z0-9_-]{0,30}' /tmp/page.html | sort -u | head -100 || true
          echo "=== javascript chunks ==="
          grep -Eo 'src="[^"]+\.js[^"]*"' /tmp/page.html | sed 's/src="//;s/"$//' | head -30 > /tmp/scripts.txt || true
          cat /tmp/scripts.txt
          while read -r src; do
            [ -z "$src" ] && continue
            case "$src" in
              http*) u="$src" ;;
              *) u="https://mcpserver.cc$src" ;;
            esac
            curl -sS -L "$u" || true
          done < /tmp/scripts.txt > /tmp/scripts.js
          echo "=== submit code excerpts ==="
          grep -Eo '.{0,160}(submit-server|api/submit|repository|serverName|description).{0,240}' /tmp/scripts.js | head -80 || true
