name: Audit Agent402 Smart Order Router Once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-agent402-smart-router-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query exact paid buyer intents
        shell: bash
        run: |
          set -euo pipefail
          queries=(
            "x402 preflight"
            "verify endpoint before paying"
            "payTo verification"
            "endpoint safety"
            "USDC payment check"
            "verify before paying x402 endpoint"
          )

          for q in "${queries[@]}"; do
            echo "=== ROUTE INTENT: $q ==="
            payload=$(jq -cn --arg query "$q" '{query:$query,top:10,include:"external"}')
            code=$(curl -sS -o /tmp/route.json -w '%{http_code}' \
              -X POST 'https://agent402.tools/api/route' \
              -H 'content-type: application/json' \
              -d "$payload")
            test "$code" -ge 200 && test "$code" -lt 300

            jq '{
              query,
              count,
              top5: [(.results // [])[0:5][]? | {
                rank,seller,origin,host,name,tool,route,price,priceUsd,matchScore,health,
                networks,routerDispatchEligible,executeVia,executeViaWhenEligible
              }],
              agentresolver: [(.results // [])[]? | select(
                ((.origin // "") | contains("agentresolver.vercel.app")) or
                ((.host // "") | contains("agentresolver.vercel.app")) or
                ((.seller // "") | ascii_downcase | contains("agentresolver"))
              ) | {
                rank,seller,origin,host,name,tool,route,price,priceUsd,matchScore,health,
                networks,routerDispatchEligible,routerDispatchReason,executeVia,executeViaWhenEligible
              }]
            }' /tmp/route.json
          done

      - name: Inspect indexed AgentResolver seller
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://agent402.tools/api/index?seller=agentresolver.vercel.app' \
            'https://agent402.tools/api/index?origin=https%3A%2F%2Fagentresolver.vercel.app'
          do
            echo "=== $url ==="
            code=$(curl -sS -o /tmp/index.json -w '%{http_code}' "$url")
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              jq '.' /tmp/index.json
              exit 0
            fi
          done
          echo 'Could not fetch indexed seller detail.' >&2
          exit 1
