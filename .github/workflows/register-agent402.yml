name: Register Agent402 Index

on:
  workflow_dispatch:
  schedule:
    - cron: "19 */12 * * *"
  push:
    branches: [main]
    paths:
      - '.github/workflows/register-agent402.yml'
permissions:
  contents: read
  statuses: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify live x402 challenge
        run: |
          set -euo pipefail
          code=$(curl -sS -D /tmp/challenge-headers.txt -o /tmp/challenge.json -w '%{http_code}' \
            -X GET 'https://agentresolver.vercel.app/api/x402-ping' \
            -H 'x-agentresolver-internal: 1')
          test "$code" = "402"
          payment_required="$(awk 'BEGIN{IGNORECASE=1} /^payment-required:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/challenge-headers.txt)"
          PAYMENT_REQUIRED="$payment_required" python3 - <<'PY'
          import base64
          import json
          import os
          
          raw = os.environ["PAYMENT_REQUIRED"].strip()
          assert raw, "PAYMENT-REQUIRED header missing"
          raw += "=" * (-len(raw) % 4)
          payload = json.loads(base64.urlsafe_b64decode(raw).decode("utf-8"))
          accepts = payload.get("accepts") or []
          assert any(str(item.get("amount")) == "1000" for item in accepts), "x402-ping $0.001 option missing"
          PY

          pack_code=$(curl -sS -o /tmp/distribution-pack.json -w '%{http_code}' \
            -X GET 'https://agentresolver.vercel.app/api/agent-distribution-pack' \
            -H 'x-agentresolver-internal: 1')
          test "$pack_code" = "402"
          python3 - <<'PY'
          import json
          payload=json.load(open("/tmp/distribution-pack.json","r",encoding="utf-8"))
          accepts=payload.get("accepts") or []
          assert any(str(item.get("amount")) == "5000000" for item in accepts), "Distribution Pack $5 option missing"
          PY
          curl -fsS -H 'x-agentresolver-internal: 1'             'https://agentresolver.vercel.app/.well-known/x402' -o /tmp/x402.json
          jq -e '
            any(.services[]?; .id == "agent-distribution-pack" and .price_usdc == "5") and
            any(.resources[]?; .resource == "POST /api/agent-distribution-pack")
          ' /tmp/x402.json >/dev/null

      - name: Register origin with Agent402 free index
        id: register
        run: |
          set -euo pipefail
          code=""
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/register.json -w '%{http_code}' \
              --connect-timeout 5 --max-time 15 \
              -X POST 'https://agent402.tools/api/index/register' \
              -H 'content-type: application/json' \
              --data '{"origin":"https://agentresolver.vercel.app"}' || printf '000')
            echo "Agent402 registration attempt $attempt -> HTTP $code"
            cat /tmp/register.json 2>/dev/null || true
            echo
            case "$code" in
              200|201|202|204|409) break ;;
              429)
                echo "::warning::Agent402 registration is rate-limited; keeping the existing index entry and continuing to buyer-ranking audit."
                break
                ;;
              500|502|503|504|000)
                if [ "$attempt" -lt 3 ]; then
                  sleep $((attempt * 2))
                  continue
                fi
                echo "::warning::Agent402 registration remained unavailable after retries (HTTP $code); keeping the existing index entry and continuing to buyer-ranking audit."
                ;;
              *)
                echo "Unexpected registration status: $code" >&2
                exit 1
                ;;
            esac
          done
          echo "http_status=$code" >> "$GITHUB_OUTPUT"

      - name: Publish Agent402 health-refresh registration status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          HTTP_STATUS: ${{ steps.register.outputs.http_status }}
        shell: bash
        run: |
          code="${HTTP_STATUS:-0}"
          case "$code" in
            200|201|202|204|409) state=success ;;
            429) state=success ;;
            *) state=failure ;;
          esac
          export state code
          python - <<'PY'
          import json, os, urllib.request
          payload={
            "state":os.environ["state"],
            "context":f"distribution/agent402-health-refresh-http-{os.environ['code']}"[:100],
            "description":f"Agent402 origin refresh returned HTTP {os.environ['code']}"[:140],
            "target_url":"https://agent402.tools/marketplace"
          }
          req=urllib.request.Request(
            f"https://api.github.com/repos/waxsway/agentresolver/statuses/{os.environ['SHA']}",
            data=json.dumps(payload).encode(),
            headers={
              "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
              "Accept":"application/vnd.github+json",
              "Content-Type":"application/json",
              "X-GitHub-Api-Version":"2022-11-28"
            },
            method="POST"
          )
          with urllib.request.urlopen(req,timeout=30) as resp:
              print(resp.status)
          PY

      - name: Audit buyer-query rankings
        run: |
          set -euo pipefail
          queries=(
            "agent distribution"
            "API agent distribution"
            "MCP discoverability"
            "MCP distribution"
            "agent service launch"
            "API discoverability for AI agents"
            "provider launch check"
            "x402 settlement test"
            "x402 settlement verify"
            "payment receipt verification"
            "verify endpoint before paying"
          )
          for q in "${queries[@]}"; do
            encoded="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$q")"
            echo "=== QUERY: $q ==="
            curl -fsS "https://agent402.tools/api/route?q=$encoded&include=external" -o /tmp/route.json
            python - "$q" /tmp/route.json <<'PY'
          import json,sys
          q=sys.argv[1]
          data=json.load(open(sys.argv[2]))
          rows=data.get("results") or data.get("routes") or data.get("data") or []
          if isinstance(rows,dict):
              rows=rows.get("results") or rows.get("routes") or []
          print(json.dumps({
              "query":q,
              "top":[
                  {
                      "rank":idx,
                      "seller":row.get("seller"),
                      "name":row.get("name"),
                      "slug":row.get("slug"),
                      "priceUsd":row.get("priceUsd"),
                      "score":row.get("score"),
                      "health":row.get("health"),
                      "routerDispatchEligible":row.get("routerDispatchEligible"),
                      "executeViaCallableNow":row.get("executeViaCallableNow"),
                      "networks":row.get("networks")
                  }
                  for idx,row in enumerate(rows[:5],1)
              ]
          }, separators=(",",":")))
          for idx,row in enumerate(rows,1):
              if "agentresolver.vercel.app" in json.dumps(row):
                  print(json.dumps({
                      "query":q,
                      "agentresolverRank":idx,
                      "name":row.get("name"),
                      "slug":row.get("slug"),
                      "priceUsd":row.get("priceUsd"),
                      "score":row.get("score"),
                      "routerDispatchEligible":row.get("routerDispatchEligible"),
                      "routerDispatchReason":row.get("routerDispatchReason"),
                      "executeViaCallableNow":row.get("executeViaCallableNow"),
                      "networks":row.get("networks")
                  }, separators=(",",":")))
                  break
          else:
              print(json.dumps({"query":q,"agentresolverRank":None,"visible":False},separators=(",",":")))
          PY
          done
