name: Register Agent402 Index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/register-agent402.yml'
      - 'src/lib/paidCapabilities.ts'
      - 'public/openapi.json'
      - 'public/.well-known/x402'
      - 'public/.well-known/x402-catalog.json'
      - 'public/.well-known/agent.json'
      - 'public/.well-known/x402-service.json'

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify live x402 challenge
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/challenge.json -w '%{http_code}' \
            -X GET 'https://agentresolver.vercel.app/api/x402-ping' \
            -H 'x-agentresolver-internal: agent402-registration')
          test "$code" = "402"
          grep -q 'accepts' /tmp/challenge.json

      - name: Register origin with Agent402 free index
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/register.json -w '%{http_code}' \
            -X POST 'https://agent402.tools/api/index/register' \
            -H 'content-type: application/json' \
            --data '{"origin":"https://agentresolver.vercel.app"}')
          cat /tmp/register.json
          case "$code" in
            200|201|202|204|409) ;;
            *) echo "Unexpected registration status: $code" >&2; exit 1 ;;
          esac

      - name: Check buyer-search visibility
        run: |
          set -euo pipefail
          curl -fsS 'https://agent402.tools/api/find?q=api%20trust%20security%20preflight&k=10' -o /tmp/find.json
          cat /tmp/find.json
          if ! grep -q 'agentresolver.vercel.app' /tmp/find.json; then
            echo "::warning::AgentResolver is registered but not yet visible in this buyer-search query; crawler/index refresh may still be pending."
          fi
