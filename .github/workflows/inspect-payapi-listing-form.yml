name: Inspect PayAPI Listing Form

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-payapi-listing-form.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Extract exact PayAPI listing create flows
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 'https://payapi.market/list' -o /tmp/list.html
          js="$(grep -Eo '/assets/index-[A-Za-z0-9_-]+\.js' /tmp/list.html | head -1)"
          test -n "$js"
          echo "JS=$js"
          curl -fsS --max-time 30 "https://payapi.market$js" -o /tmp/payapi.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/payapi.js').read_text(errors='ignore')
          needles=[
            '.from(`providers`).insert',
            '.from("providers").insert',
            '.from(`api_listings`).insert',
            '.from("api_listings").insert',
            'function Ll(',
            'function Rl(',
            'company_name',
            'wallet_address',
            'contact_email',
            'base_url',
            'mcp_endpoint',
            'price_min',
            'price_max',
            'Deployed URL',
            'Your name',
            'Your email',
            'Payout',
            'Review and submit',
            'Submit for verification',
            '/api/'
          ]
          for needle in needles:
              hits=[]
              start=0
              while len(hits)<6:
                  i=s.find(needle,start)
                  if i<0: break
                  hits.append(i)
                  start=i+len(needle)
              for k,i in enumerate(hits,1):
                  print(f'\n=== {needle} #{k} @ {i} ===')
                  print(s[max(0,i-1600):min(len(s),i+5200)])
          PY
