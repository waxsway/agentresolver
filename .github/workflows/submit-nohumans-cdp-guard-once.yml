name: Submit NoHumans CDP Guard Once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/submit-nohumans-cdp-guard-once.yml"

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      RESOURCE: "https://agentresolver.vercel.app/api/cdp-payment-guard?url=https%3A%2F%2Fagentresolver.vercel.app%2Fapi%2Fx402-ping&method=GET"
    steps:
      - name: Verify live Coinbase-CDP Guard
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          headers="$(mktemp)"
          code="$(curl -sS --connect-timeout 5 --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' "$RESOURCE")"
          test "$code" = "402"
          jq -e '
            .x402Version == 2 and
            any(.accepts[]; .network=="eip155:8453" and .amount=="2000" and .payTo=="0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8")
          ' "$body" >/dev/null
          python3 - "$headers" <<'PY'
          import base64,json,sys
          lines=open(sys.argv[1],encoding="utf-8",errors="replace").read().splitlines()
          raw=next((x.split(":",1)[1].strip() for x in lines if x.lower().startswith("payment-required:")),None)
          if not raw:
              raise SystemExit("missing PAYMENT-REQUIRED header")
          raw += "=" * (-len(raw) % 4)
          data=json.loads(base64.urlsafe_b64decode(raw).decode("utf-8"))
          bazaar=((data.get("extensions") or {}).get("bazaar") or {})
          assert (((bazaar.get("info") or {}).get("input") or {}).get("method")=="GET")
          PY

      - name: Submit distinct CDP Guard listing
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          payload="$(jq -cn --arg endpoint "$RESOURCE" '{
            name:"AgentResolver CDP Payment Guard",
            description:"$0.002 Base USDC x402 verify-before-pay guard using Coinbase CDP. It inspects a target x402 challenge and returns a policy-ready payment decision only after successful settlement.",
            endpoint_url:$endpoint,
            category:"tools.verification",
            price_amount:0.002,
            price_currency:"USDC",
            chains:["base"]
          }')"

          code="$(curl -sS --connect-timeout 5 --max-time 45             -o "$body" -w '%{http_code}'             -X POST 'https://nohumans.directory/v1/listings'             -H 'content-type: application/json'             --data "$payload" || printf '000')"

          echo "NoHumans submit -> HTTP $code"
          python3 - "$body" <<'PY'
          import json,sys
          raw=open(sys.argv[1],encoding="utf-8").read()
          try:
              data=json.loads(raw)
          except Exception:
              print(raw)
              raise
          if isinstance(data,dict) and "claim_token" in data:
              data["claim_token"]="[REDACTED]"
          if isinstance(data,dict) and isinstance(data.get("data"),dict) and "claim_token" in data["data"]:
              data["data"]=dict(data["data"])
              data["data"]["claim_token"]="[REDACTED]"
          print(json.dumps(data,separators=(",",":"),sort_keys=True))
          PY

          case "$code" in
            200|201|202|409) ;;
            429|500|502|503|504|000)
              echo "::notice::NoHumans temporarily unavailable (HTTP $code); no user funds used."
              exit 0
              ;;
            *) exit 1 ;;
          esac

      - name: Check discovery visibility
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          body="$(mktemp)"
          code="$(curl -sS --connect-timeout 5 --max-time 30             -o "$body" -w '%{http_code}'             -G 'https://nohumans.directory/v1/discover'             --data-urlencode 'q=AgentResolver CDP Payment Guard' || printf '000')"

          echo "NoHumans discover -> HTTP $code"
          if [ "$code" = "200" ]; then
            python3 - "$body" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          rows=data.get("results") if isinstance(data,dict) else []
          if not isinstance(rows,list): rows=[]
          hits=[]
          for r in rows:
              if not isinstance(r,dict): continue
              if "agentresolver" not in json.dumps(r).lower(): continue
              hits.append({
                  "id":r.get("id"),
                  "name":r.get("name"),
                  "endpoint_url":r.get("endpoint_url"),
                  "status":r.get("status"),
                  "paid_verified":r.get("paid_verified"),
                  "evidence_tier":r.get("evidence_tier")
              })
          print(json.dumps({"agentresolver_hits":hits},separators=(",",":"),sort_keys=True))
          PY
          fi
