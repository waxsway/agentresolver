name: Submit AgentResolver to NoHumans

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/submit-nohumans-current.yml'

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live canary contract
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 20 -o /tmp/ping.json -w '%{http_code}' 'https://agentresolver.vercel.app/api/x402-ping')"
          test "$code" = "402"
          jq -e '.x402Version==2 and (.accepts | any(.network=="eip155:8453" and .amount=="1000" and .payTo=="0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8"))' /tmp/ping.json >/dev/null

      - name: Check current NoHumans record and submit only if absent
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://agentresolver.vercel.app/api/x402-ping'
          curl -fsS --max-time 30 -G 'https://nohumans.directory/v1/discover' \
            --data-urlencode 'q=agentresolver settlement canary' \
            -o /tmp/discover.json
          echo '=== DISCOVERY BEFORE ==='
          jq . /tmp/discover.json | head -c 12000 || cat /tmp/discover.json
          echo

          if grep -Fq "$endpoint" /tmp/discover.json; then
            echo 'NOHUMANS_ALREADY_PRESENT=1'
            exit 0
          fi

          jq -n '{
            name: "AgentResolver — x402 Settlement Canary",
            description: "No-body $0.001 x402 settlement test for funded autonomous agents. Verifies wallet, facilitator, Base USDC payment path, and paid delivery end-to-end; returns a timestamped pong only after successful settlement.",
            endpoint_url: "https://agentresolver.vercel.app/api/x402-ping",
            category: "infra.x402",
            price_amount: 0.001,
            chains: ["base", "solana"],
            sample_query: "https://agentresolver.vercel.app/api/x402-ping"
          }' > /tmp/payload.json

          code="$(curl -sS --max-time 40 -o /tmp/submit.json -w '%{http_code}' \
            -X POST 'https://nohumans.directory/v1/listings' \
            -H 'content-type: application/json' \
            --data-binary @/tmp/payload.json || true)"
          echo "NOHUMANS_SUBMIT_HTTP=$code"
          jq . /tmp/submit.json 2>/dev/null || cat /tmp/submit.json
          case "$code" in
            200|201|202|409) ;;
            *) exit 1 ;;
          esac
