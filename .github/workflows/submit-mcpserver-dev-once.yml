name: Submit AgentResolver to mcpserver.dev

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/submit-mcpserver-dev-once.yml"

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
          "$CHROME" --version

      - name: Install browser driver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/browser
          cd /tmp/browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund puppeteer-core@24.22.0

      - name: Submit public listing
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/browser/submit.mjs <<'JS'
          import puppeteer from "puppeteer-core";

          const browser = await puppeteer.launch({
            executablePath: process.env.CHROME_PATH,
            headless: true,
            args: ["--no-sandbox", "--disable-setuid-sandbox"]
          });

          const page = await browser.newPage();
          const nonGet = [];
          page.on("response", async response => {
            const req = response.request();
            if (req.method() === "GET") return;
            let body = "";
            try { body = (await response.text()).slice(0, 3000); } catch {}
            nonGet.push({
              method: req.method(),
              url: response.url(),
              status: response.status(),
              postData: (req.postData() || "").slice(0, 3000),
              body
            });
          });

          await page.goto("https://mcpserver.dev/", {
            waitUntil: "networkidle2",
            timeout: 60000
          });

          const opened = await page.evaluate(() => {
            const nodes = Array.from(document.querySelectorAll("button, a"));
            const trigger = nodes.find(el => {
              const rect = el.getBoundingClientRect();
              return rect.width > 0 && rect.height > 0 &&
                /submit server/i.test((el.textContent || "").trim());
            });
            if (!trigger) return false;
            trigger.click();
            return true;
          });
          if (!opened) throw new Error("Submit server modal trigger not found");
          await new Promise(r => setTimeout(r, 750));

          const visibleHandle = async selector => {
            const els = await page.$$(selector);
            for (const el of els) {
              const box = await el.boundingBox();
              if (box && box.width > 0 && box.height > 0) return el;
            }
            throw new Error(`Visible field not found: ${selector}`);
          };

          const typeVisible = async (selector, value) => {
            const el = await visibleHandle(selector);
            await el.click();
            await el.type(value);
          };

          await typeVisible(
            'input[placeholder*="github.com/modelcontextprotocol"]',
            "https://github.com/waxsway/agentresolver"
          );
          await typeVisible(
            'input[placeholder*="Web Search"]',
            "AgentResolver"
          );
          await typeVisible(
            'textarea[placeholder*="What does your MCP server do?"]',
            "Free remote MCP capability resolver for AI agents. Discovers and compares tools, APIs, MCP servers, and x402 machine services through one no-auth endpoint."
          );
          await typeVisible(
            'textarea[placeholder*="mcp server, database, browser"]',
            "agent routing, tool discovery, api discovery, mcp, x402, developer tools"
          );

          const selects = await page.$$("select");
          for (const select of selects) {
            const box = await select.boundingBox();
            if (!box || box.width <= 0 || box.height <= 0) continue;
            const options = await select.evaluate(el =>
              Array.from(el.options).map(o => ({ value: o.value, text: o.textContent || "" }))
            );
            const dev = options.find(o => /developer/i.test(o.text));
            if (dev) {
              await select.select(dev.value);
              break;
            }
          }

          const snapshot = await page.evaluate(() => {
            const form = Array.from(document.querySelectorAll("form")).find(form =>
              form.querySelector('input[placeholder*="github.com/modelcontextprotocol"]')
            );
            if (!form) return null;
            return {
              text: form.innerText.slice(0, 2500),
              action: form.getAttribute("action"),
              method: form.getAttribute("method")
            };
          });
          console.log("FORM_SNAPSHOT", JSON.stringify(snapshot));

          const submitted = await page.evaluate(() => {
            const forms = Array.from(document.querySelectorAll("form"));
            const form = forms.find(form => {
              const rect = form.getBoundingClientRect();
              const input = form.querySelector('input[placeholder*="github.com/modelcontextprotocol"]');
              return rect.width > 0 && rect.height > 0 &&
                input && input.value.includes("waxsway/agentresolver");
            });
            if (!form) return false;
            const button = form.querySelector('button[type="submit"]');
            if (!button) return false;
            button.click();
            return true;
          });
          if (!submitted) throw new Error("Populated submit form not found");
          await Promise.race([
            page.waitForNavigation({ waitUntil: "networkidle2", timeout: 30000 }).catch(() => null),
            new Promise(r => setTimeout(r, 9000))
          ]);

          const bodyText = await page.evaluate(() => document.body.innerText.slice(0, 10000));
          console.log("FINAL_URL", page.url());
          console.log("BODY", bodyText);
          console.log("NON_GET", JSON.stringify(nonGet, null, 2));

          const lower = bodyText.toLowerCase();
          const success =
            lower.includes("submitted") ||
            lower.includes("thank") ||
            lower.includes("review") && lower.includes("agentresolver") ||
            lower.includes("success");

          if (!success) throw new Error("No successful submission confirmation detected");

          await browser.close();
          JS
          cd /tmp/browser
          node submit.mjs
