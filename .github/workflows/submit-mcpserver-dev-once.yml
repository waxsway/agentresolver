name: Submit AgentResolver to mcpserver.dev

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/submit-mcpserver-dev-once.yml"

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
          "$CHROME" --version

      - name: Install browser driver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/browser
          cd /tmp/browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund puppeteer-core@24.22.0

      - name: Submit public listing
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/browser/submit.mjs <<'JS'
          import puppeteer from "puppeteer-core";

          const browser = await puppeteer.launch({
            executablePath: process.env.CHROME_PATH,
            headless: true,
            args: ["--no-sandbox", "--disable-setuid-sandbox"]
          });

          const page = await browser.newPage();
          const nonGet = [];
          page.on("response", async response => {
            const req = response.request();
            if (req.method() === "GET") return;
            let body = "";
            try { body = (await response.text()).slice(0, 3000); } catch {}
            nonGet.push({
              method: req.method(),
              url: response.url(),
              status: response.status(),
              postData: (req.postData() || "").slice(0, 3000),
              body
            });
          });

          await page.goto("https://mcpserver.dev/", {
            waitUntil: "networkidle2",
            timeout: 60000
          });

          const fillByPlaceholder = async (needle, value) => {
            const selector = `input[placeholder*="${needle}"], textarea[placeholder*="${needle}"]`;
            const els = await page.$$(selector);
            if (!els.length) throw new Error(`Field not found: ${needle}`);
            await els[0].type(value);
          };

          await fillByPlaceholder(
            "github.com/modelcontextprotocol",
            "https://github.com/waxsway/agentresolver"
          );
          await fillByPlaceholder(
            "Web Search",
            "AgentResolver"
          );
          await fillByPlaceholder(
            "What does your MCP server do?",
            "Free remote MCP capability resolver for AI agents. Discovers and compares tools, APIs, MCP servers, and x402 machine services through one no-auth endpoint."
          );
          await fillByPlaceholder(
            "mcp server, database, browser",
            "agent routing, tool discovery, api discovery, mcp, x402, developer tools"
          );

          // Pick Developer Tools if the category dropdown exposes it; otherwise
          // leave the site's documented auto-classification in control.
          const selects = await page.$$("select");
          if (selects.length) {
            const options = await page.$eval("select", el =>
              Array.from(el.options).map(o => ({ value: o.value, text: o.textContent || "" }))
            );
            const dev = options.find(o => /developer/i.test(o.text));
            if (dev) await page.select("select", dev.value);
          }

          const snapshot = await page.evaluate(() => {
            const form = Array.from(document.querySelectorAll("form")).find(form =>
              form.querySelector('input[placeholder*="github.com/modelcontextprotocol"]')
            );
            if (!form) return null;
            return {
              text: form.innerText.slice(0, 2500),
              action: form.getAttribute("action"),
              method: form.getAttribute("method")
            };
          });
          console.log("FORM_SNAPSHOT", JSON.stringify(snapshot));

          const form = await page.evaluateHandle(() =>
            Array.from(document.querySelectorAll("form")).find(form =>
              form.querySelector('input[placeholder*="github.com/modelcontextprotocol"]')
            )
          );
          const button = await form.asElement().$("button[type=submit]");
          if (!button) throw new Error("Submit button not found");

          await button.click();
          await Promise.race([
            page.waitForNavigation({ waitUntil: "networkidle2", timeout: 30000 }).catch(() => null),
            new Promise(r => setTimeout(r, 9000))
          ]);

          const bodyText = await page.evaluate(() => document.body.innerText.slice(0, 10000));
          console.log("FINAL_URL", page.url());
          console.log("BODY", bodyText);
          console.log("NON_GET", JSON.stringify(nonGet, null, 2));

          const lower = bodyText.toLowerCase();
          const success =
            lower.includes("submitted") ||
            lower.includes("thank") ||
            lower.includes("review") && lower.includes("agentresolver") ||
            lower.includes("success");

          if (!success) throw new Error("No successful submission confirmation detected");

          await browser.close();
          JS
          cd /tmp/browser
          node submit.mjs
