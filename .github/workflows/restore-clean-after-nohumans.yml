name: Restore Healthy CDP Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-clean-after-nohumans.yml'

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      VERCEL_ORG_ID: team_ciQJak0lFZjXNgqry88ZDIKN
      VERCEL_PROJECT_ID: prj_uJKVWBawxKkEjIWV5EQkbkQPIABD
      HEALTHY_DEPLOYMENT_ID: dpl_ErXGyYownF8254n14tDvwwFMiPEv
      HEALTHY_SHA: c2a05df127548c4ecc87ba73467cef72b6e721c3
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Roll production traffic back without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/rollback.json -w '%{http_code}' \
            -X POST "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/rollback/$HEALTHY_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN")"
          echo "ROLLBACK_HTTP=$code"
          case "$code" in
            200|201|202) ;;
            *) cat /tmp/rollback.json; exit 1 ;;
          esac

      - name: Verify canonical CDP canary and paid ping
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..45}; do
            suffix="rollback=$GITHUB_RUN_ID-$attempt"
            canary_code="$(curl -sS --max-time 15 -D /tmp/canary-h -o /tmp/canary-b -w '%{http_code}' "https://agentresolver.vercel.app/api/x402-cdp-canary?$suffix" || true)"
            canary_sha="$(awk 'BEGIN{IGNORECASE=1} /^x-agentresolver-deployment:/ {gsub("\r",""); print $2; exit}' /tmp/canary-h)"
            ping_code="$(curl -sS --max-time 15 -o /tmp/ping-b -w '%{http_code}' "https://agentresolver.vercel.app/api/x402-ping?$suffix" || true)"
            if [ "$canary_code" = "402" ] && [ "$canary_sha" = "$HEALTHY_SHA" ] && [ "$ping_code" = "402" ]; then
              jq -e '
                .x402Version == 2 and
                (.accepts | length) == 1 and
                .accepts[0].scheme == "exact" and
                .accepts[0].network == "eip155:8453" and
                .accepts[0].amount == "1000" and
                .accepts[0].asset == "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913" and
                .accepts[0].payTo == "0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8"
              ' /tmp/canary-b >/dev/null
              echo "CDP_CANARY_RESTORED=true"
              echo "CANONICAL_SHA=$canary_sha"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Canonical production did not recover the known-good CDP canary."
          cat /tmp/canary-b 2>/dev/null || true
          exit 1
