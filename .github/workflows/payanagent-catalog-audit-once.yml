name: One-shot PayanAgent Catalog Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/payanagent-catalog-audit-once.yml"

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Read AgentResolver offers
        id: offers
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS --connect-timeout 5 --max-time 30             -o "$body" -w '%{http_code}'             --get 'https://payanagent.com/api/v1/offers'             --data-urlencode 'q=AgentResolver'             --data-urlencode 'offerType=api'             --data-urlencode 'limit=100' || printf '000')"
          test "$code" = "200"

          python3 - "$body" <<'PY'
          import json, os, re, sys
          data=json.load(open(sys.argv[1],"r",encoding="utf-8"))
          offers=data.get("offers") if isinstance(data,dict) else data
          if not isinstance(offers,list): offers=[]
          rows=[]
          for item in offers:
              if not isinstance(item,dict): continue
              blob=json.dumps(item,separators=(",",":"),sort_keys=True).lower()
              if "agentresolver" not in blob and "agentresolver.vercel.app" not in blob:
                  continue
              rows.append({
                  "id":item.get("_id") or item.get("offerId") or item.get("id"),
                  "title":item.get("title"),
                  "priceUsd":item.get("priceUsd"),
                  "active":item.get("isActive") if "isActive" in item else item.get("active"),
                  "externalUrl":item.get("externalUrl"),
                  "buyUrl":item.get("buyUrl"),
                  "inputSchema":item.get("inputSchema"),
                  "seller":item.get("seller") or item.get("agent"),
              })
          print(json.dumps({"count":len(rows),"offers":rows},separators=(",",":"),sort_keys=True))
          joined=json.dumps(rows,separators=(",",":"),sort_keys=True).lower()
          def code(v):
              return re.sub(r'[^a-z0-9._-]+','-',str(v).lower()).strip("-")[:36] or "none"
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write(f"count={len(rows)}\n")
              out.write(f"has_ping={'true' if 'settlement ping' in joined or '/api/x402-ping' in joined else 'false'}\n")
              out.write(f"has_guard={'true' if 'agentresolver guard' in joined or '/api/payment-guard' in joined else 'false'}\n")
              ids=[r.get("id") for r in rows if r.get("id")]
              out.write(f"ids={code('-'.join(map(str,ids)))}\n")
          PY

      - name: Publish catalog status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          COUNT: ${{ steps.offers.outputs.count }}
          HAS_PING: ${{ steps.offers.outputs.has_ping }}
          HAS_GUARD: ${{ steps.offers.outputs.has_guard }}
        shell: bash
        run: |
          if [ "${COUNT:-0}" -gt 0 ]; then state=success; else state=failure; fi
          export state
          CONTEXT="distribution/payanagent-agentresolver-count-${COUNT:-0}-ping-${HAS_PING:-false}-guard-${HAS_GUARD:-false}"
          export CONTEXT
          python - <<'PY'
          import json,os,urllib.request
          payload={
            "state":os.environ["state"],
            "context":os.environ["CONTEXT"][:100],
            "description":"PayanAgent live AgentResolver offer audit",
            "target_url":"https://payanagent.com/marketplace"
          }
          req=urllib.request.Request(
            f"https://api.github.com/repos/waxsway/agentresolver/statuses/{os.environ['SHA']}",
            data=json.dumps(payload).encode(),
            headers={
              "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
              "Accept":"application/vnd.github+json",
              "Content-Type":"application/json",
              "X-GitHub-Api-Version":"2022-11-28"
            },
            method="POST"
          )
          with urllib.request.urlopen(req,timeout=30) as resp: print(resp.status)
          PY
