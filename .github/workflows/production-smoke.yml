name: Production Smoke

on:
  workflow_run:
    workflows:
      - Deploy Production
    types:
      - completed
  repository_dispatch:
    types:
      - vercel.deployment.success
      - vercel.deployment.promoted
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  verify-production:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify canonical production surfaces
        shell: bash
        env:
          BASE_URL: https://agentresolver.vercel.app
        run: |
          set -euo pipefail

          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/api/health" | tee /tmp/health.json
          grep -F '"ok":true' /tmp/health.json >/dev/null
          grep -F '"version":"0.1.2"' /tmp/health.json >/dev/null

          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/agentresolver.md" | grep -F 'AgentResolver' >/dev/null
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/integrations.json" | grep -F "$BASE_URL/mcp" >/dev/null
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/openapi.json" | grep -F 'resolveCapability' >/dev/null
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/.well-known/ai-plugin.json" | grep -F 'missing' >/dev/null
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/mcp/server-card" | grep -F '0.1.2' >/dev/null

          echo 'Production discovery checks passed.'

      - name: Verify x402 payment challenge without spending
        shell: bash
        env:
          BASE_URL: https://agentresolver.vercel.app
        run: |
          set -euo pipefail

          status="$(curl --retry 5 --retry-delay 2 --retry-all-errors -sS \
            -D /tmp/x402-headers.txt \
            -o /tmp/x402-body.txt \
            -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data '{"target":"https://example.com"}' \
            "$BASE_URL/api/agent-readiness")"

          if [ "$status" != "402" ]; then
            echo "Expected x402 HTTP 402 challenge, got $status"
            cat /tmp/x402-body.txt
            exit 1
          fi

          if ! grep -Eiq '^payment-required:[[:space:]]*[^[:space:]]+' /tmp/x402-headers.txt; then
            echo 'HTTP 402 was returned but PAYMENT-REQUIRED header is missing.'
            sed -n '1,20p' /tmp/x402-headers.txt
            exit 1
          fi

          echo 'x402 challenge verified: HTTP 402 plus PAYMENT-REQUIRED header; no payment was sent.'
