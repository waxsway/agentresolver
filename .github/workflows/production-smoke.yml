name: Production Smoke

on:
  workflow_run:
    workflows:
      - Deploy Production
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify focused production discovery and trust surfaces
        shell: bash
        env:
          BASE_URL: https://agentresolver.vercel.app
        run: |
          set -euo pipefail

          curl --retry 3 --retry-delay 1 --retry-all-errors -fsS "$BASE_URL/api/health" > /tmp/health.json
          grep -F '"version":"0.1.4"' /tmp/health.json >/dev/null
          jq -e '
            .ok == true and
            .paidManifest == "/.well-known/x402" and
            .canonicalPaidRoute == "/api/x402-payment-preflight" and
            .paymentRails.x402PingBase == "payai" and
            .paymentRails.x402PingSolana == "payai"
          ' /tmp/health.json >/dev/null

          reputation_code="$(curl --retry 3 --retry-delay 1 --retry-all-errors -sS             -D /tmp/reputation-headers.txt -o /dev/null -w '%{http_code}'             "$BASE_URL/.well-known/agentresolver-reputation.json")"
          test "$reputation_code" = "307"
          grep -Fi 'location: https://raw.githubusercontent.com/waxsway/agentresolver/evidence-history/evidence/settlements.json'             /tmp/reputation-headers.txt >/dev/null

          curl --retry 3 --retry-delay 1 --retry-all-errors -fsS "$BASE_URL/openapi.json" > /tmp/openapi.json
          jq -e '
            (.paths | keys | length) == 12 and
            (.paths["/api/resolve"].post.security == []) and
            (.paths["/api/health"].get.security == []) and
            (.paths["/api/x402-ping"].get["x-payment-info"].priceUsd == 0.001) and
            (.paths["/api/x402-payment-preflight"].get["x-payment-info"].priceUsd == 0.001) and
            (.paths["/api/payment-guard"].get["x-payment-info"].priceUsd == 0.001) and
            (.paths["/api/verified-resolve"].post["x-payment-info"].priceUsd == 0.02) and
            (.paths["/api/batch-verified-resolve"].post["x-payment-info"].priceUsd == 0.05) and
            (.paths["/api/sha256"] == null) and
            (.paths["/api/mcp-probe"] == null) and
            (.paths["/api/agent-readiness"] == null)
          ' /tmp/openapi.json >/dev/null

          curl --retry 3 --retry-delay 1 --retry-all-errors -fsS "$BASE_URL/integrations.json"             | jq -e '
                ([.paidActions[].id] | sort) ==
                (["batch-verified-resolve","verified-resolve","x402-payment-preflight","x402-ping"] | sort)
              ' >/dev/null

          curl --retry 3 --retry-delay 1 --retry-all-errors -fsS "$BASE_URL/.well-known/x402" > /tmp/x402.json
          jq -e '
            ([.services[].id] | index("x402-ping") != null) and
            ([.services[].id] | index("x402-payment-preflight") != null) and
            ([.services[].id] | index("verified-resolve") != null) and
            ([.services[].id] | index("batch-verified-resolve") != null)
          ' /tmp/x402.json >/dev/null

          curl --retry 3 --retry-delay 1 --retry-all-errors -fsS             -H 'x-agentresolver-internal: 1' "$BASE_URL/mcp/server-card" > /tmp/server-card.json
          jq -e '
            .name == "io.github.waxsway/agentresolver" and
            (.title | contains("AgentResolver Guard")) and
            (.remotes[0].url == "https://agentresolver.vercel.app/mcp")
          ' /tmp/server-card.json >/dev/null

          echo 'Focused production discovery and trust surfaces passed.'

      - name: Verify settlement canary and Guard challenges without spending
        shell: bash
        env:
          BASE_URL: https://agentresolver.vercel.app
        run: |
          set -euo pipefail

          canary_status="$(curl --retry 3 --retry-delay 1 --retry-all-errors -sS             -D /tmp/x402-ping-headers.txt             -o /tmp/x402-ping-body.json             -w '%{http_code}'             -H 'x-agentresolver-internal: 1'             "$BASE_URL/api/x402-ping")"
          test "$canary_status" = "402"

          settlement_ping_required="$(awk 'BEGIN{IGNORECASE=1} /^payment-required:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/x402-ping-headers.txt)"
          PAYMENT_REQUIRED="$settlement_ping_required" python3 - <<'PY'
          import base64
          import json
          import os

          raw = os.environ["PAYMENT_REQUIRED"].strip()
          assert raw, "x402-ping PAYMENT-REQUIRED header missing"
          raw += "=" * (-len(raw) % 4)
          payload = json.loads(base64.urlsafe_b64decode(raw).decode("utf-8"))
          assert payload.get("x402Version") == 2
          resource = payload.get("resource") or {}
          assert resource.get("url") == "https://agentresolver.vercel.app/api/x402-ping"
          accepts = payload.get("accepts") or []

          base = next((item for item in accepts if item.get("network") == "eip155:8453"), None)
          assert base is not None, "Base exact payment option missing"
          assert base.get("scheme") == "exact"
          assert str(base.get("amount")) == "1000"
          assert base.get("asset") == "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
          assert base.get("payTo") == "0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8"

          solana = next((item for item in accepts if item.get("network") == "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp"), None)
          assert solana is not None, "Solana exact payment option missing"
          assert solana.get("scheme") == "exact"
          assert str(solana.get("amount")) == "1000"
          assert solana.get("asset") == "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
          assert solana.get("payTo") == "AoQNzm7dB7dhBXfgq9ywqkfkS68fg2e1JwcxrgXnkLXa"
          fee_payer = (solana.get("extra") or {}).get("feePayer")
          assert isinstance(fee_payer, str) and fee_payer.strip(), "Solana feePayer missing"
          PY

          guard_status="$(curl --retry 3 --retry-delay 1 --retry-all-errors -sS             -D /tmp/guard-headers.txt             -o /tmp/guard-body.json             -w '%{http_code}'             -H 'x-agentresolver-internal: 1'             "$BASE_URL/api/payment-guard?url=https%3A%2F%2Fagentresolver.vercel.app%2Fapi%2Fx402-ping&method=GET&maxPriceUsd=0.01&expectedNetwork=eip155%3A8453")"
          test "$guard_status" = "402"
          grep -Eiq '^payment-required:[[:space:]]*[^[:space:]]+' /tmp/guard-headers.txt

          preflight_status="$(curl --retry 3 --retry-delay 1 --retry-all-errors -sS             -D /tmp/preflight-headers.txt             -o /tmp/preflight-body.json             -w '%{http_code}'             -H 'x-agentresolver-internal: 1'             "$BASE_URL/api/x402-payment-preflight?url=https%3A%2F%2Fagentresolver.vercel.app%2Fapi%2Fx402-ping&method=GET&maxPriceUsd=0.01&expectedNetwork=eip155%3A8453")"
          test "$preflight_status" = "402"
          grep -Eiq '^payment-required:[[:space:]]*[^[:space:]]+' /tmp/preflight-headers.txt

          check_post_challenge() {
            local path="$1"
            local body="$2"
            local amount="$3"
            local slug="$4"
            local status
            status="$(curl --retry 3 --retry-delay 1 --retry-all-errors -sS               -D "/tmp/$slug-headers.txt"               -o "/tmp/$slug-body.json"               -w '%{http_code}'               -H 'content-type: application/json'               -H 'x-agentresolver-internal: 1'               --data "$body"               "$BASE_URL$path")"
            test "$status" = "402"
            grep -Eiq '^payment-required:[[:space:]]*[^[:space:]]+' "/tmp/$slug-headers.txt"
            PAYMENT_REQUIRED="$(awk 'BEGIN{IGNORECASE=1} /^payment-required:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "/tmp/$slug-headers.txt")"               EXPECTED_AMOUNT="$amount" python3 - <<'PY'
          import base64
          import json
          import os

          raw = os.environ["PAYMENT_REQUIRED"].strip()
          assert raw
          raw += "=" * (-len(raw) % 4)
          payload = json.loads(base64.urlsafe_b64decode(raw).decode("utf-8"))
          expected = os.environ["EXPECTED_AMOUNT"]
          assert any(str(item.get("amount")) == expected for item in (payload.get("accepts") or []))
          PY
          }

          check_post_challenge "/api/verified-resolve"             '{"goal":"find and verify an MCP server for search"}' "20000" "verified"
          check_post_challenge "/api/batch-verified-resolve"             '{"items":[{"goal":"find a search MCP"},{"goal":"find a browser MCP"}]}' "50000" "batch"

          echo 'Revenue-path x402 challenges passed without signing or spending.'

      - name: Verify free resolver still sends payment-safety intent to Guard
        shell: bash
        env:
          BASE_URL: https://agentresolver.vercel.app
        run: |
          set -euo pipefail

          curl --retry 3 --retry-delay 1 --retry-all-errors -fsS             -H 'content-type: application/json'             -H 'x-agentresolver-internal: 1'             --data '{"goal":"verify this x402 payment endpoint before paying","url":"https://agentresolver.vercel.app/api/x402-ping","limit":3}'             "$BASE_URL/api/resolve" > /tmp/resolve.json

          jq -e '
            .owned[0].id == "x402-payment-preflight" and
            .owned[0].priceUsd == 0.001 and
            .recommendedPaidAction.capabilityId == "x402-payment-preflight" and
            .recommendedPaidAction.priceUsd == 0.001
          ' /tmp/resolve.json >/dev/null

          echo 'Free resolver -> Guard handoff passed.'
