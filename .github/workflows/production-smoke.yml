name: Production Smoke

on:
  workflow_run:
    workflows:
      - Deploy Production
    types:
      - completed
  repository_dispatch:
    types:
      - vercel.deployment.success
      - vercel.deployment.promoted
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  verify-production:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify canonical production surfaces
        shell: bash
        env:
          BASE_URL: https://agentresolver.vercel.app
        run: |
          set -euo pipefail

          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/api/health" | tee /tmp/health.json
          grep -F '"ok":true' /tmp/health.json >/dev/null
          grep -F '"version":"0.1.3"' /tmp/health.json >/dev/null
          grep -F '"paidManifest":"/.well-known/x402"' /tmp/health.json >/dev/null

          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/agentresolver.md" | grep -F 'AgentResolver' >/dev/null
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/integrations.json" | grep -F "$BASE_URL/mcp" >/dev/null
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/openapi.json" | grep -F 'resolveCapability' >/dev/null
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/openapi.json" | grep -F 'probeMcpEndpoint' >/dev/null
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/capabilities.json" | grep -F 'verified-resolve' >/dev/null
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/.well-known/x402-catalog.json" | grep -F 'batch-verified-resolve' >/dev/null
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/.well-known/x402" | grep -F 'mcp-probe' >/dev/null
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/.well-known/ai-plugin.json" | grep -F 'missing' >/dev/null
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/mcp/server-card" | grep -F '0.1.3' >/dev/null

          resolve_check() {
            local slug="$1" goal="$2" url="$3" expected_id="$4" expected_price="$5"
            local body
            if [ -n "$url" ]; then
              body=$(jq -n --arg goal "$goal" --arg url "$url" '{goal:$goal,url:$url,limit:3}')
            else
              body=$(jq -n --arg goal "$goal" '{goal:$goal,limit:3}')
            fi
            curl --retry 5 --retry-delay 2 --retry-all-errors -fsS \
              -H 'content-type: application/json' \
              --data "$body" \
              "$BASE_URL/api/resolve" > "/tmp/$slug.json"
            jq -e --arg id "$expected_id" --argjson price "$expected_price" '
              .owned[0].id == $id and
              .owned[0].priceUsd == $price and
              .recommendedPaidAction.capabilityId == $id and
              .recommendedPaidAction.priceUsd == $price
            ' "/tmp/$slug.json" >/dev/null
          }

          resolve_check 'resolve-http-inspect' \
            'inspect this HTTPS URL for status latency cache headers and security headers' \
            'https://example.com' 'http-inspect' 0.001
          resolve_check 'resolve-tool-contract' \
            'check tool contract JSON schema workflow compatibility mapping' \
            '' 'tool-contract' 0.005
          resolve_check 'resolve-openapi-select' \
            'select the best OpenAPI operation endpoint for this API goal' \
            "$BASE_URL/openapi.json" 'openapi-select' 0.005

          echo 'Production discovery checks passed.'

      - name: Verify x402 payment challenges without spending
        shell: bash
        env:
          BASE_URL: https://agentresolver.vercel.app
        run: |
          set -euo pipefail

          check_402() {
            local name="$1"
            local path="$2"
            local body="$3"
            local slug="$4"
            local expected_amount="$5"

            status="$(curl --retry 5 --retry-delay 2 --retry-all-errors -sS \
              -D "/tmp/${slug}-headers.txt" \
              -o "/tmp/${slug}-body.txt" \
              -w '%{http_code}' \
              -H 'content-type: application/json' \
              --data "$body" \
              "$BASE_URL$path")"

            if [ "$status" != "402" ]; then
              echo "Expected $name x402 HTTP 402 challenge, got $status"
              cat "/tmp/${slug}-body.txt"
              exit 1
            fi

            if ! grep -Eiq '^payment-required:[[:space:]]*[^[:space:]]+' "/tmp/${slug}-headers.txt"; then
              echo "$name returned HTTP 402 but PAYMENT-REQUIRED header is missing."
              sed -n '1,20p' "/tmp/${slug}-headers.txt"
              exit 1
            fi

            get_status="$(curl --retry 5 --retry-delay 2 --retry-all-errors -sS -o "/tmp/${slug}-get.json" -w '%{http_code}' "$BASE_URL$path")"
            if [ "$get_status" != "402" ]; then
              echo "Expected $name GET discovery probe to receive 402, got $get_status"
              exit 1
            fi
            jq -e --arg amount "$expected_amount" '
              .accepts[0].amount == $amount and
              .accepts[0].maxAmountRequired == $amount
            ' "/tmp/${slug}-get.json" >/dev/null
          }

          check_402 'HTTP Inspect' '/api/http-inspect' '{"url":"https://example.com"}' 'http-inspect' '1000'

          payment_required=$(awk 'BEGIN{IGNORECASE=1} /^payment-required:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/http-inspect-headers.txt)
          PAYMENT_REQUIRED="$payment_required" python3 - <<'PY'
          import base64
          import json
          import os

          raw = os.environ["PAYMENT_REQUIRED"].strip()
          raw += "=" * (-len(raw) % 4)
          payload = json.loads(base64.urlsafe_b64decode(raw).decode("utf-8"))
          bazaar = (payload.get("extensions") or {}).get("bazaar")
          assert bazaar, "HTTP Inspect payment challenge is missing extensions.bazaar"
          info = bazaar.get("info") or {}
          input_info = info.get("input") or {}
          assert input_info.get("method") == "POST", "Bazaar input method was not enriched to POST"
          PY

          check_402 'Tool Contract Fit' '/api/tool-contract' '{"producerOutputSchema":{"type":"object"},"consumerInputSchema":{"type":"object"}}' 'tool-contract' '5000'
          check_402 'OpenAPI Operation Select' '/api/openapi-select' '{"specUrl":"https://agentresolver.vercel.app/openapi.json","goal":"select the resolve operation"}' 'openapi-select' '5000'
          check_402 'Verified Resolve' '/api/verified-resolve' '{"goal":"find and verify an MCP server for search"}' 'verified-resolve' '20000'
          check_402 'Agent Readiness Audit' '/api/agent-readiness' '{"url":"https://example.com"}' 'readiness' '5000'
          check_402 'MCP Live Preflight' '/api/mcp-probe' '{"endpoint":"https://agentresolver.vercel.app/mcp"}' 'mcp-probe' '1000'
          check_402 'Batch Verified Resolve' '/api/batch-verified-resolve' '{"items":[{"goal":"find a search MCP"},{"goal":"find a browser MCP"}]}' 'batch-verified-resolve' '50000'

          echo 'All POST and GET x402 challenges verified without sending payment.'

      - name: Verify direct paid MCP challenge without spending
        shell: bash
        env:
          MCP_URL: https://agentresolver.vercel.app/mcp
        run: |
          set -euo pipefail

          resolve_request='{"jsonrpc":"2.0","id":90,"method":"tools/call","params":{"name":"resolve","arguments":{"goal":"inspect this HTTPS URL for status latency cache headers and security headers","url":"https://example.com","limit":3}}}'
          resolve_code=$(curl --retry 5 --retry-delay 2 --retry-all-errors -sS \
            -o /tmp/mcp-resolve.out \
            -w '%{http_code}' \
            -X POST "$MCP_URL" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'user-agent: AgentResolver-Direct-Paid-MCP-Smoke/1.0' \
            --data "$resolve_request")

          test "$resolve_code" -ge 200 && test "$resolve_code" -lt 300
          grep -F 'recommendedPaidAction' /tmp/mcp-resolve.out >/dev/null
          grep -F 'http_inspect' /tmp/mcp-resolve.out >/dev/null
          grep -F '"surface":"mcp"' /tmp/mcp-resolve.out >/dev/null || grep -F '\\"surface\\":\\"mcp\\"' /tmp/mcp-resolve.out >/dev/null

                    request='{"jsonrpc":"2.0","id":91,"method":"tools/call","params":{"name":"http_inspect","arguments":{"url":"https://example.com"}}}'
          code=$(curl --retry 5 --retry-delay 2 --retry-all-errors -sS             -o /tmp/mcp-paid.out             -w '%{http_code}'             -X POST "$MCP_URL"             -H 'content-type: application/json'             -H 'accept: application/json, text/event-stream'             -H 'user-agent: AgentResolver-Direct-Paid-MCP-Smoke/1.0'             --data "$request")

          test "$code" -ge 200 && test "$code" -lt 300

          if ! grep -F 'x402Version' /tmp/mcp-paid.out >/dev/null; then
            echo 'Unpaid http_inspect MCP call did not return an x402 payment challenge.'
            cat /tmp/mcp-paid.out
            exit 1
          fi
          if ! grep -F '1000' /tmp/mcp-paid.out >/dev/null; then
            echo 'Unpaid http_inspect MCP challenge did not advertise the expected $0.001 atomic amount.'
            cat /tmp/mcp-paid.out
            exit 1
          fi
          if grep -F 'latencyMs' /tmp/mcp-paid.out >/dev/null; then
            echo 'SECURITY FAILURE: unpaid MCP call exposed HTTP inspection output before settlement.'
            cat /tmp/mcp-paid.out
            exit 1
          fi

          echo 'Direct paid HTTP Inspect MCP challenge verified without signing or spending.'

          openapi_resolve='{"jsonrpc":"2.0","id":92,"method":"tools/call","params":{"name":"resolve","arguments":{"goal":"select the best OpenAPI operation endpoint for this API goal","url":"https://agentresolver.vercel.app/openapi.json","limit":3}}}'
          openapi_resolve_code=$(curl --retry 5 --retry-delay 2 --retry-all-errors -sS \
            -o /tmp/mcp-openapi-resolve.out \
            -w '%{http_code}' \
            -X POST "$MCP_URL" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'user-agent: AgentResolver-Direct-Paid-MCP-Smoke/1.0' \
            --data "$openapi_resolve")
          test "$openapi_resolve_code" -ge 200 && test "$openapi_resolve_code" -lt 300
          grep -F 'openapi_select' /tmp/mcp-openapi-resolve.out >/dev/null
          grep -F '"surface":"mcp"' /tmp/mcp-openapi-resolve.out >/dev/null || grep -F '\\"surface\\":\\"mcp\\"' /tmp/mcp-openapi-resolve.out >/dev/null

          openapi_request='{"jsonrpc":"2.0","id":93,"method":"tools/call","params":{"name":"openapi_select","arguments":{"specUrl":"https://agentresolver.vercel.app/openapi.json","goal":"select the resolve operation"}}}'
          openapi_code=$(curl --retry 5 --retry-delay 2 --retry-all-errors -sS \
            -o /tmp/mcp-openapi-paid.out \
            -w '%{http_code}' \
            -X POST "$MCP_URL" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'user-agent: AgentResolver-Direct-Paid-MCP-Smoke/1.0' \
            --data "$openapi_request")
          test "$openapi_code" -ge 200 && test "$openapi_code" -lt 300
          grep -F 'x402Version' /tmp/mcp-openapi-paid.out >/dev/null
          grep -F '5000' /tmp/mcp-openapi-paid.out >/dev/null
          if grep -F 'operationCount' /tmp/mcp-openapi-paid.out >/dev/null; then
            echo 'SECURITY FAILURE: unpaid OpenAPI Select MCP call exposed paid output before settlement.'
            cat /tmp/mcp-openapi-paid.out
            exit 1
          fi

          verified_request='{"jsonrpc":"2.0","id":94,"method":"tools/call","params":{"name":"verified_resolve","arguments":{"goal":"find and verify an MCP server for web search"}}}'
          verified_code=$(curl --retry 5 --retry-delay 2 --retry-all-errors -sS \
            -o /tmp/mcp-verified-paid.out \
            -w '%{http_code}' \
            -X POST "$MCP_URL" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'user-agent: AgentResolver-Direct-Paid-MCP-Smoke/1.0' \
            --data "$verified_request")
          test "$verified_code" -ge 200 && test "$verified_code" -lt 300
          grep -F 'x402Version' /tmp/mcp-verified-paid.out >/dev/null
          grep -F '20000' /tmp/mcp-verified-paid.out >/dev/null
          if grep -F 'liveVerification' /tmp/mcp-verified-paid.out >/dev/null; then
            echo 'SECURITY FAILURE: unpaid Verified Resolve MCP call exposed paid output before settlement.'
            cat /tmp/mcp-verified-paid.out
            exit 1
          fi

          check_unpaid_mcp_tool() {
            local id="$1"
            local name="$2"
            local amount="$3"
            local forbidden="$4"
            local arguments="$5"
            local output="/tmp/mcp-direct-${name}.out"
            local request
            request=$(jq -cn --argjson id "$id" --arg name "$name" --argjson arguments "$arguments"               '{jsonrpc:"2.0",id:$id,method:"tools/call",params:{name:$name,arguments:$arguments}}')
            local code
            code=$(curl --retry 5 --retry-delay 2 --retry-all-errors -sS               -o "$output"               -w '%{http_code}'               -X POST "$MCP_URL"               -H 'content-type: application/json'               -H 'accept: application/json, text/event-stream'               -H 'user-agent: AgentResolver-Direct-Paid-MCP-Smoke/1.0'               --data "$request")
            test "$code" -ge 200 && test "$code" -lt 300
            grep -F 'x402Version' "$output" >/dev/null
            grep -F "$amount" "$output" >/dev/null
            if grep -F "$forbidden" "$output" >/dev/null; then
              echo "SECURITY FAILURE: unpaid $name MCP call exposed paid output before settlement."
              cat "$output"
              exit 1
            fi
          }

          check_unpaid_mcp_tool 95 'tool_contract' '5000' 'directMatches' '{"producerOutputSchema":{"type":"object","properties":{"id":{"type":"string"}}},"consumerInputSchema":{"type":"object","properties":{"id":{"type":"string"}},"required":["id"]}}'
          check_unpaid_mcp_tool 96 'mcp_preflight' '1000' 'mcpCompatible' '{"endpoint":"https://agentresolver.vercel.app/mcp"}'
          check_unpaid_mcp_tool 97 'agent_readiness' '5000' 'recommendations' '{"url":"https://example.com"}'
          check_unpaid_mcp_tool 98 'batch_verified_resolve' '50000' 'durationMs' '{"items":[{"goal":"find a search MCP"},{"goal":"find a browser MCP"}]}'

          echo 'All directly payable MCP tools return local challenges without signing, spending, or paid execution egress.'
