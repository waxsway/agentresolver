name: One-off true402 Verified Resolve registration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  register:
    if: github.head_ref == 'distribution/register-qualified-x402-directories-20260920'
    runs-on: ubuntu-latest
    steps:
      - name: Register Verified Resolve as its own true402 service
        shell: bash
        run: |
          set -euo pipefail
          payload='{"url":"https://agentresolver.vercel.app/api/verified-resolve","manifest":{"x402":"1.0","name":"AgentResolver Verified Resolve","description":"Provider-neutral fail-closed verification for unfamiliar MCP and x402 capabilities before agent execution or payment.","capabilities":["ai-agents","mcp","capability-verification","x402","trust"],"pricing":{"currency":"USDC","base":"0.02","unit":"request"},"payment":{"address":"0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8","chain":"base","facilitator":"https://facilitator.payai.network"},"endpoint":"https://agentresolver.vercel.app/api/verified-resolve"}}'
          status="$(curl -sS -o /tmp/true402-verified-resolve.json -w '%{http_code}' -X POST 'https://true402.dev/api/v1/services' -H 'content-type: application/json' --data "$payload")"
          echo "true402_verified_resolve_http_status=$status"
          cat /tmp/true402-verified-resolve.json
          echo
          case "$status" in
            200|201|202|409) ;;
            *) exit 1 ;;
          esac
