name: PayAI Bazaar Read-Only Probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/payai-bazaar-readonly.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Query PayAI public Bazaar catalog
        shell: bash
        run: |
          set -euo pipefail
          base='https://facilitator.payai.network/discovery/resources'
          payto='0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8'
          body="$(mktemp)"
          code="$(curl -sS --connect-timeout 10 --max-time 30 -o "$body" -w '%{http_code}' --get "$base" \
            --data-urlencode 'type=http' \
            --data-urlencode 'limit=100' \
            --data-urlencode "payTo=$payto" || printf '000')"
          echo "PayAI Bazaar -> HTTP $code"
          test "$code" = "200"
          python3 - "$body" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],"r",encoding="utf-8"))
          rows=data.get("items") or data.get("resources") or data.get("data") or []
          matches=[]
          for row in rows if isinstance(rows,list) else []:
              blob=json.dumps(row,separators=(",",":")).lower()
              if "agentresolver.vercel.app" in blob:
                  matches.append({
                      "resource":row.get("resource"),
                      "type":row.get("type"),
                      "x402Version":row.get("x402Version"),
                      "lastUpdated":row.get("lastUpdated"),
                      "serviceName":row.get("serviceName"),
                      "tags":row.get("tags"),
                      "accepts":row.get("accepts"),
                      "extensionKeys":sorted((row.get("extensions") or {}).keys())
                  })
          print(json.dumps({
              "returnedRows": len(rows) if isinstance(rows,list) else None,
              "agentresolverMatches":matches
          },separators=(",",":")))
          PY
