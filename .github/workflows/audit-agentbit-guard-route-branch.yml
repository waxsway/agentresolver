name: Audit AgentBIT Guard Route

on:
  push:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-slim
    timeout-minutes: 4
    steps:
      - name: Free AgentBIT route lookup
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS --connect-timeout 5 --max-time 30             -o "$body" -w '%{http_code}'             --get 'https://agentbit.app/api/route'             --data-urlencode 'q=verify x402 payment before paying' || printf '000')"
          echo "HTTP $code"
          cat "$body"
          echo
          test "$code" = "200"
          python3 - "$body" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],"r",encoding="utf-8"))
          blob=json.dumps(data,separators=(",",":"),sort_keys=True).lower()
          print("AGENTRESOLVER_PRESENT="+str("agentresolver.vercel.app" in blob).lower())
          print("GUARD_PRESENT="+str("payment-guard" in blob).lower())
          PY
