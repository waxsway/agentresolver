name: Publish Verified Settlement History

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-settlement-history.yml"
      - "scripts/extract-settlement-log-events.mjs"
      - "scripts/merge-settlement-history.mjs"

permissions:
  contents: write

concurrency:
  group: settlement-history-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERCEL_ORG_ID: team_ciQJak0lFZjXNgqry88ZDIKN
      VERCEL_PROJECT_ID: prj_uJKVWBawxKkEjIWV5EQkbkQPIABD
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout publisher code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Verify on-chain collector invariants
        run: node scripts/merge-settlement-history.mjs --self-test

      - name: Require Vercel read credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.6.2 --no-audit --no-fund

      - name: Link read-only project context
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Read recent confirmed-settlement logs
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/agentresolver-settlement-logs.raw.jsonl
          : > /tmp/agentresolver-settlement-logs.jsonl
          vercel logs \
            --environment production \
            --query 'paid_capability_settled' \
            --since 3h \
            --json \
            --token="$VERCEL_TOKEN" \
            > /tmp/agentresolver-settlement-logs.raw.jsonl
          echo "raw_matched_log_lines=$(wc -l < /tmp/agentresolver-settlement-logs.raw.jsonl | tr -d ' ')"
          node scripts/extract-settlement-log-events.mjs \
            --input /tmp/agentresolver-settlement-logs.raw.jsonl \
            --output /tmp/agentresolver-settlement-logs.jsonl
          echo "settlement_event_lines=$(wc -l < /tmp/agentresolver-settlement-logs.jsonl | tr -d ' ')"

      - name: Prepare public evidence branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin evidence-history
          rm -rf /tmp/agentresolver-evidence-history
          git worktree add -B evidence-history /tmp/agentresolver-evidence-history origin/evidence-history

      - name: Independently verify and merge settlement evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/merge-settlement-history.mjs \
            --history /tmp/agentresolver-evidence-history/evidence/settlements.json \
            --logs /tmp/agentresolver-settlement-logs.jsonl \
            --output /tmp/agentresolver-evidence-history/evidence/settlements.json

      - name: Publish only when evidence changed
        shell: bash
        working-directory: /tmp/agentresolver-evidence-history
        run: |
          set -euo pipefail
          if git diff --quiet -- evidence/settlements.json; then
            echo "No new confirmed settlement evidence."
            exit 0
          fi

          git config user.name "agentresolver-evidence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/settlements.json
          git commit -m "evidence: publish independently verified x402 settlement history"
          git push origin HEAD:evidence-history
