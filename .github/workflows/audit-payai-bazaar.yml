name: Audit PayAI Bazaar

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-payai-bazaar.yml"
      - "src/lib/createDeterministicPaidRoute.ts"
      - "src/lib/x402Config.ts"
      - "src/lib/x402DiscoveryChallenge.ts"
      - "src/lib/x402PingDiscovery.ts"
      - "src/lib/x402PreflightDiscovery.ts"
      - "src/app/api/x402-ping/**"
      - "src/app/api/x402-payment-preflight/**"
      - "public/openapi.json"
      - "public/capabilities.json"
      - "public/integrations.json"
      - "public/.well-known/x402"
      - "public/.well-known/x402-catalog.json"
      - "public/.well-known/x402-service.json"

concurrency:
  group: audit-payai-bazaar
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Page PayAI Bazaar and locate AgentResolver
        id: bazaar
        env:
          CATALOG_URL: "https://facilitator.payai.network/discovery/resources"
          AGENTRESOLVER_ORIGIN: "https://agentresolver.vercel.app"
          BASE_PAY_TO: "0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8"
          SOLANA_PAY_TO: "AoQNzm7dB7dhBXfgq9ywqkfkS68fg2e1JwcxrgXnkLXa"
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          catalog_url = os.environ["CATALOG_URL"]
          origin = os.environ["AGENTRESOLVER_ORIGIN"].lower()
          pay_tos = [
              os.environ["BASE_PAY_TO"],
              os.environ["SOLANA_PAY_TO"],
          ]
          limit = 100
          matches_by_resource = {}
          query_totals = {}
          max_last_updated = None
          catalog_requests = 0

          def fetch_page(pay_to: str, page_offset: int):
              url = f"{catalog_url}?{urllib.parse.urlencode({'payTo': pay_to, 'limit': limit, 'offset': page_offset})}"
              last_error = None
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={"user-agent": "AgentResolver-Bazaar-Audit/1.0"},
                      )
                      with urllib.request.urlopen(request, timeout=20) as response:
                          return json.loads(response.read().decode("utf-8"))
                  except Exception as exc:
                      last_error = exc
                      if attempt < 2:
                          time.sleep(1 + attempt)
              raise RuntimeError(
                  f"PayAI discovery fetch failed for payTo={pay_to} offset={page_offset}: {last_error}"
              )

          for pay_to in pay_tos:
              offset = 0
              total = None
              while total is None or offset < total:
                  page = fetch_page(pay_to, offset)
                  catalog_requests += 1
                  items = page.get("items") or page.get("resources") or []
                  pagination = page.get("pagination") or {}
                  if total is None:
                      raw_total = pagination.get("total")
                      total = (
                          int(raw_total)
                          if isinstance(raw_total, (int, float, str)) and str(raw_total).isdigit()
                          else len(items)
                      )
                      query_totals[pay_to] = total

                  for item in items:
                      if not isinstance(item, dict):
                          continue
                      raw = json.dumps(item, separators=(",", ":"), sort_keys=True).lower()
                      if origin not in raw and pay_to.lower() not in raw:
                          continue
                      resource = item.get("resource")
                      dedupe_key = resource if isinstance(resource, str) else raw
                      matches_by_resource[dedupe_key] = item
                      candidate = item.get("lastUpdated") or item.get("last_updated")
                      if isinstance(candidate, str) and (
                          max_last_updated is None or candidate > max_last_updated
                      ):
                          max_last_updated = candidate

                  if not items:
                      break
                  offset += len(items)
                  if len(items) < limit:
                      break

          matches = list(matches_by_resource.values())
          match_blob = json.dumps(matches, separators=(",", ":"), sort_keys=True).lower()
          preflight_catalogued = "/api/x402-payment-preflight" in match_blob
          guard_catalogued = "/api/payment-guard" in match_blob

          settlement_stats = []
          for item in matches:
              resource = item.get("resource") if isinstance(item, dict) else None
              if not isinstance(resource, str) or not resource.startswith("https://"):
                  continue
              encoded_resource = urllib.parse.quote(resource, safe="")
              stats_url = f"{catalog_url}/{encoded_resource}/stats"
              try:
                  request = urllib.request.Request(
                      stats_url,
                      headers={"user-agent": "AgentResolver-Bazaar-Audit/1.0"},
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      stats = json.loads(response.read().decode("utf-8"))
                  settlement_stats.append({
                      "resource": resource,
                      "statsUrl": stats_url,
                      "stats": stats,
                  })
              except Exception as exc:
                  settlement_stats.append({
                      "resource": resource,
                      "statsUrl": stats_url,
                      "error": str(exc),
                  })

          summary = {
              "catalogued": bool(matches),
              "queryTotalsByPayTo": query_totals,
              "catalogRequests": catalog_requests,
              "maxLastUpdated": max_last_updated,
              "matchCount": len(matches),
              "matches": matches[:20],
              "settlementStats": settlement_stats,
          }
          print(json.dumps(summary, indent=2, sort_keys=True))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("# PayAI Bazaar audit\n\n")
              fh.write(f"- Catalogued: **{str(bool(matches)).lower()}**\n")
              fh.write(f"- PayTo query totals: **{json.dumps(query_totals, sort_keys=True)}**\n")
              fh.write(f"- Catalog requests: **{catalog_requests}**\n")
              fh.write(f"- Newest `lastUpdated` observed: **{max_last_updated or 'unknown'}**\n")
              fh.write(f"- Matching records: **{len(matches)}**\n")
              fh.write(f"- Settlement-stat records checked: **{len(settlement_stats)}**\n")
              if settlement_stats:
                  fh.write("\n## Resource settlement stats\n\n")
                  fh.write("~~~json\n")
                  fh.write(json.dumps(settlement_stats, indent=2, sort_keys=True)[:12000])
                  fh.write("\n~~~\n")
              if matches:
                  fh.write("\n```json\n")
                  fh.write(json.dumps(matches[:5], indent=2, sort_keys=True)[:12000])
                  fh.write("\n```\n")
              else:
                  fh.write("\n> AgentResolver was not found by canonical origin or either configured payout address. This is a distribution-state warning, not a deployment failure.\n")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"catalogued={'true' if bool(matches) else 'false'}\n")
              out.write(f"preflight_catalogued={'true' if preflight_catalogued else 'false'}\n")
              out.write(f"guard_catalogued={'true' if guard_catalogued else 'false'}\n")

          if not matches:
              print("::warning::AgentResolver is not present in the PayAI Bazaar catalog by origin or configured payout address.")
          if not preflight_catalogued:
              print("::warning::Canonical Payment Preflight is not present in the PayAI Bazaar matches.")
          PY

      - name: Diagnose canonical Preflight listing status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RESOURCE: https://agentresolver.vercel.app/api/x402-payment-preflight
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error

          resource = os.environ["RESOURCE"]
          url = "https://facilitator.payai.network/discovery/listing-status?" + urllib.parse.urlencode({"resource": resource})
          state = "failure"
          desc = "Preflight listing status unavailable"
          detail_code = "unknown"
          try:
              req = urllib.request.Request(url, headers={"user-agent":"AgentResolver-Bazaar-Audit/1.0"})
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
              listed = bool(data.get("listed"))
              hidden = bool(data.get("hidden"))
              last_write = data.get("lastWrite") or {}
              reason = last_write.get("reason") or last_write.get("status") or "none"
              state = "success" if listed and not hidden else "failure"
              safe_reason = "".join(ch if ch.isalnum() or ch in "-_" else "-" for ch in str(reason).lower()).strip("-")[:60] or "none"
              detail_code = "listed" if listed and not hidden else (f"hidden-{safe_reason}" if hidden else f"unlisted-{safe_reason}")
              desc = f"listed={str(listed).lower()} hidden={str(hidden).lower()} reason={reason}"[:140]
              print(json.dumps(data, indent=2, sort_keys=True))
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", "replace")[:1200]
              desc = f"listing-status HTTP {exc.code}"[:140]
              detail_code = f"http-{exc.code}"
              print(body)
          except Exception as exc:
              desc = f"listing-status error: {type(exc).__name__}"[:140]
              detail_code = "error-" + type(exc).__name__.lower()
              print(repr(exc))

          status_url = f"https://api.github.com/repos/waxsway/agentresolver/statuses/{os.environ['SHA']}"
          payload = {
              "state": state,
              "context": f"distribution/payai-bazaar-preflight-detail/{detail_code}"[:100],
              "description": desc,
              "target_url": url,
          }
          req = urllib.request.Request(
              status_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print(resp.status, resp.read().decode("utf-8", "replace")[:500])
          PY

      - name: Publish canonical Preflight catalog status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          PREFLIGHT_CATALOGUED: ${{ steps.bazaar.outputs.preflight_catalogued }}
        shell: bash
        run: |
          if [ "$PREFLIGHT_CATALOGUED" = "true" ]; then
            STATE=success
            DESC="Payment Preflight is catalogued in PayAI Bazaar"
          else
            STATE=failure
            DESC="Payment Preflight not found in PayAI Bazaar"
          fi
          export STATE DESC
          python3 - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/waxsway/agentresolver/statuses/{os.environ['SHA']}"
          payload = {
              "state": os.environ["STATE"],
              "context": "distribution/payai-bazaar-preflight",
              "description": os.environ["DESC"][:140],
              "target_url": "https://facilitator.payai.network/discovery/resources",
          }
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print(resp.status, resp.read().decode("utf-8", "replace")[:500])
          PY
