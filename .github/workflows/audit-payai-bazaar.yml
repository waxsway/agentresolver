name: Audit PayAI Bazaar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-payai-bazaar.yml"
      - "src/lib/createDeterministicPaidRoute.ts"
      - "src/lib/x402Config.ts"
      - "src/lib/x402DiscoveryChallenge.ts"
      - "src/lib/x402PingDiscovery.ts"
      - "src/lib/x402PreflightDiscovery.ts"
      - "src/app/api/x402-ping/**"
      - "src/app/api/x402-payment-preflight/**"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Page PayAI Bazaar and locate AgentResolver
        env:
          CATALOG_URL: https://facilitator.payai.network/discovery/resources
          AGENTRESOLVER_ORIGIN: https://agentresolver.vercel.app
          BASE_PAY_TO: 0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8
          SOLANA_PAY_TO: AoQNzm7dB7dhBXfgq9ywqkfkS68fg2e1JwcxrgXnkLXa
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          catalog_url = os.environ["CATALOG_URL"]
          origin = os.environ["AGENTRESOLVER_ORIGIN"].lower()
          pay_tos = {
              os.environ["BASE_PAY_TO"].lower(),
              os.environ["SOLANA_PAY_TO"].lower(),
          }
          limit = 1000
          offset = 0
          total = None
          matches = []
          max_last_updated = None
          pages = 0

          def fetch_page(page_offset: int):
              url = f"{catalog_url}?{urllib.parse.urlencode({'limit': limit, 'offset': page_offset})}"
              last_error = None
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={"user-agent": "AgentResolver-Bazaar-Audit/1.0"},
                      )
                      with urllib.request.urlopen(request, timeout=20) as response:
                          return json.loads(response.read().decode("utf-8"))
                  except Exception as exc:
                      last_error = exc
                      if attempt < 2:
                          time.sleep(1 + attempt)
              raise RuntimeError(f"PayAI discovery fetch failed at offset {page_offset}: {last_error}")

          while total is None or offset < total:
              page = fetch_page(offset)
              pages += 1
              items = page.get("items") or page.get("resources") or []
              pagination = page.get("pagination") or {}
              if total is None:
                  raw_total = pagination.get("total")
                  total = int(raw_total) if isinstance(raw_total, (int, float, str)) and str(raw_total).isdigit() else len(items)

              for item in items:
                  raw = json.dumps(item, separators=(",", ":"), sort_keys=True)
                  lowered = raw.lower()
                  if origin in lowered or any(pay_to in lowered for pay_to in pay_tos):
                      matches.append(item)
                  if isinstance(item, dict):
                      candidate = item.get("lastUpdated") or item.get("last_updated")
                      if isinstance(candidate, str) and (max_last_updated is None or candidate > max_last_updated):
                          max_last_updated = candidate

              if not items:
                  break
              offset += len(items)
              if len(items) < limit:
                  break

          summary = {
              "catalogued": bool(matches),
              "catalogTotal": total,
              "pagesScanned": pages,
              "maxLastUpdated": max_last_updated,
              "matchCount": len(matches),
              "matches": matches[:20],
          }
          print(json.dumps(summary, indent=2, sort_keys=True))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("# PayAI Bazaar audit\n\n")
              fh.write(f"- Catalogued: **{str(bool(matches)).lower()}**\n")
              fh.write(f"- Catalog total: **{total}**\n")
              fh.write(f"- Pages scanned: **{pages}**\n")
              fh.write(f"- Newest `lastUpdated` observed: **{max_last_updated or 'unknown'}**\n")
              fh.write(f"- Matching records: **{len(matches)}**\n")
              if matches:
                  fh.write("\n```json\n")
                  fh.write(json.dumps(matches[:5], indent=2, sort_keys=True)[:12000])
                  fh.write("\n```\n")
              else:
                  fh.write("\n> AgentResolver was not found by canonical origin or either configured payout address. This is a distribution-state warning, not a deployment failure.\n")

          if not matches:
              print("::warning::AgentResolver is not present in the PayAI Bazaar catalog by origin or configured payout address.")
          PY
