name: Submit NoHumans Payment Guard

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Production"]
    types: [completed]

permissions:
  contents: read

jobs:
  submit:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PING_URL: https://agentresolver.vercel.app/api/x402-ping
      GUARD_URL: https://agentresolver.vercel.app/api/payment-guard?url=https%3A%2F%2Fagentresolver.vercel.app%2Fapi%2Fx402-ping&method=GET&maxPriceUsd=0.01&expectedNetwork=eip155%3A8453
      PREFLIGHT_URL: https://agentresolver.vercel.app/api/x402-payment-preflight?url=https%3A%2F%2Fagentresolver.vercel.app%2Fapi%2Fx402-ping&method=GET&maxPriceUsd=0.01&expectedNetwork=eip155%3A8453
      SETTLEMENT_VERIFY_URL: https://agentresolver.vercel.app/api/x402-settlement-verify?txHash=0x7729766d8615c6bd052340bddc95019be20afd78c2cd39faa4812775e3227b72&expectedPayTo=0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8&expectedAmountAtomic=1000
      HASH_URL: https://agentresolver.vercel.app/api/hash-encode?operation=sha256&input=agentresolver
    steps:
      - name: Verify proven paid ping without spending
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' "$PING_URL")"
          test "$code" = "402"
          python3 - "$body" <<'PY'
          import json, os, sys
          payload = json.load(open(sys.argv[1], "r", encoding="utf-8"))
          assert payload.get("x402Version") == 2
          assert (payload.get("resource") or {}).get("url") == os.environ["PING_URL"]
          assert ((payload.get("extensions") or {}).get("agentresolver")) is None
          accepts = payload.get("accepts") or []
          assert any(
              item.get("network") == "eip155:8453"
              and str(item.get("amount")) == "1000"
              and item.get("payTo") == "0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8"
              for item in accepts
          )
          PY

      - name: Verify paid Guard example without spending
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          code="$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' "$GUARD_URL")"
          test "$code" = "402"
          python3 - "$body" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], "r", encoding="utf-8"))
          assert payload.get("x402Version") == 2
          accepts = payload.get("accepts") or []
          assert any(
              item.get("network") == "eip155:8453"
              and str(item.get("amount")) == "1000"
              and item.get("payTo") == "0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8"
              for item in accepts
          )
          bazaar = (payload.get("extensions") or {}).get("bazaar") or {}
          output = ((bazaar.get("info") or {}).get("output") or {}).get("example") or {}
          assert (output.get("prepaymentDecision") or {}).get("decision") in ("eligible", "blocked")
          PY

      - name: Verify paid hash utility without spending
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' "$HASH_URL")"
          test "$code" = "402"
          python3 - "$body" <<'PY'
          import json, os, sys
          payload = json.load(open(sys.argv[1], "r", encoding="utf-8"))
          assert payload.get("x402Version") == 2
          assert (payload.get("resource") or {}).get("url") == os.environ["HASH_URL"]
          accepts = payload.get("accepts") or []
          assert any(
              item.get("network") == "eip155:8453"
              and str(item.get("amount")) == "1000"
              and item.get("payTo") == "0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8"
              for item in accepts
          )
          PY

      - name: Verify paid settlement verifier example without spending
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' "$SETTLEMENT_VERIFY_URL")"
          test "$code" = "402"
          python3 - "$body" <<'PY'
          import json, os, sys
          payload = json.load(open(sys.argv[1], "r", encoding="utf-8"))
          assert payload.get("x402Version") == 2
          assert (payload.get("resource") or {}).get("url") == os.environ["SETTLEMENT_VERIFY_URL"]
          accepts = payload.get("accepts") or []
          assert any(
              item.get("network") == "eip155:8453"
              and str(item.get("amount")) == "1000"
              and item.get("payTo") == "0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8"
              for item in accepts
          )
          PY

      - name: Resubmit proven paid ping to NoHumans free verification queue
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          description="0.001 USDC GET-first x402 settlement canary for autonomous agents. This is AgentResolver independently settlement-proven purchase path: discover the standard x402 v2 challenge, authorize with the caller wallet policy, perform the standard signed retry, and receive a timestamped pong after successful settlement."
          payload="$(jq -cn --arg endpoint "$PING_URL" --arg description "$description" '{
            name:"AgentResolver x402 Settlement Test",
            description:$description,
            endpoint_url:$endpoint,
            category:"tools.verification",
            price_amount:0.001,
            price_currency:"USDC",
            chains:["base","solana"]
          }')"
          code="$(curl -sS -o "$body" -w '%{http_code}'             -X POST 'https://nohumans.directory/v1/listings'             -H 'content-type: application/json'             --data "$payload")"

          python3 - "$body" <<'PY'
          import json, sys
          raw = open(sys.argv[1], "r", encoding="utf-8").read()
          payload = json.loads(raw)
          if isinstance(payload, dict) and "claim_token" in payload:
              payload["claim_token"] = "[REDACTED]"
          if isinstance(payload, dict) and isinstance(payload.get("data"), dict) and "claim_token" in payload["data"]:
              payload["data"]["claim_token"] = "[REDACTED]"
          print(json.dumps(payload, separators=(",", ":")))
          PY

          case "$code" in
            200|201|202|409) ;;
            *) echo "NoHumans paid ping submission failed with HTTP $code" >&2; exit 1 ;;
          esac

      - name: Submit Guard to NoHumans free verification queue
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          payload="$(jq -cn --arg endpoint "$GUARD_URL" '{
            name:"AgentResolver Guard — Payment Authorization",
            description:"$0.001 x402 pre-payment authorization gate for autonomous agents. This live GET example verifies a target x402 challenge and returns a fail-closed eligible/blocked decision plus exact payment terms and evidence. Integrators replace the target URL query parameter and run Guard immediately before each autonomous spend.",
            endpoint_url:$endpoint,
            category:"tools.verification",
            price_amount:0.001,
            price_currency:"USDC",
            chains:["base","solana"]
          }')"
          code="$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST 'https://nohumans.directory/v1/listings' \
            -H 'content-type: application/json' \
            --data "$payload")"

          python3 - "$body" <<'PY'
          import json, sys
          raw = open(sys.argv[1], "r", encoding="utf-8").read()
          try:
              payload = json.loads(raw)
          except Exception:
              print(raw)
              raise
          if isinstance(payload, dict) and "claim_token" in payload:
              payload["claim_token"] = "[REDACTED]"
          if isinstance(payload, dict) and isinstance(payload.get("data"), dict) and "claim_token" in payload["data"]:
              payload["data"]["claim_token"] = "[REDACTED]"
          print(json.dumps(payload, separators=(",", ":")))
          PY

          case "$code" in
            200|201|202|409) ;;
            *) echo "NoHumans Guard submission failed with HTTP $code" >&2; exit 1 ;;
          esac

      - name: Submit canonical preflight to NoHumans free verification queue
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          payload="$(jq -cn --arg endpoint "$PREFLIGHT_URL" '{
            name:"AgentResolver x402 Payment Preflight",
            description:"Canonical $0.001 x402 verify-before-pay preflight for autonomous agents. Inspects a live target challenge before the caller independently decides whether to authorize payment.",
            endpoint_url:$endpoint,
            category:"tools.verification",
            price_amount:0.001,
            price_currency:"USDC",
            chains:["base","solana"]
          }')"
          code="$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST 'https://nohumans.directory/v1/listings' \
            -H 'content-type: application/json' \
            --data "$payload")"

          python3 - "$body" <<'PY'
          import json, sys
          raw = open(sys.argv[1], "r", encoding="utf-8").read()
          payload = json.loads(raw)
          if isinstance(payload, dict) and "claim_token" in payload:
              payload["claim_token"] = "[REDACTED]"
          if isinstance(payload, dict) and isinstance(payload.get("data"), dict) and "claim_token" in payload["data"]:
              payload["data"]["claim_token"] = "[REDACTED]"
          print(json.dumps(payload, separators=(",", ":")))
          PY

          case "$code" in
            200|201|202|409) ;;
            *) echo "NoHumans canonical preflight submission failed with HTTP $code" >&2; exit 1 ;;
          esac

      - name: Submit settlement verifier to NoHumans free verification queue
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          payload="$(jq -cn --arg endpoint "$SETTLEMENT_VERIFY_URL" '{
            name:"AgentResolver x402 Settlement Verify — Base USDC Receipt",
            description:"$0.001 GET-first post-payment verification for autonomous agents. Given a Base transaction hash, independently checks the public Base receipt, exact USDC EIP-3009 payment shape, Transfer logs, confirmation depth, and optional expected recipient/amount assertions. Settlement evidence only; not provider identity or fulfillment verification.",
            endpoint_url:$endpoint,
            category:"tools.verification",
            price_amount:0.001,
            price_currency:"USDC",
            chains:["base","solana"]
          }')"
          code="$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST 'https://nohumans.directory/v1/listings' \
            -H 'content-type: application/json' \
            --data "$payload")"

          python3 - "$body" <<'PY'
          import json, sys
          raw = open(sys.argv[1], "r", encoding="utf-8").read()
          payload = json.loads(raw)
          if isinstance(payload, dict) and "claim_token" in payload:
              payload["claim_token"] = "[REDACTED]"
          if isinstance(payload, dict) and isinstance(payload.get("data"), dict) and "claim_token" in payload["data"]:
              payload["data"]["claim_token"] = "[REDACTED]"
          print(json.dumps(payload, separators=(",", ":")))
          PY

          case "$code" in
            200|201|202|409) ;;
            *) echo "NoHumans settlement verifier submission failed with HTTP $code" >&2; exit 1 ;;
          esac

      - name: Submit hash utility to NoHumans free verification queue
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          payload="$(jq -cn --arg endpoint "$HASH_URL" '{
            name:"AgentResolver Hash & Encode — GET Utility",
            description:"$0.001 GET-first SHA-256, SHA-512, Base64 encode/decode, or non-verifying JWT decode for autonomous agents. The listed example performs SHA-256 with no request body; hmac-sha256 stays POST-only so secrets never appear in URLs.",
            endpoint_url:$endpoint,
            category:"data.other",
            price_amount:0.001,
            price_currency:"USDC",
            chains:["base","solana"]
          }')"
          code="$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST 'https://nohumans.directory/v1/listings' \
            -H 'content-type: application/json' \
            --data "$payload")"

          python3 - "$body" <<'PY'
          import json, sys
          raw = open(sys.argv[1], "r", encoding="utf-8").read()
          payload = json.loads(raw)
          if isinstance(payload, dict) and "claim_token" in payload:
              payload["claim_token"] = "[REDACTED]"
          if isinstance(payload, dict) and isinstance(payload.get("data"), dict) and "claim_token" in payload["data"]:
              payload["data"]["claim_token"] = "[REDACTED]"
          print(json.dumps(payload, separators=(",", ":")))
          PY

          case "$code" in
            200|201|202|409) ;;
            *) echo "NoHumans hash utility submission failed with HTTP $code" >&2; exit 1 ;;
          esac

      - name: Check NoHumans discovery visibility
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          curl -fsS -G 'https://nohumans.directory/v1/discover' \
            --data-urlencode 'q=AgentResolver Guard Payment Authorization' \
            -o /tmp/nohumans-guard-discover.json || true
          cat /tmp/nohumans-guard-discover.json 2>/dev/null || true
          echo
          if ! grep -qi 'agentresolver' /tmp/nohumans-guard-discover.json 2>/dev/null; then
            echo "::notice::NoHumans accepted or already knew the Guard listing; public search may refresh on its next indexing cycle."
          fi
          curl -fsS -G 'https://nohumans.directory/v1/discover' \
            --data-urlencode 'q=AgentResolver x402 Settlement Verify Base USDC Receipt' \
            -o /tmp/nohumans-settlement-discover.json || true
          cat /tmp/nohumans-settlement-discover.json 2>/dev/null || true
          echo
          if ! grep -qi 'x402 Settlement Verify' /tmp/nohumans-settlement-discover.json 2>/dev/null; then
            echo "::notice::NoHumans accepted or already knew the settlement verifier; public search may refresh on its next indexing cycle."
          fi
