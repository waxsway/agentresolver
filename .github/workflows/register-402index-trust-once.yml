name: Register 402 Index Trust Preflight

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  register:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Register x402 trust verifier with 402 Index
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST 'https://402index.io/api/v1/register' \
            -H 'content-type: application/json' \
            --data '{
              "url":"https://agentresolver.vercel.app/api/x402-payment-preflight",
              "name":"AgentResolver x402 Payment Preflight PayTo Safety",
              "protocol":"x402",
              "http_method":"POST",
              "probe_body":"{\"url\":\"https://example.com\",\"maxPriceUsd\":0.01,\"expectedNetwork\":\"eip155:8453\"}",
              "description":"Verify an x402 endpoint before paying USDC: live endpoint, payTo recipient, quote price, Base or Solana network, asset, resource binding and x402 payment challenge safety.",
              "price_usd":0.001,
              "payment_asset":"USDC",
              "payment_network":"Solana",
              "category":"security",
              "provider":"AgentResolver"
            }')"
          cat "$body"
          echo
          case "$code" in
            200|201) ;;
            *) echo "::warning::402 Index cannot currently verify the POST trust-preflight route (HTTP $code). The dedicated GET canary remains live and searchable."; exit 0 ;;
          esac

      - name: Verify buyer-search visibility
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://402index.io/api/v1/services?protocol=x402&q=AgentResolver%20x402%20Payment%20Preflight' -o /tmp/search.json
          cat /tmp/search.json
          if ! grep -q 'agentresolver.vercel.app/api/x402-payment-preflight' /tmp/search.json; then
            echo "::notice::POST preflight is not indexed; the GET canary is the canonical 402 Index buyer surface."
          fi
