name: Register 402 Index Trust Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/register-402index-trust-once.yml'

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Register x402 trust verifier with 402 Index
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST 'https://402index.io/api/v1/register' \
            -H 'content-type: application/json' \
            --data '{
              "url":"https://agentresolver.vercel.app/api/http-inspect",
              "name":"AgentResolver x402 API Trust Preflight",
              "protocol":"x402",
              "http_method":"POST",
              "probe_body":"{\"url\":\"https://example.com\",\"maxPriceUsd\":0.01,\"expectedNetwork\":\"eip155:8453\"}",
              "description":"Verify a live x402 payment contract before an agent spends: challenge version, price, payee, network, asset, resource binding, TLS and reachability, with optional caller policy limits.",
              "price_usd":0.001,
              "payment_asset":"USDC",
              "payment_network":"Base",
              "category":"security",
              "provider":"AgentResolver"
            }')"
          cat "$body"
          echo
          case "$code" in
            200|201) ;;
            *) echo "402 Index registration failed with HTTP $code" >&2; exit 1 ;;
          esac
