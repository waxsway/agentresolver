name: Register 402 Index Trust Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/register-402index-trust-once.yml'
      - 'src/lib/paidCapabilities.ts'
      - 'src/lib/httpInspect.ts'
      - 'src/app/api/http-inspect/route.ts'
      - 'public/openapi.json'

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Register x402 trust verifier with 402 Index
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST 'https://402index.io/api/v1/register' \
            -H 'content-type: application/json' \
            --data '{
              "url":"https://agentresolver.vercel.app/api/x402-payment-preflight",
              "name":"AgentResolver x402 Payment Preflight PayTo Safety",
              "protocol":"x402",
              "http_method":"POST",
              "probe_body":"{\"url\":\"https://example.com\",\"maxPriceUsd\":0.01,\"expectedNetwork\":\"eip155:8453\"}",
              "description":"Verify an x402 endpoint before paying USDC: live endpoint, payTo recipient, quote price, Base or Solana network, asset, resource binding and x402 payment challenge safety.",
              "price_usd":0.001,
              "payment_asset":"USDC",
              "payment_network":"Base/Solana",
              "category":"security",
              "provider":"AgentResolver"
            }')"
          cat "$body"
          echo
          case "$code" in
            200|201) ;;
            *) echo "402 Index registration failed with HTTP $code" >&2; exit 1 ;;
          esac

      - name: Verify buyer-search visibility
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://402index.io/api/v1/services?protocol=x402&q=AgentResolver%20x402%20API%20Trust%20Preflight' -o /tmp/search.json
          cat /tmp/search.json
          grep -q 'agentresolver.vercel.app/api/http-inspect' /tmp/search.json
