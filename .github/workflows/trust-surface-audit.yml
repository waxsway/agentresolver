name: Trust Surface Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ops/facilitator-catalog-audit
    paths:
      - '.github/workflows/trust-surface-audit.yml'
  schedule:
    - cron: "17 */6 * * *"
  workflow_run:
    workflows: ["Production Smoke"]
    types: [completed]

permissions:
  contents: read

jobs:
  audit:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify public infrastructure contract
        shell: bash
        env:
          BASE_URL: https://agentresolver.vercel.app
        run: |
          set -euo pipefail

          curl -fsS "$BASE_URL/api/health?audit=$GITHUB_RUN_ID" -o /tmp/health.json
          jq -e '
            .ok == true and
            .canonicalPaidRoute == "/api/x402-payment-preflight" and
            .trust == "/.well-known/agentresolver-trust.json" and
            .security == "/.well-known/security.txt"
          ' /tmp/health.json >/dev/null

          curl -fsS "$BASE_URL/.well-known/agentresolver-trust.json?audit=$GITHUB_RUN_ID" -o /tmp/trust.json
          jq -e '
            .schemaVersion == 1 and
            .paymentModel.custodial == false and
            .paymentModel.holdsCustomerBalances == false and
            .paymentModel.callerControlsAuthorization == true and
            .canonicalPaidRoute.priceUsd == 0.001 and
            (.deployment.commitSha | type == "string" and length == 40) and
            .deployment.sourceCommitUrl == ("https://github.com/waxsway/agentresolver/commit/" + .deployment.commitSha)
          ' /tmp/trust.json >/dev/null

          code="$(curl -sS -D /tmp/preflight.headers -o /tmp/preflight.json -w '%{http_code}' "$BASE_URL/api/x402-payment-preflight")"
          test "$code" = "402"
          grep -Fi 'x-agentresolver-contract-version: 1' /tmp/preflight.headers >/dev/null
          grep -Fi 'x-agentresolver-request-id:' /tmp/preflight.headers >/dev/null
          grep -Fi 'x-agentresolver-deployment:' /tmp/preflight.headers >/dev/null
          grep -Fi 'payment-required:' /tmp/preflight.headers >/dev/null
          grep -Fi 'access-control-expose-headers:' /tmp/preflight.headers | grep -Fi 'x-agentresolver-request-id' >/dev/null
          grep -Fi 'access-control-expose-headers:' /tmp/preflight.headers | grep -Fi 'payment-response' >/dev/null
          jq -e '
            .x402Version == 2 and
            (.accepts | length == 2) and
            (.accepts | any(.network == "eip155:8453" and .amount == "1000")) and
            (.accepts | any(.network == "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp" and .amount == "1000")) and
            (.extensions.bazaar.schema.properties.output != null)
          ' /tmp/preflight.json >/dev/null

          curl -fsS "$BASE_URL/.well-known/security.txt?audit=$GITHUB_RUN_ID" |
            grep -F 'Canonical: https://agentresolver.vercel.app/.well-known/security.txt' >/dev/null

          echo "Canonical production trust contract is healthy."

      - name: Audit Agent402 buyer routing
        shell: bash
        run: |
          set -euo pipefail
          queries=(
            "x402 preflight"
            "payTo verification"
            "verify endpoint before paying"
          )
          for q in "${queries[@]}"; do
            payload="$(jq -cn --arg query "$q" '{query:$query,top:10,include:"external"}')"
            code="$(curl -sS -o /tmp/agent402.json -w '%{http_code}' \
              -X POST https://agent402.tools/api/route \
              -H 'content-type: application/json' \
              -d "$payload")"
            test "$code" -ge 200 && test "$code" -lt 300
            jq --arg q "$q" '{
              query:$q,
              agentresolver:[
                (.results // [])[]? |
                select(
                  ((.origin // "") | contains("agentresolver.vercel.app")) or
                  ((.host // "") | contains("agentresolver.vercel.app")) or
                  ((.seller // "") | ascii_downcase | contains("agentresolver"))
                ) |
                {rank,name,priceUsd,health,networks,routerDispatchEligible,executeViaCallableNow}
              ]
            }' /tmp/agent402.json
          done

      - name: Audit AgentCash buyer-search visibility
        shell: bash
        run: |
          set -euo pipefail
          queries=("x402 payment preflight" "payTo verification" "verify endpoint before paying")
          found=0
          for q in "${queries[@]}"; do
            if npx -y agentcash@0.17.1 search "$q" --format json > /tmp/agentcash.json 2>/tmp/agentcash.err; then
              if grep -Fq 'agentresolver.vercel.app' /tmp/agentcash.json; then
                found=$((found + 1))
                echo "AgentCash visible for: $q"
              else
                echo "::warning::AgentCash not visible for: $q"
              fi
            else
              echo "::warning::AgentCash search command failed for: $q"
              cat /tmp/agentcash.err || true
            fi
          done
          echo "AgentCash buyer-search visibility: $found/${#queries[@]} queries."

      - name: Audit true402 public catalog state
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/true402.json -w '%{http_code}' https://true402.dev/api/v1/services)"
          test "$code" = "200"
          if grep -Fq 'https://agentresolver.vercel.app' /tmp/true402.json; then
            echo "AgentResolver is visible in the true402 public buyer catalog."
          else
            echo "::warning::AgentResolver remains absent from the true402 public buyer catalog; registration/reputation and catalog visibility are distinct states."
          fi

      - name: Audit facilitator and Circle discovery catalogs
        shell: bash
        env:
          BASE_PAY_TO: "0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8"
          SOLANA_PAY_TO: "AoQNzm7dB7dhBXfgq9ywqkfkS68fg2e1JwcxrgXnkLXa"
          ORIGIN: "https://agentresolver.vercel.app"
        run: |
          set -euo pipefail

          audit_payai() {
            local label="$1"
            local wallet="$2"
            local out="/tmp/payai-$label.json"
            local code
            code="$(curl -sS -o "$out" -w '%{http_code}' --get               'https://facilitator.payai.network/discovery/resources'               --data-urlencode 'type=http'               --data-urlencode 'limit=1000'               --data-urlencode "payTo=$wallet")"
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              count="$(jq --arg origin "$ORIGIN" '[.items[]? | select((.resource // "") | startswith($origin))] | length' "$out")"
              echo "PayAI $label AgentResolver resources: $count"
              if [ "$count" = "0" ]; then
                echo "::warning::PayAI $label Bazaar has no AgentResolver resource yet; cataloging normally follows a settlement carrying Bazaar metadata."
              else
                jq --arg origin "$ORIGIN" '[.items[]? | select((.resource // "") | startswith($origin)) | {resource,lastUpdated,accepts,metadata}]' "$out"
              fi
            else
              echo "::warning::PayAI $label discovery audit returned HTTP $code."
              head -c 1000 "$out" || true
            fi
          }

          audit_cdp() {
            local label="$1"
            local wallet="$2"
            local out="/tmp/cdp-$label.json"
            local code
            code="$(curl -sS -o "$out" -w '%{http_code}' --get               'https://api.cdp.coinbase.com/platform/v2/x402/discovery/merchant'               --data-urlencode "payTo=$wallet")"
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              count="$(jq --arg origin "$ORIGIN" '
                [
                  ((.items // .resources // .data // [])[]?) |
                  select((.resource // .url // "") | startswith($origin))
                ] | length
              ' "$out")"
              echo "CDP $label AgentResolver resources: $count"
              if [ "$count" = "0" ]; then
                echo "::warning::CDP $label merchant discovery has no AgentResolver resource yet."
              fi
            else
              echo "::warning::CDP $label merchant discovery audit returned HTTP $code."
              head -c 1000 "$out" || true
            fi
          }

          audit_payai base "$BASE_PAY_TO"
          audit_payai solana "$SOLANA_PAY_TO"
          audit_cdp base "$BASE_PAY_TO"
          audit_cdp solana "$SOLANA_PAY_TO"

          circle_code="$(curl -sS -o /tmp/circle.json -w '%{http_code}' --get             'https://api.circle.com/v2/x402/discovery/resources'             --data-urlencode 'query=AgentResolver'             --data-urlencode 'category=INFRASTRUCTURE'             --data-urlencode 'maxUsdPrice=0.01')"
          if [ "$circle_code" -ge 200 ] && [ "$circle_code" -lt 300 ]; then
            if grep -Fq 'agentresolver.vercel.app' /tmp/circle.json; then
              echo "AgentResolver is visible in Circle Agent Marketplace discovery."
            else
              echo "::warning::AgentResolver is not yet visible in Circle Agent Marketplace discovery."
            fi
          else
            echo "::warning::Circle discovery audit returned HTTP $circle_code."
            head -c 1000 /tmp/circle.json || true
          fi
