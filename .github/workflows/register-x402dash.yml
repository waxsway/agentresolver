name: Register AgentResolver with x402dash

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/register-x402dash.yml

permissions:
  contents: read
  statuses: write

jobs:
  register:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Register canonical x402 canary
        id: register
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          endpoint = "https://x402dash.com/v1/register"
          payload = {
              "url": "https://agentresolver.vercel.app/api/x402-ping",
              "name": "AgentResolver x402 Ping",
              "description": "No-account $0.001 USDC x402 v2 settlement canary for autonomous agents; paid response points to AgentResolver Payment Preflight for verify-before-pay use.",
              "category": "Developer Tools",
              "tags": ["x402", "agent-payments", "settlement-test", "preflight"]
          }

          req = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "agentresolver-free-distribution/1.0 (+https://github.com/waxsway/agentresolver)"
              },
              method="POST",
          )

          status = 0
          body = ""
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  status = resp.status
                  body = resp.read().decode("utf-8", "replace")
          except urllib.error.HTTPError as exc:
              status = exc.code
              body = exc.read().decode("utf-8", "replace")
          except Exception as exc:
              body = f"{type(exc).__name__}: {exc}"

          print(json.dumps({
              "provider": "x402dash",
              "status": status,
              "body": body.replace("\n", " ").replace("\r", " ")[:1200]
          }))

          success = 200 <= status < 300
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"http_status={status}\n")
              out.write(f"success={'true' if success else 'false'}\n")
          if not success:
              raise SystemExit(1)
          PY

      - name: Publish auditable commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REG_STATUS: ${{ steps.register.outputs.http_status }}
          REG_SUCCESS: ${{ steps.register.outputs.success }}
        run: |
          if [ "$REG_SUCCESS" = "true" ]; then
            STATE=success
            DESC="x402dash registration HTTP ${REG_STATUS:-0}"
          else
            STATE=failure
            DESC="x402dash registration failed HTTP ${REG_STATUS:-0}"
          fi
          export STATE DESC
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/waxsway/agentresolver/statuses/{os.environ['SHA']}"
          payload = {
              "state": os.environ["STATE"],
              "context": "distribution/x402dash",
              "description": os.environ["DESC"][:140],
              "target_url": "https://x402dash.com/"
          }
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28"
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print(resp.status, resp.read().decode("utf-8", "replace")[:500])
          PY
