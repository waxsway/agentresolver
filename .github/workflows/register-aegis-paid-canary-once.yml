name: Register Aegis Paid Canary Once

on:
  workflow_dispatch:
  schedule:
    - cron: "11 */12 * * *"
  push:
    branches: [main]
    paths:
      - '.github/workflows/register-aegis-paid-canary-once.yml'

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify cheapest paid GET canary is live
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          code="$(curl -sS -D "$headers" -o "$body" -w '%{http_code}'             -H 'x-agentresolver-internal: 1'             -X GET 'https://agentresolver.vercel.app/api/x402-ping')"
          test "$code" = "402"
          PAYMENT_REQUIRED="$(awk 'BEGIN{IGNORECASE=1} /^payment-required:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
          export PAYMENT_REQUIRED
          python3 - <<'PY'
          import base64, json, os
          raw = os.environ["PAYMENT_REQUIRED"].strip()
          assert raw, "PAYMENT-REQUIRED header missing"
          raw += "=" * (-len(raw) % 4)
          payload = json.loads(base64.urlsafe_b64decode(raw).decode("utf-8"))
          accepts = payload.get("accepts") or []
          assert any(
              str(item.get("amount")) == "1000" and item.get("network") == "eip155:8453"
              for item in accepts
          ), "Base $0.001 payment option missing"
          assert payload.get("extensions", {}).get("bazaar"), "Bazaar discovery extension missing"
          PY

      - name: Confirm Aegis paid registration remains operator-gated
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -G -o "$body" -w '%{http_code}'             'https://aegis.borisinc.com/submit'             --data-urlencode 'url=https://agentresolver.vercel.app/api/x402-ping'             --data-urlencode 'name=AgentResolver Settlement Ping'             --data-urlencode 'category=verification'             --data-urlencode 'price_usd=0.001')"
          case "$code" in
            402)
              echo "::notice::Aegis registration is paid; no payment was attempted. Continuing with free lint/discovery only."
              ;;
            200|201|202|204|409)
              echo "::notice::Aegis accepted the registration without requiring operator spend."
              cat "$body"
              ;;
            429|500|502|503|504|530|000)
              echo "::warning::Aegis is temporarily unavailable/rate-limited (HTTP $code); no payment was attempted and registration is deferred."
              cat "$body" 2>/dev/null || true
              touch /tmp/aegis-unavailable
              ;;
            *)
              echo "::warning::Aegis registration surface returned HTTP $code; no payment was attempted."
              cat "$body" 2>/dev/null || true
              ;;
          esac

      - name: Run Aegis free lint against paid canary
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/aegis-unavailable ]; then
            echo "::notice::Skipping Aegis lint because the registry is temporarily unavailable."
            exit 0
          fi
          body="$(mktemp)"
          code="$(curl -sS -G -o "$body" -w '%{http_code}'             --connect-timeout 5 --max-time 20             'https://aegis.borisinc.com/lint'             --data-urlencode 'url=https://agentresolver.vercel.app/api/x402-ping' || printf '000')"
          cat "$body" 2>/dev/null || true
          echo
          case "$code" in
            200) ;;
            429|500|502|503|504|530|000)
              echo "::notice::Aegis lint is temporarily unavailable (HTTP $code); the scheduled zero-spend audit will retry."
              touch /tmp/aegis-unavailable
              ;;
            402)
              echo "::error::Aegis advertised lint as free but returned 402. No payment was attempted."
              exit 1
              ;;
            *) echo "::warning::Unexpected Aegis lint status $code." ;;
          esac

      - name: Attempt Aegis Provider Launch Check registration without spending
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/aegis-unavailable ]; then
            echo "::notice::Skipping Provider Launch Check submission because Aegis is temporarily unavailable."
            exit 0
          fi
          body="$(mktemp)"
          code="$(curl -sS -G -o "$body" -w '%{http_code}'             'https://aegis.borisinc.com/submit'             --data-urlencode 'url=https://agentresolver.vercel.app/api/provider-launch-check'             --data-urlencode 'name=AgentResolver Provider Launch Check'             --data-urlencode 'category=developer-tools'             --data-urlencode 'price_usd=0.05' || printf '000')"
          case "$code" in
            200|201|202|204|409)
              echo "::notice::Aegis accepted Provider Launch Check without operator spend."
              cat "$body" 2>/dev/null || true
              ;;
            402)
              echo "::notice::Aegis Provider Launch Check registration is paid; no payment was attempted."
              ;;
            429|500|502|503|504|530|000)
              echo "::notice::Aegis Provider Launch Check registration is temporarily unavailable (HTTP $code); no payment was attempted."
              ;;
            *)
              echo "::warning::Unexpected Aegis Provider Launch Check registration status $code; no payment was attempted."
              cat "$body" 2>/dev/null || true
              ;;
          esac

          lint_body="$(mktemp)"
          lint_code="$(curl -sS -G -o "$lint_body" -w '%{http_code}'             --connect-timeout 5 --max-time 20             'https://aegis.borisinc.com/lint'             --data-urlencode 'url=https://agentresolver.vercel.app/api/provider-launch-check' || printf '000')"
          case "$lint_code" in
            200) cat "$lint_body" 2>/dev/null || true ;;
            402) echo "::notice::Aegis Provider Launch Check lint requested payment; no payment was attempted." ;;
            429|500|502|503|504|530|000) echo "::notice::Aegis seller lint unavailable (HTTP $lint_code)." ;;
            *) echo "::warning::Unexpected Aegis seller lint status $lint_code." ;;
          esac

      - name: Check Aegis discovery visibility
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/aegis-unavailable ]; then
            echo "::notice::Skipping Aegis discovery check because the registry is temporarily unavailable."
            exit 0
          fi
          body="$(mktemp)"
          code="$(curl -sS -G -o "$body" -w '%{http_code}'             --connect-timeout 5 --max-time 20             'https://aegis.borisinc.com/discover'             --data-urlencode 'query=AgentResolver' || printf '000')"
          cat "$body" 2>/dev/null || true
          echo
          case "$code" in
            200)
              if ! grep -qi 'agentresolver' "$body" 2>/dev/null; then
                echo "::notice::Aegis accepted the submission but discovery may not reflect it until the next registry sweep."
              fi
              ;;
            429|500|502|503|504|530|000)
              echo "::notice::Aegis discovery is temporarily unavailable (HTTP $code); recurring deploy hooks will retry."
              ;;
            402)
              echo "::error::Aegis advertised discovery as free but returned 402. No payment was attempted."
              exit 1
              ;;
            *) echo "::warning::Unexpected Aegis discovery status $code." ;;
          esac
