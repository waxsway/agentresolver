name: Register Aegis Paid Canary Once

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Production"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/register-aegis-paid-canary-once.yml'

permissions:
  contents: read

jobs:
  register:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify cheapest paid GET canary is live
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          code="$(curl -sS -D "$headers" -o "$body" -w '%{http_code}'             -X GET 'https://agentresolver.vercel.app/api/x402-ping')"
          test "$code" = "402"
          PAYMENT_REQUIRED="$(awk 'BEGIN{IGNORECASE=1} /^payment-required:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
          export PAYMENT_REQUIRED
          python3 - <<'PY'
          import base64, json, os
          raw = os.environ["PAYMENT_REQUIRED"].strip()
          assert raw, "PAYMENT-REQUIRED header missing"
          raw += "=" * (-len(raw) % 4)
          payload = json.loads(base64.urlsafe_b64decode(raw).decode("utf-8"))
          accepts = payload.get("accepts") or []
          assert any(
              str(item.get("amount")) == "1000" and item.get("network") == "eip155:8453"
              for item in accepts
          ), "Base $0.001 payment option missing"
          assert payload.get("extensions", {}).get("bazaar"), "Bazaar discovery extension missing"
          PY

      - name: Confirm Aegis paid registration remains operator-gated
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -G -o "$body" -w '%{http_code}'             'https://aegis.borisinc.com/submit'             --data-urlencode 'url=https://agentresolver.vercel.app/api/x402-ping'             --data-urlencode 'name=AgentResolver Settlement Ping'             --data-urlencode 'category=verification'             --data-urlencode 'price_usd=0.001')"
          case "$code" in
            402)
              echo "::notice::Aegis registration is paid; no payment was attempted. Continuing with free lint/discovery only."
              ;;
            200|201|202|204|409)
              echo "::notice::Aegis accepted the registration without requiring operator spend."
              cat "$body"
              ;;
            *)
              echo "::warning::Aegis registration surface returned HTTP $code; no payment was attempted."
              cat "$body" 2>/dev/null || true
              ;;
          esac

      - name: Run Aegis free lint against paid canary
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -G -o "$body" -w '%{http_code}' \
            --connect-timeout 5 --max-time 20 \
            'https://aegis.borisinc.com/lint' \
            --data-urlencode 'url=https://agentresolver.vercel.app/api/x402-ping' || printf '000')"
          cat "$body" 2>/dev/null || true
          echo
          case "$code" in
            200)
              cp "$body" /tmp/aegis-lint.json
              ;;
            402)
              echo "::error::Aegis free lint unexpectedly requested payment. No payment was attempted."
              exit 1
              ;;
            429|500|502|503|504|520|521|522|523|524|525|526|527|530|000)
              echo "::notice::Aegis lint is temporarily unavailable (HTTP $code); keeping the paid-probe lane queued without failing AgentResolver."
              touch /tmp/aegis-unavailable
              ;;
            *)
              echo "::error::Aegis lint contract changed unexpectedly (HTTP $code)."
              exit 1
              ;;
          esac

      - name: Check Aegis discovery visibility
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/aegis-unavailable ]; then
            echo "::notice::Skipping Aegis discovery because its lint surface is unavailable."
            exit 0
          fi
          curl -fsS -G 'https://aegis.borisinc.com/discover'             --data-urlencode 'query=AgentResolver'             -o /tmp/aegis-discover.json || true
          cat /tmp/aegis-discover.json 2>/dev/null || true
          echo
          if ! grep -qi 'agentresolver' /tmp/aegis-discover.json 2>/dev/null; then
            echo "::notice::Aegis accepted the submission but discovery may not reflect it until the next registry sweep."
          fi
