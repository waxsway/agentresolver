name: Audit Coinbase CDP Readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-cdp-readiness.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      VERCEL_ORG_ID: team_ciQJak0lFZjXNgqry88ZDIKN
      VERCEL_PROJECT_ID: prj_uJKVWBawxKkEjIWV5EQkbkQPIABD
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      BASE_URL: https://agentresolver.vercel.app
    steps:
      - name: Audit production CDP credential metadata without reading values
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          chmod 600 "$response_file"

          status="$(curl -sS --connect-timeout 10 --max-time 30             -o "$response_file" -w '%{http_code}'             "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID"             -H "Authorization: Bearer $VERCEL_TOKEN")"
          test "$status" = "200"

          python3 - "$response_file" <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1], "r", encoding="utf-8"))
          envs=payload.get("envs", []) if isinstance(payload, dict) else []
          production_keys=set()
          matching_targets={}
          for item in envs:
              if not isinstance(item, dict):
                  continue
              target=item.get("target") or []
              if isinstance(target, str):
                  target=[target]
              key=item.get("key")
              if isinstance(key, str) and ("CDP" in key.upper() or "CDI" in key.upper() or "COINBASE" in key.upper()):
                  matching_targets.setdefault(key, set()).update(str(value) for value in target)
              if "production" in target and isinstance(key, str):
                  production_keys.add(key)
          id_keys={"CDP_API_KEY_ID","CDI_API_KEY_ID"}
          secret_keys={"CDP_API_KEY_SECRET","CDP_API_SECRET","CDI_API_KEY_SECRET","CDI_API_SECRET"}
          matching=sorted(
              key for key in production_keys
              if "CDP" in key.upper() or "CDI" in key.upper() or "COINBASE" in key.upper()
          )
          has_id=bool(id_keys & production_keys)
          has_secret=bool(secret_keys & production_keys)
          print(f"CDP_CREDENTIAL_ID_ALIAS_PRESENT={'true' if has_id else 'false'}")
          print(f"CDP_CREDENTIAL_SECRET_ALIAS_PRESENT={'true' if has_secret else 'false'}")
          print(f"CDP_CREDENTIAL_KEYS_PRESENT={'true' if has_id and has_secret else 'false'}")
          print("CDP_COINBASE_PRODUCTION_KEY_NAMES=" + ",".join(matching))
          target_summary=";".join(
              f"{key}:[{','.join(sorted(targets))}]"
              for key, targets in sorted(matching_targets.items())
          )
          print("CDP_COINBASE_KEY_TARGETS=" + target_summary)
          PY

      - name: Verify production credential values are retrievable without printing them
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          chmod 600 "$response_file"

          status="$(curl -sS --connect-timeout 10 --max-time 30 \
            -o "$response_file" -w '%{http_code}' \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID&decrypt=true&source=vercel-cli%3Apull" \
            -H "Authorization: Bearer $VERCEL_TOKEN")"
          test "$status" = "200"

          python3 - "$response_file" <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1], "r", encoding="utf-8"))
          envs=payload.get("envs", []) if isinstance(payload, dict) else []
          values={}
          for item in envs:
              if not isinstance(item, dict):
                  continue
              targets=item.get("target") or []
              if isinstance(targets, str):
                  targets=[targets]
              key=item.get("key")
              value=item.get("value")
              if "production" in targets and isinstance(key, str) and isinstance(value, str) and value:
                  values[key]=value

          has_id=any(values.get(key) for key in ("CDP_API_KEY_ID","CDI_API_KEY_ID"))
          has_secret=any(values.get(key) for key in ("CDP_API_KEY_SECRET","CDP_API_SECRET","CDI_API_KEY_SECRET","CDI_API_SECRET"))
          print(f"RUNTIME_CDP_ID_ALIAS_PRESENT={'true' if has_id else 'false'}")
          print(f"RUNTIME_CDP_SECRET_ALIAS_PRESENT={'true' if has_secret else 'false'}")
          print(f"RUNTIME_CDP_CREDENTIALS_PRESENT={'true' if has_id and has_secret else 'false'}")
          if not (has_id and has_secret):
              raise SystemExit(2)
          PY

      - name: Audit canonical payment rail state without changing it
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H 'cache-control: no-cache'             "$BASE_URL/api/health?cdpReadinessAudit=$GITHUB_RUN_ID"             -o /tmp/health.json
          jq '{
            default:.paymentRails.default,
            x402Ping:.paymentRails.x402Ping,
            x402PingBase:.paymentRails.x402PingBase,
            x402PingSolana:.paymentRails.x402PingSolana,
            cdpFacilitatorEnabledForX402Ping:.paymentRails.cdpFacilitatorEnabledForX402Ping,
            circleGatewayEnabled:.paymentRails.circleGatewayEnabled
          }' /tmp/health.json
          jq -e '.paymentRails.circleGatewayEnabled == false' /tmp/health.json >/dev/null

      - name: Verify current unsigned ping challenge remains healthy
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -D /tmp/ping-headers.txt -o /tmp/ping.json -w '%{http_code}'             -H 'x-agentresolver-internal: 1'             "$BASE_URL/api/x402-ping")"
          test "$code" = "402"
          grep -Fi 'payment-required:' /tmp/ping-headers.txt >/dev/null
          jq -e '.x402Version == 2 and any(.accepts[]; .network == "eip155:8453" and .amount == "1000")' /tmp/ping.json >/dev/null
          echo "CDP_READINESS_AUDIT_COMPLETE=true"
          echo "No payment was sent and no production configuration was changed."
