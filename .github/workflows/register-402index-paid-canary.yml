name: Register paid canary with 402 Index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/register-402index-paid-canary.yml'

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ENDPOINT_URL: https://agentresolver.vercel.app/api/x402-ping
    steps:
      - name: Verify live standard x402 challenge without spending
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' "$ENDPOINT_URL")"
          test "$code" = "402"
          python3 - "$body" <<'PY'
          import json, os, sys
          payload=json.load(open(sys.argv[1], "r", encoding="utf-8"))
          assert payload.get("x402Version") == 2
          assert (payload.get("resource") or {}).get("url") == os.environ["ENDPOINT_URL"]
          assert ((payload.get("extensions") or {}).get("agentresolver")) is None
          accepts=payload.get("accepts") or []
          assert any(
              item.get("scheme") == "exact"
              and item.get("network") == "eip155:8453"
              and str(item.get("amount")) == "1000"
              and item.get("asset") == "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
              and item.get("payTo") == "0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8"
              for item in accepts
          )
          PY

      - name: Register canary with 402 Index
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          payload="$(jq -cn --arg url "$ENDPOINT_URL" '{
            url:$url,
            name:"AgentResolver x402 Settlement Test",
            protocol:"x402",
            http_method:"GET",
            description:"$0.001 USDC GET-first x402 v2 settlement canary for autonomous agents. Standard signed retry returns a timestamped JSON pong only after settlement.",
            price_usd:0.001,
            payment_asset:"USDC",
            payment_network:"Base",
            category:"agent-tools/x402",
            provider:"AgentResolver"
          }')"
          code="$(curl -sS -o "$body" -w '%{http_code}'             -X POST 'https://402index.io/api/v1/register'             -H 'content-type: application/json'             --data "$payload")"
          cat "$body"
          echo
          case "$code" in
            200|201|202|409) ;;
            *) echo "402 Index registration failed with HTTP $code" >&2; exit 1 ;;
          esac
