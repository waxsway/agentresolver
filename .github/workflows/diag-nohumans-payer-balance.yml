name: Diagnostic NoHumans Payer Balance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Read Base USDC balance
        shell: bash
        run: |
          set -euo pipefail
          RPC="https://mainnet.base.org"
          USDC="0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
          PAYER="66e19457ffc829e8ed74706f5c1399c6f6466de8"
          DATA="0x70a08231000000000000000000000000${PAYER}"
          BODY=$(printf '{"jsonrpc":"2.0","method":"eth_call","params":[{"to":"%s","data":"%s"},"latest"],"id":1}' "$USDC" "$DATA")
          OUT=$(curl -fsS --retry 3 -H 'content-type: application/json' --data "$BODY" "$RPC")
          echo "$OUT"
          HEX=$(echo "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"])')
          python3 - "$HEX" <<'PY'
          import sys
          n=int(sys.argv[1],16)
          print('USDC_ATOMIC=', n)
          print('USDC=', n/1_000_000)
          print('CAN_PAY_3_USDC=', n >= 3_000_000)
          PY