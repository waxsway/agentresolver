name: Verify MCP x402 Preflight Funnel

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: read

concurrency:
  group: verify-mcp-x402-preflight-funnel
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BASE_URL: https://agentresolver.vercel.app
      MCP_URL: https://agentresolver.vercel.app/mcp
      BUYER_SETUP_URL: https://agentresolver.vercel.app/api/x402-client-setup
    steps:
      - name: Verify free buyer bootstrap is machine-readable and non-custodial
        shell: bash
        run: |
          set -euo pipefail

          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS \
            "$BUYER_SETUP_URL" \
            -H 'user-agent: AgentResolver-MCP-X402-Preflight-Funnel-Smoke/1.0' \
            -H 'x-agentresolver-internal: 1' \
            -o /tmp/x402-client-setup.json

          jq -e '
            .free == true and
            .payment.protocol == "x402" and
            .payment.paymentIsAuthorizedByAgentResolver == false and
            .clients.mcp.typescript.package == "@x402/mcp" and
            .clients.mcp.typescript.factory == "createx402MCPClient" and
            (
              .clients.http.typescript.package == "@x402/fetch" or
              (.clients.http.typescript.packages | index("@x402/fetch")) != null
            ) and
            .clients.http.typescript.wrapper == "wrapFetchWithPayment" and
            .authorizationBoundary.callerControlsSigner == true and
            .authorizationBoundary.agentResolverReceivesPrivateKey == false and
            .authorizationBoundary.agentResolverReceivesSeedPhrase == false and
            .authorizationBoundary.agentResolverAuthorizesSpend == false and
            .agentResolver.paymentGuard == "https://agentresolver.vercel.app/api/payment-guard" and
            .agentResolver.paymentGuardRequest.method == "GET" and
            .agentResolver.paymentGuardRequest.priceUsd == 0.001 and
            .agentResolver.paymentGuardRequest.requiredQuery == ["url"] and
            (.agentResolver.paymentGuardRequest.optionalQuery | index("expectedPayTo")) != null and
            .agentResolver.paymentGuardRequest.repeatUse == "before_each_autonomous_x402_spend" and
            (.recommendedSpendLoop | any(test("before each autonomous spend"; "i")))
          ' /tmp/x402-client-setup.json >/dev/null

      - name: Verify HTTP challenge advertises buyer setup without spend
        shell: bash
        run: |
          set -euo pipefail

          http_code=$(curl --retry 5 --retry-delay 2 --retry-all-errors -sS \
            -D /tmp/http-x402-preflight.headers \
            -o /tmp/http-x402-preflight.out \
            -w '%{http_code}' \
            -X POST "$BASE_URL/api/x402-payment-preflight" \
            -H 'content-type: application/json' \
            -H 'user-agent: AgentResolver-MCP-X402-Preflight-Funnel-Smoke/1.0' \
            -H 'x-agentresolver-internal: 1' \
            --data '{"url":"https://agentresolver.vercel.app/api/x402-ping","method":"GET","maxPriceUsd":0.01,"expectedNetwork":"eip155:8453"}')

          test "$http_code" = "402"
          expected_setup="$BUYER_SETUP_URL?source=x402-challenge&capabilityId=x402-payment-preflight&method=POST"
          grep -Fi "x-agentresolver-buyer-setup: $expected_setup" /tmp/http-x402-preflight.headers >/dev/null
          grep -Fi 'access-control-expose-headers:' /tmp/http-x402-preflight.headers | grep -Fi 'x-agentresolver-buyer-setup' >/dev/null
          jq -e --arg setup "$expected_setup" '
            .x402Version == 2 and
            .buyerSetup.method == "POST" and
            .buyerSetup.setup == $setup
          ' /tmp/http-x402-preflight.out >/dev/null

          payment_required="$(awk 'BEGIN{IGNORECASE=1} /^payment-required:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/http-x402-preflight.headers)"
          PAYMENT_REQUIRED="$payment_required" EXPECTED_SETUP="$expected_setup" python3 -c '
          import base64, json, os
          raw = os.environ["PAYMENT_REQUIRED"].strip()
          raw += "=" * (-len(raw) % 4)
          payload = json.loads(base64.urlsafe_b64decode(raw).decode("utf-8"))
          info = payload["extensions"]["agentresolver"]["info"]
          assert info["method"] == "POST"
          assert info["setup"] == os.environ["EXPECTED_SETUP"]
          '

      - name: Verify free resolve hands x402 buyers to canonical preflight
        shell: bash
        run: |
          set -euo pipefail

          resolve_request='{"jsonrpc":"2.0","id":201,"method":"tools/call","params":{"name":"resolve","arguments":{"goal":"verify this x402 endpoint before paying and check payTo price network asset and resource binding","url":"https://agentresolver.vercel.app/api/x402-ping","limit":3}}}'
          resolve_code=$(curl --retry 5 --retry-delay 2 --retry-all-errors -sS \
            -o /tmp/mcp-x402-resolve.out \
            -w '%{http_code}' \
            -X POST "$MCP_URL" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'user-agent: AgentResolver-MCP-X402-Preflight-Funnel-Smoke/1.0' \
            -H 'x-agentresolver-internal: 1' \
            --data "$resolve_request")

          test "$resolve_code" -ge 200 && test "$resolve_code" -lt 300
          grep -F 'recommendedPaidAction' /tmp/mcp-x402-resolve.out >/dev/null
          grep -F 'x402-payment-preflight' /tmp/mcp-x402-resolve.out >/dev/null
          grep -F 'x402_payment_preflight' /tmp/mcp-x402-resolve.out >/dev/null
          grep -F '0.001' /tmp/mcp-x402-resolve.out >/dev/null
          grep -F '"surface":"mcp"' /tmp/mcp-x402-resolve.out >/dev/null || grep -F '\"surface\":\"mcp\"' /tmp/mcp-x402-resolve.out >/dev/null

      - name: Verify preflight tool challenges without execution or spend
        shell: bash
        run: |
          set -euo pipefail

          paid_request='{"jsonrpc":"2.0","id":202,"method":"tools/call","params":{"name":"x402_payment_preflight","arguments":{"url":"https://agentresolver.vercel.app/api/x402-ping","method":"GET","maxPriceUsd":0.01,"expectedNetwork":"eip155:8453"}}}'
          paid_code=$(curl --retry 5 --retry-delay 2 --retry-all-errors -sS \
            -o /tmp/mcp-x402-preflight.out \
            -w '%{http_code}' \
            -X POST "$MCP_URL" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'user-agent: AgentResolver-MCP-X402-Preflight-Funnel-Smoke/1.0' \
            -H 'x-agentresolver-internal: 1' \
            --data "$paid_request")

          test "$paid_code" -ge 200 && test "$paid_code" -lt 300
          grep -F 'x402Version' /tmp/mcp-x402-preflight.out >/dev/null
          grep -F '1000' /tmp/mcp-x402-preflight.out >/dev/null
          grep -F 'mcp://tool/x402_payment_preflight' /tmp/mcp-x402-preflight.out >/dev/null
          grep -F 'agentresolver_x402_buyer_setup' /tmp/mcp-x402-preflight.out >/dev/null
          grep -F "$BUYER_SETUP_URL" /tmp/mcp-x402-preflight.out >/dev/null

          if grep -F 'latencyMs' /tmp/mcp-x402-preflight.out >/dev/null || grep -F 'x402Verdict' /tmp/mcp-x402-preflight.out >/dev/null; then
            echo 'SECURITY FAILURE: unpaid x402_payment_preflight exposed paid inspection output before settlement.'
            cat /tmp/mcp-x402-preflight.out
            exit 1
          fi

          guard_request='{"jsonrpc":"2.0","id":203,"method":"tools/call","params":{"name":"payment_guard","arguments":{"url":"https://agentresolver.vercel.app/api/x402-ping","method":"GET","maxPriceUsd":0.01,"expectedNetwork":"eip155:8453"}}}'
          guard_code=$(curl --retry 5 --retry-delay 2 --retry-all-errors -sS \
            -o /tmp/mcp-payment-guard.out \
            -w '%{http_code}' \
            -X POST "$MCP_URL" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'user-agent: AgentResolver-MCP-X402-Preflight-Funnel-Smoke/1.0' \
            -H 'x-agentresolver-internal: 1' \
            --data "$guard_request")

          test "$guard_code" -ge 200 && test "$guard_code" -lt 300
          grep -F 'x402Version' /tmp/mcp-payment-guard.out >/dev/null
          grep -F '1000' /tmp/mcp-payment-guard.out >/dev/null
          grep -F 'mcp://tool/payment_guard' /tmp/mcp-payment-guard.out >/dev/null
          grep -F 'payment_guard' /tmp/mcp-payment-guard.out >/dev/null
          grep -F 'agentresolver_x402_buyer_setup' /tmp/mcp-payment-guard.out >/dev/null
          if grep -F 'latencyMs' /tmp/mcp-payment-guard.out >/dev/null; then
            echo 'SECURITY FAILURE: unpaid payment_guard exposed paid inspection output before settlement.'
            cat /tmp/mcp-payment-guard.out
            exit 1
          fi

          echo 'MCP legacy preflight + AgentResolver Guard funnel verified without signing or spending.'
