name: Register x402dash Trust Preflight

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Production"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/register-x402dash-trust.yml'
permissions:
  contents: read

jobs:
  register:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PREFLIGHT_URL: https://agentresolver.vercel.app/api/x402-payment-preflight?url=https%3A%2F%2Fagentresolver.vercel.app%2Fapi%2Fx402-ping&method=GET&maxPriceUsd=0.01&expectedNetwork=eip155%3A8453
      GUARD_URL: https://agentresolver.vercel.app/api/payment-guard?url=https%3A%2F%2Fagentresolver.vercel.app%2Fapi%2Fx402-ping&method=GET&maxPriceUsd=0.01&expectedNetwork=eip155%3A8453
      SETTLEMENT_VERIFY_URL: https://agentresolver.vercel.app/api/x402-settlement-verify?txHash=0x7729766d8615c6bd052340bddc95019be20afd78c2cd39faa4812775e3227b72&expectedPayTo=0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8&expectedAmountAtomic=1000
    steps:
      - name: Register trust verifier with x402dash
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          payload="$(jq -cn --arg url "$PREFLIGHT_URL" '{
            url:$url,
            name:"AgentResolver x402 Payment Preflight & PayTo Safety",
            description:"Executable $0.001 verify-before-pay example bound to a live x402 target. Checks endpoint liveness, payTo recipient, quoted price, Base network, asset, resource binding and payment challenge safety.",
            category:"Developer Tools",
            tags:["x402","payment-preflight","payto","endpoint-safety","usdc","base","agents"]
          }')"
          code="$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST 'https://api.x402dash.com/v1/register' \
            -H 'content-type: application/json' \
            --data "$payload")"
          cat "$body"
          echo
          case "$code" in
            200|201|202|409) ;;
            *) echo "x402dash registration failed with HTTP $code" >&2; exit 1 ;;
          esac

      - name: Register AgentResolver Guard with x402dash
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          payload="$(jq -cn --arg url "$GUARD_URL" '{
            url:$url,
            name:"AgentResolver Guard — Autonomous Payment Authorization",
            description:"Executable $0.001 Guard example bound to a live x402 target. Returns a fail-closed payment decision plus observed payment terms before a caller-owned wallet independently authorizes spend.",
            category:"Developer Tools",
            tags:["x402","payment-guard","payment-authorization","wallet-safety","verify-before-pay","payto","usdc","agents"]
          }')"
          code="$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST 'https://api.x402dash.com/v1/register' \
            -H 'content-type: application/json' \
            --data "$payload")"
          cat "$body"
          echo
          case "$code" in
            200|201|202|409) ;;
            *) echo "x402dash Guard registration failed with HTTP $code" >&2; exit 1 ;;
          esac


      - name: Register settlement verifier with x402dash
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          payload="$(jq -cn --arg url "$SETTLEMENT_VERIFY_URL" '{
            url:$url,
            name:"AgentResolver x402 Settlement Verify — Base USDC Receipt",
            description:"Executable $0.001 GET-first post-payment verifier. Given a Base transaction hash, checks the public receipt, exact USDC EIP-3009 payment shape, Transfer logs and optional expected recipient/amount assertions.",
            category:"Developer Tools",
            tags:["x402","settlement-verification","receipt","usdc","base","payment-evidence","agents"]
          }')"
          code="$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST 'https://api.x402dash.com/v1/register' \
            -H 'content-type: application/json' \
            --data "$payload")"
          cat "$body"
          echo
          case "$code" in
            200|201|202|409) ;;
            *) echo "x402dash settlement verifier registration failed with HTTP $code" >&2; exit 1 ;;
          esac

      - name: Inspect settlement verifier liveness/readiness
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -G -o /tmp/settlement-liveness.json -w '%{http_code}' \
            'https://api.x402dash.com/v1/liveness' \
            --data-urlencode "endpoint=$SETTLEMENT_VERIFY_URL" || printf '000')"
          if [ "$code" != "200" ]; then
            echo "::notice::x402dash settlement verifier liveness returned HTTP $code; scheduled probes can continue accumulating checks."
            exit 0
          fi
          cat /tmp/settlement-liveness.json
          echo
          jq '{
            id,
            url,
            liveness_score,
            reachability_status,
            x402_status,
            request_shape,
            integration_readiness,
            check_count,
            alive_count,
            dead_count
          }' /tmp/settlement-liveness.json || true

      - name: Inspect Guard liveness/readiness
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -G 'https://api.x402dash.com/v1/liveness' \
            --data-urlencode "endpoint=$GUARD_URL" \
            -o /tmp/guard-liveness.json || true
          cat /tmp/guard-liveness.json 2>/dev/null || true
          echo
          if jq -e '.integration_readiness == "ready_now" or .integration_readiness == "ready now"' /tmp/guard-liveness.json >/dev/null 2>&1; then
            echo "X402DASH_GUARD_READY_NOW=true"
          else
            echo "::notice::x402dash Guard is registered; readiness may require scheduled probes to accumulate."
          fi

      - name: Register cheapest paid GET canary with x402dash
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}'             -X POST 'https://api.x402dash.com/v1/register'             -H 'content-type: application/json'             --data '{
              "url":"https://agentresolver.vercel.app/api/x402-ping",
              "name":"AgentResolver x402 Settlement Ping",
              "description":"Minimal $0.001 USDC GET canary for autonomous buyers to verify wallet, facilitator, settlement and paid delivery end to end.",
              "category":"Developer Tools",
              "tags":["x402","settlement","payment-canary","usdc","base","solana","agents"]
            }')"
          cat "$body"
          echo
          case "$code" in
            200|201|202|409) ;;
            *) echo "x402dash canary registration failed with HTTP $code" >&2; exit 1 ;;
          esac

      - name: Inspect canary liveness/readiness
        shell: bash
        run: |
          set -euo pipefail
          code="000"
          for attempt in 1 2 3; do
            code="$(curl -sS -G -o /tmp/canary-liveness.json -w '%{http_code}' \
              'https://api.x402dash.com/v1/liveness' \
              --data-urlencode 'endpoint=https://agentresolver.vercel.app/api/x402-ping' || printf '000')"
            if [ "$code" = "200" ]; then
              break
            fi
            if [ "$code" = "429" ]; then
              echo "::notice::x402dash canary liveness is rate-limited (attempt $attempt); retrying without failing registration."
              sleep $((attempt * 3))
              continue
            fi
            echo "::notice::x402dash canary liveness returned HTTP $code; registration remains valid and scheduled probes will continue."
            break
          done

          if [ "$code" != "200" ]; then
            echo "::notice::Skipping canary readiness assertion because liveness telemetry is temporarily unavailable (HTTP $code)."
            exit 0
          fi

          cat /tmp/canary-liveness.json
          echo
          jq '{
            id,
            url,
            liveness_score,
            liveness_confidence,
            reachability_status,
            x402_status,
            request_shape,
            integration_readiness,
            check_count,
            alive_count,
            dead_count,
            price_usd,
            network,
            pay_to
          }' /tmp/canary-liveness.json || true
          if jq -e '.integration_readiness == "ready_now" or .integration_readiness == "ready now"' /tmp/canary-liveness.json >/dev/null 2>&1; then
            echo "X402DASH_CANARY_READY_NOW=true"
          else
            echo "::notice::x402dash canary is indexed but not yet ready_now; its scheduled liveness crawler will continue accumulating checks."
          fi

      - name: Verify free-directory visibility
        shell: bash
        run: |
          set -euo pipefail
          saw_rate_limit=0
          for i in {1..6}; do
            code="$(curl -sS -o /tmp/endpoints.json -w '%{http_code}' \
              'https://api.x402dash.com/v1/endpoints?limit=50&q=agentresolver' || printf '000')"
            if [ "$code" = "429" ]; then
              saw_rate_limit=1
              echo "::notice::x402dash search visibility check rate-limited on attempt $i."
              sleep 5
              continue
            fi
            if [ "$code" != "200" ]; then
              echo "::notice::x402dash search visibility returned HTTP $code on attempt $i."
              sleep 5
              continue
            fi
            cat /tmp/endpoints.json
            if grep -q 'agentresolver.vercel.app/api/x402-payment-preflight' /tmp/endpoints.json &&
               grep -q 'agentresolver.vercel.app/api/payment-guard' /tmp/endpoints.json &&
               grep -q 'agentresolver.vercel.app/api/x402-settlement-verify' /tmp/endpoints.json; then
              echo "X402DASH_GUARD_VISIBLE=true"
              exit 0
            fi
            sleep 5
          done

          if [ "$saw_rate_limit" = "1" ]; then
            echo "::notice::Guard registration was verified, but x402dash visibility could not be conclusively checked because the directory rate-limited this run."
            exit 0
          fi

          echo "AgentResolver preflight/Guard registration was accepted but both surfaces are not yet visible in x402dash free endpoint search." >&2
          exit 1
