name: One-shot NoHumans Preflight Requeue

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/requeue-nohumans-preflight-once.yml"

permissions:
  contents: read
  statuses: write

jobs:
  requeue:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PREFLIGHT_URL: https://agentresolver.vercel.app/api/x402-payment-preflight?url=https%3A%2F%2Fagentresolver.vercel.app%2Fapi%2Fx402-ping&method=GET&maxPriceUsd=0.01&expectedNetwork=eip155%3A8453
    steps:
      - name: Validate current production Preflight without spending
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS --connect-timeout 5 --max-time 20 -o "$body" -w '%{http_code}' "$PREFLIGHT_URL")"
          test "$code" = "402"
          python3 - "$body" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1], encoding="utf-8"))
          assert p.get("x402Version") == 2
          bazaar=((p.get("extensions") or {}).get("bazaar") or {}).get("info") or {}
          inp=bazaar.get("input") or {}
          assert inp.get("type") == "http"
          assert inp.get("method") == "GET"
          assert p.get("accepts")
          PY

      - name: Requeue canonical Preflight with NoHumans
        id: requeue
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          payload="$(jq -cn --arg endpoint "$PREFLIGHT_URL" '{
            name:"AgentResolver x402 Payment Preflight",
            description:"Canonical $0.001 x402 verify-before-pay preflight for autonomous agents. Inspects a live target challenge before the caller independently decides whether to authorize payment.",
            endpoint_url:$endpoint,
            category:"tools.verification",
            price_amount:0.001,
            price_currency:"USDC",
            chains:["base","solana"]
          }')"
          code="$(curl -sS --connect-timeout 5 --max-time 20 -o "$body" -w '%{http_code}'             -X POST 'https://nohumans.directory/v1/listings'             -H 'content-type: application/json'             --data "$payload" || printf '000')"

          python3 - "$body" <<'PY'
          import json, sys
          raw=open(sys.argv[1], encoding="utf-8").read()
          try:
              p=json.loads(raw)
          except Exception:
              print(raw)
              raise
          for key in ("claim_token","edit_token","owner_token","token","email"):
              if isinstance(p, dict) and key in p:
                  p[key]="[REDACTED]"
          if isinstance(p, dict) and isinstance(p.get("data"), dict):
              for key in ("claim_token","edit_token","owner_token","token","email"):
                  if key in p["data"]:
                      p["data"][key]="[REDACTED]"
          print(json.dumps(p,separators=(",",":")))
          PY

          case "$code" in
            200|201|202)
              echo "result=accepted" >> "$GITHUB_OUTPUT"
              ;;
            409)
              echo "result=already-listed" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "result=http-$code" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
          esac

      - name: Publish requeue result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RESULT: ${{ steps.requeue.outputs.result }}
        shell: bash
        run: |
          result="${RESULT:-workflow-failed}"
          case "$result" in
            accepted|already-listed) state=success ;;
            *) state=failure ;;
          esac
          export result state
          python3 - <<'PY'
          import json, os, urllib.request
          context=f"distribution/nohumans-preflight-requeue/{os.environ['result']}"[:100]
          payload={
              "state":os.environ["state"],
              "context":context,
              "description":f"NoHumans canonical Preflight requeue: {os.environ['result']}"[:140],
              "target_url":"https://nohumans.directory/",
          }
          req=urllib.request.Request(
              f"https://api.github.com/repos/waxsway/agentresolver/statuses/{os.environ['SHA']}",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept":"application/vnd.github+json",
                  "Content-Type":"application/json",
                  "X-GitHub-Api-Version":"2022-11-28",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print(resp.status)
          PY
