name: Market402 Paid Probe Opt-In

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Production"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/market402-paid-probe-optin.yml'
permissions:
  contents: read

jobs:
  optin:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Free Market402 self-test for canonical preflight
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST 'https://market402.com/selftest' \
            -H 'content-type: application/json' \
            --data '{"url":"https://agentresolver.vercel.app/api/x402-payment-preflight"}')"
          cat "$body"
          echo
          case "$code" in
            200|201|202) ;;
            *) echo "Market402 self-test failed with HTTP $code" >&2; exit 1 ;;
          esac

      - name: Free Market402 self-test for paid GET canary
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST 'https://market402.com/selftest' \
            -H 'content-type: application/json' \
            --data '{"url":"https://agentresolver.vercel.app/api/x402-ping"}')"
          cat "$body"
          echo
          case "$code" in
            200|201|202) ;;
            *) echo "Market402 canary self-test failed with HTTP $code" >&2; exit 1 ;;
          esac
          python3 - "$body" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], "r", encoding="utf-8"))
          verdict = payload.get("summary", {}).get("verdict")
          if verdict != "spec_compliant":
              raise SystemExit(f"Market402 canary verdict is {verdict!r}, expected 'spec_compliant'")
          PY

      - name: Submit paid GET canary and opt into real paid delivery probes
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST 'https://market402.com/submit' \
            -H 'content-type: application/json' \
            --data '{
              "resource":"https://agentresolver.vercel.app/api/x402-ping",
              "declared_price_usd":0.001,
              "paid_probe_optin":true
            }')"
          cat "$body"
          echo
          case "$code" in
            200|201|202|409) ;;
            *) echo "Market402 canary submission failed with HTTP $code" >&2; exit 1 ;;
          esac

      - name: Submit canonical preflight and opt into real paid delivery probes
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST 'https://market402.com/submit' \
            -H 'content-type: application/json' \
            --data '{
              "resource":"https://agentresolver.vercel.app/api/x402-payment-preflight",
              "declared_price_usd":0.001,
              "paid_probe_optin":true,
              "sample_input":{
                "method":"POST",
                "body":{
                  "url":"https://agentresolver.vercel.app/api/x402-ping",
                  "method":"GET",
                  "maxPriceUsd":0.01,
                  "expectedNetwork":"eip155:8453"
                }
              }
            }')"
          cat "$body"
          echo
          case "$code" in
            200|201|202|409) ;;
            *) echo "Market402 submission failed with HTTP $code" >&2; exit 1 ;;
          esac

      - name: Check public Market402 paid-probe roster
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://market402.com/search.json?q=x402%20preflight' -o /tmp/search.json || true
          echo "=== capability search ==="
          cat /tmp/search.json 2>/dev/null || true
          echo
          curl -fsS 'https://market402.com/optin.json' -o /tmp/optin.json
          echo "=== paid probe opt-in roster ==="
          cat /tmp/optin.json
          echo
          if ! grep -q 'agentresolver.vercel.app/api/x402-payment-preflight' /tmp/optin.json; then
            echo "::warning::Market402 accepted the canonical preflight submission but its public opt-in roster has not refreshed yet."
          fi
          if ! grep -q 'agentresolver.vercel.app/api/x402-ping' /tmp/optin.json; then
            echo "::warning::Market402 accepted the paid canary submission but its public opt-in roster has not refreshed yet."
          fi
