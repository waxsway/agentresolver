name: Audit true402 CDP Canary Search

on:
  push:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Search buyer intents
        shell: bash
        run: |
          set -euo pipefail
          for q in 'CDP settlement canary' 'x402 settlement test' 'wallet facilitator test'; do
            echo "=== $q ==="
            curl -sS --get --connect-timeout 5 --max-time 20               'https://true402.dev/api/v1/services'               --data-urlencode "q=$q"               --data-urlencode 'limit=20'               | jq -c '{total,rows:[(.data//[])[]|select((.url//"")|contains("agentresolver.vercel.app"))|{id,url,name:(.manifest.name//null),price:(.manifest.pricing.base//null)}]}'
          done
