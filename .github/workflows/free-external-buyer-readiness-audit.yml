name: Free External Buyer Readiness Audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/free-external-buyer-readiness-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify live production commit and manifest alias
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 'https://agentresolver.vercel.app/.well-known/x402.json' -o /tmp/manifest.json
          jq -e '
            .x402Version == 2 and
            (.resources | any(.resource == "GET /api/x402-ping")) and
            (.resources | any(.resource == "POST /api/x402-payment-preflight"))
          ' /tmp/manifest.json >/dev/null

          code="$(curl -sS --max-time 20 -o /tmp/ping.json -w '%{http_code}' 'https://agentresolver.vercel.app/api/x402-ping')"
          test "$code" = "402"
          jq -e '
            .x402Version == 2 and
            (.accepts | any(
              .network == "eip155:8453" and
              .amount == "1000" and
              .payTo == "0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8"
            ))
          ' /tmp/ping.json >/dev/null

      - name: Re-run Ontario readiness after deployed manifest fix
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 45 -o /tmp/readiness.json -w '%{http_code}'             -X POST 'https://ontarioprotocol.com/api/verify/x402-readiness'             -H 'content-type: application/json'             --data '{"target_url":"https://agentresolver.vercel.app/api/x402-ping"}')"
          echo "ONTARIO_READINESS_HTTP=$code"
          jq '{
            readiness_score,
            grade,
            recommendations,
            signals,
            report_id,
            report_url
          }' /tmp/readiness.json
          case "$code" in 200|201|202) ;; *) exit 1 ;; esac

      - name: Re-run free buyer conversion diagnostic
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 45 -o /tmp/buyer.json -w '%{http_code}'             -X POST 'https://ontarioprotocol.com/api/tools/agent-buyer-conversion-diagnostic'             -H 'content-type: application/json'             --data '{
              "endpoint_url":"https://agentresolver.vercel.app/api/x402-ping",
              "buyer_query":"verify my x402 wallet and facilitator can complete a real $0.001 USDC payment and receive paid product",
              "source":"agentresolver-postdeploy-audit"
            }')"
          echo "ONTARIO_BUYER_DIAGNOSTIC_HTTP=$code"
          jq '{
            buyer_fit: .bazaar_readiness.buyer_fit,
            buyer_intent: .bazaar_readiness.buyer_intent,
            recommended_action,
            report_id
          }' /tmp/buyer.json
          case "$code" in 200|201|202) ;; *) exit 1 ;; esac
