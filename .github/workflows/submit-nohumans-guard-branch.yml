name: Submit NoHumans Guard Once

on:
  push:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-slim
    timeout-minutes: 4
    steps:
      - name: Submit Guard only if exact endpoint is absent
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE='https://agentresolver.vercel.app/api/payment-guard?url=https%3A%2F%2Fagentresolver.vercel.app%2Fapi%2Fx402-ping&method=GET&maxPriceUsd=0.01&expectedNetwork=eip155%3A8453'

          discover="$(mktemp)"
          dcode="$(curl -sS --connect-timeout 5 --max-time 25             -o "$discover" -w '%{http_code}'             --get 'https://nohumans.directory/v1/discover'             --data-urlencode 'q=AgentResolver Guard' || printf '000')"
          echo "discover_http=$dcode"
          if [ "$dcode" = "200" ] && grep -Fq "$RESOURCE" "$discover"; then
            echo "already_listed=true"
            exit 0
          fi

          payload="$(jq -cn --arg endpoint "$RESOURCE" '{
            name:"AgentResolver Guard — Verify x402 Before Paying",
            description:"Fail-closed x402 payment preflight for autonomous agents before signing a target payment. Verifies amount, network, asset, payTo, scheme and resource binding. Separate target-payment authorization remains with the caller.",
            endpoint_url:$endpoint,
            category:"infra.trust",
            price_amount:0.001,
            chains:["base","solana"],
            sample_query:$endpoint
          }')"

          body="$(mktemp)"
          code="$(curl -sS --connect-timeout 5 --max-time 30             -o "$body" -w '%{http_code}'             -X POST 'https://nohumans.directory/v1/listings'             -H 'content-type: application/json'             --data "$payload" || printf '000')"
          echo "submit_http=$code"
          cat "$body"
          echo
          case "$code" in
            200|201|202|409) ;;
            *) exit 1 ;;
          esac
