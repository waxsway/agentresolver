name: Deploy Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # One-shot release gate. Non-release main CI runs stay no-op and spend no Vercel build CPU.
    # A deploy is allowed only for the exact merged PR marked AGENTRESOLVER_PRODUCTION_RELEASE_ONCE.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_ciQJak0lFZjXNgqry88ZDIKN
      VERCEL_PROJECT_ID: prj_uJKVWBawxKkEjIWV5EQkbkQPIABD
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Require validated SHA to still be main
        id: initial_freshness
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "validated_sha=$VALIDATED_SHA"
          echo "current_main=$current_main"
          if [ "$current_main" != "$VALIDATED_SHA" ]; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale CI result immediately: main already advanced."
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require explicit one-shot release marker
        if: steps.initial_freshness.outputs.fresh == 'true'
        id: release_pr
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "authorized=false" >> "$GITHUB_OUTPUT"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$VALIDATED_SHA/pulls"
          prs="$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")"

          release_pr="$(jq --arg sha "$VALIDATED_SHA" '
            [
              .[] |
              select(
                .merged_at != null and
                .base.ref == "main" and
                .merge_commit_sha == $sha
              )
            ][0] // null
          ' <<< "$prs")"

          if [ "$release_pr" = "null" ]; then
            echo "No merged PR is associated with validated main SHA; deploy remains suppressed."
            exit 0
          fi

          release_pr_number="$(jq -r '.number' <<< "$release_pr")"
          release_pr_title="$(jq -r '.title // ""' <<< "$release_pr")"
          release_pr_body="$(jq -r '.body // ""' <<< "$release_pr")"

          if [[ "$release_pr_title" != "Release production:"* ]] ||
            ! grep -Fq 'AGENTRESOLVER_PRODUCTION_RELEASE_ONCE' <<< "$release_pr_body"; then
            echo "Merged PR #$release_pr_number is not an explicitly marked one-shot production release; no deploy."
            exit 0
          fi

          echo "authorized=true" >> "$GITHUB_OUTPUT"
          echo "number=$release_pr_number" >> "$GITHUB_OUTPUT"
          echo "Release authorized by explicit marker on merged PR #$release_pr_number: $release_pr_title"

      - name: Detect application drift from production
        if: >-
          steps.initial_freshness.outputs.fresh == 'true' &&
          steps.release_pr.outputs.authorized == 'true'
        id: application_changes
        shell: bash
        env:
          BASE_URL: https://agentresolver.vercel.app
        run: |
          set -euo pipefail

          production_sha=""
          for attempt in {1..5}; do
            code="$(curl -sS \
              -D /tmp/live-preflight-headers.txt \
              -o /tmp/live-preflight-body.json \
              -w '%{http_code}' \
              -H 'x-agentresolver-internal: 1' \
              "$BASE_URL/api/x402-payment-preflight?url=https%3A%2F%2Fexample.com%2Fpaid&method=GET&maxPriceUsd=0.01" || true)"
            candidate="$(awk 'BEGIN{IGNORECASE=1} /^x-agentresolver-deployment:/ {gsub("\\r",""); print $2; exit}' /tmp/live-preflight-headers.txt)"
            if [ "$code" = "402" ] && [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
              production_sha="$candidate"
              break
            fi
            sleep "$attempt"
          done

          if [ -z "$production_sha" ]; then
            echo "Unable to determine the canonical production commit SHA; refusing to guess deployment drift." >&2
            sed -n '1,40p' /tmp/live-preflight-headers.txt || true
            exit 1
          fi

          echo "production_sha=$production_sha"
          echo "validated_sha=$VALIDATED_SHA"

          if [ "$production_sha" = "$VALIDATED_SHA" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Canonical production already serves the validated main commit."
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$production_sha"

          changed_file="$(mktemp)"
          git diff --name-only "$production_sha" "$VALIDATED_SHA" > "$changed_file"
          echo "Files changed since canonical production $production_sha:"
          cat "$changed_file"

          deploy=false
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .github/*|tests/*|docs/*|README.md|AGENTS.md|LICENSE|LICENSE.*|package-lock.json|server.json) ;;
              *) deploy=true; break ;;
            esac
          done < "$changed_file"

          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          if [ "$deploy" = "false" ]; then
            echo "Validated main has no application drift from canonical production; Vercel build/deploy is unnecessary."
          fi

      - name: Coalesce application releases before Vercel build
        if: steps.initial_freshness.outputs.fresh == 'true' && steps.application_changes.outputs.deploy == 'true'
        id: prebuild_freshness
        shell: bash
        run: |
          set -euo pipefail
          echo "Application drift detected. Waiting 90 seconds to coalesce rapid merges before spending Vercel build CPU."
          sleep 90
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "validated_sha=$VALIDATED_SHA"
          echo "current_main_after_coalesce=$current_main"
          if [ "$current_main" != "$VALIDATED_SHA" ]; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded release: main advanced during the build-coalescing window."
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require Vercel deployment credential
        if: >-
          steps.initial_freshness.outputs.fresh == 'true' &&
          steps.application_changes.outputs.deploy == 'true' &&
          steps.prebuild_freshness.outputs.fresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN GitHub Actions secret is not configured."
            exit 1
          fi

      - name: Setup Node
        if: >-
          steps.initial_freshness.outputs.fresh == 'true' &&
          steps.application_changes.outputs.deploy == 'true' &&
          steps.prebuild_freshness.outputs.fresh == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Vercel CLI
        if: >-
          steps.initial_freshness.outputs.fresh == 'true' &&
          steps.application_changes.outputs.deploy == 'true' &&
          steps.prebuild_freshness.outputs.fresh == 'true'
        run: npm install --global vercel@48.8.0 --no-audit --no-fund

      - name: Reset Vercel project link
        if: >-
          steps.initial_freshness.outputs.fresh == 'true' &&
          steps.application_changes.outputs.deploy == 'true' &&
          steps.prebuild_freshness.outputs.fresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Provision dedicated provider-attribution signer if absent
        if: >-
          steps.initial_freshness.outputs.fresh == 'true' &&
          steps.application_changes.outputs.deploy == 'true' &&
          steps.prebuild_freshness.outputs.fresh == 'true'
        env:
          ALLOW_ATTRIBUTION_SECRET_PROVISION: "1"
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/provision-attribution-signing-secret.sh

      - name: Pull production configuration
        if: >-
          steps.initial_freshness.outputs.fresh == 'true' &&
          steps.application_changes.outputs.deploy == 'true' &&
          steps.prebuild_freshness.outputs.fresh == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build validated production artifact
        if: >-
          steps.initial_freshness.outputs.fresh == 'true' &&
          steps.application_changes.outputs.deploy == 'true' &&
          steps.prebuild_freshness.outputs.fresh == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Recheck main immediately before deploy
        if: >-
          steps.initial_freshness.outputs.fresh == 'true' &&
          steps.application_changes.outputs.deploy == 'true' &&
          steps.prebuild_freshness.outputs.fresh == 'true'
        id: predeploy_freshness
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "validated_sha=$VALIDATED_SHA"
          echo "current_main=$current_main"
          if [ "$current_main" != "$VALIDATED_SHA" ]; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "Built artifact is now stale; refusing to deploy it."
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy prebuilt artifact to production
        id: production_deploy
        if: >-
          steps.initial_freshness.outputs.fresh == 'true' &&
          steps.application_changes.outputs.deploy == 'true' &&
          steps.prebuild_freshness.outputs.fresh == 'true' &&
          steps.predeploy_freshness.outputs.fresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "deployed=$deployment_url"

      - name: Smoke-test canonical production trust and payment contract
        if: steps.production_deploy.outputs.url != ''
        shell: bash
        env:
          BASE_URL: https://agentresolver.vercel.app
        run: |
          set -euo pipefail

          # Direct deployment URLs may be protected by Vercel. Verify the public
          # buyer-facing alias and require it to expose the exact validated SHA.
          live=0
          for attempt in {1..30}; do
            code="$(curl -sS -D /tmp/preflight-headers.txt -o /tmp/preflight-body.json -w '%{http_code}' -H 'x-agentresolver-internal: 1' "$BASE_URL/api/x402-payment-preflight?url=https%3A%2F%2Fexample.com%2Fpaid&method=GET&maxPriceUsd=0.01" || true)"
            deployed_sha="$(awk 'BEGIN{IGNORECASE=1} /^x-agentresolver-deployment:/ {gsub("\\r",""); print $2; exit}' /tmp/preflight-headers.txt)"
            if [ "$code" = "402" ] && [ "$deployed_sha" = "$VALIDATED_SHA" ]; then
              live=1
              break
            fi
            sleep 2
          done

          if [ "$live" != "1" ]; then
            echo "Canonical production did not converge to validated SHA $VALIDATED_SHA." >&2
            sed -n '1,40p' /tmp/preflight-headers.txt || true
            exit 1
          fi

          grep -Fi 'x-agentresolver-contract-version: 1' /tmp/preflight-headers.txt >/dev/null
          grep -Fi 'x-agentresolver-trust: https://agentresolver.vercel.app/.well-known/agentresolver-trust.json' /tmp/preflight-headers.txt >/dev/null
          grep -Fi 'x-agentresolver-history: https://agentresolver.vercel.app/.well-known/agentresolver-reputation.json' /tmp/preflight-headers.txt >/dev/null
          grep -Fi 'x-agentresolver-request-id:' /tmp/preflight-headers.txt >/dev/null
          grep -Fi 'payment-required:' /tmp/preflight-headers.txt >/dev/null
          grep -Fi 'x-agentresolver-free-procure: https://agentresolver.vercel.app/api/procure' /tmp/preflight-headers.txt >/dev/null
          grep -Fi 'x-agentresolver-control-mcp: https://agentresolver.vercel.app/mcp/control' /tmp/preflight-headers.txt >/dev/null
          grep -Fi 'access-control-expose-headers:' /tmp/preflight-headers.txt | grep -Fi 'x-agentresolver-request-id' >/dev/null
          grep -Fi 'access-control-expose-headers:' /tmp/preflight-headers.txt | grep -Fi 'x-agentresolver-free-procure' >/dev/null
          grep -Fi 'access-control-expose-headers:' /tmp/preflight-headers.txt | grep -Fi 'x-agentresolver-control-mcp' >/dev/null
          grep -Fi 'access-control-expose-headers:' /tmp/preflight-headers.txt | grep -Fi 'x-agentresolver-deployment' >/dev/null
          grep -Fi 'access-control-expose-headers:' /tmp/preflight-headers.txt | grep -Fi 'x-agentresolver-history' >/dev/null

          contracts_ready=0
          for attempt in {1..15}; do
            suffix="deployment=$VALIDATED_SHA&smokeAttempt=$attempt"

            if curl -fsS -H 'cache-control: no-cache' "$BASE_URL/api/health?$suffix" -o /tmp/health.json &&
              jq -e '.ok == true and .canonicalPaidRoute == "/api/x402-payment-preflight" and .trust == "/.well-known/agentresolver-trust.json"' /tmp/health.json >/dev/null &&
              curl -fsS -H 'cache-control: no-cache' "$BASE_URL/.well-known/agentresolver-trust.json?$suffix" -o /tmp/trust.json &&
              jq -e --arg sha "$VALIDATED_SHA" '
                .schemaVersion == 1 and
                .paymentModel.custodial == false and
                .canonicalPaidRoute.priceUsd == 0.001 and
                .deployment.commitSha == $sha and
                .deployment.sourceCommitUrl == ("https://github.com/waxsway/agentresolver/commit/" + $sha)
              ' /tmp/trust.json >/dev/null &&
              curl -fsS -H 'cache-control: no-cache' "$BASE_URL/.well-known/security.txt?$suffix" -o /tmp/security.txt &&
              grep -F 'Canonical: https://agentresolver.vercel.app/.well-known/security.txt' /tmp/security.txt >/dev/null; then
              contracts_ready=1
              break
            fi

            sleep 2
          done

          if [ "$contracts_ready" != "1" ]; then
            echo "Canonical production payment route converged, but trust/health/security surfaces did not converge to $VALIDATED_SHA." >&2
            cat /tmp/health.json 2>/dev/null || true
            cat /tmp/trust.json 2>/dev/null || true
            cat /tmp/security.txt 2>/dev/null || true
            exit 1
          fi

          cdp_ready=0
          for attempt in {1..20}; do
            suffix="deployment=$VALIDATED_SHA&cdpSmokeAttempt=$attempt"
            canary_code="$(curl -sS -D /tmp/cdp-canary-headers.txt -o /tmp/cdp-canary.json -w '%{http_code}' \
              -H 'cache-control: no-cache' \
              -H 'x-agentresolver-internal: 1' \
              "$BASE_URL/api/x402-cdp-canary?$suffix" || true)"
            canary_sha="$(awk 'BEGIN{IGNORECASE=1} /^x-agentresolver-deployment:/ {gsub("\r",""); print $2; exit}' /tmp/cdp-canary-headers.txt)"
            curl -fsS -H 'cache-control: no-cache' "$BASE_URL/api/health?$suffix" -o /tmp/cdp-health.json || true

            if [ "$canary_code" = "402" ] && [ "$canary_sha" = "$VALIDATED_SHA" ] &&
              grep -Fi 'payment-required:' /tmp/cdp-canary-headers.txt >/dev/null &&
              jq -e '
                .x402Version == 2 and
                (.accepts | length) == 1 and
                .accepts[0].scheme == "exact" and
                .accepts[0].network == "eip155:8453" and
                .accepts[0].amount == "2000" and
                .accepts[0].asset == "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913" and
                .accepts[0].payTo == "0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8"
              ' /tmp/cdp-canary.json >/dev/null &&
              jq -e '
                .paymentRails.x402Ping == "payai" and
                .paymentRails.x402PingBase == "payai" and
                .paymentRails.x402PingSolana == "payai" and
                .paymentRails.x402CdpCanary == "coinbase-cdp" and
                .paymentRails.cdpFacilitatorEnabledForCdpCanary == true and
                .paymentRails.circleGatewayEnabled == false
              ' /tmp/cdp-health.json >/dev/null; then
              cdp_ready=1
              break
            fi

            sleep 2
          done

          if [ "$cdp_ready" != "1" ]; then
            echo "::error::New production deployment did not preserve the isolated 0.002 USDC Coinbase CDP canary contract."
            cat /tmp/cdp-canary.json 2>/dev/null || true
            cat /tmp/cdp-health.json 2>/dev/null || true
            exit 1
          fi

          procure_ready=0
          for attempt in {1..15}; do
            suffix="deployment=$VALIDATED_SHA&procureSmokeAttempt=$attempt"
            if curl -fsS -H 'cache-control: no-cache' \
              -H 'content-type: application/json' \
              -H 'x-agentresolver-internal: 1' \
              -H 'user-agent: AgentResolver-Production-Smoke/1.0' \
              -d '{"goal":"compute a SHA-256 digest","limit":3,"constraints":{"maxPriceUsd":0.01,"requireHttps":true}}' \
              "$BASE_URL/api/procure?$suffix" -o /tmp/procure.json &&
              jq -e '
                .resolver == "AgentResolver" and
                .mode == "open_world_non_custodial_procurement" and
                .boundaries.accountRequired == false and
                .boundaries.apiKeyRequired == false and
                .boundaries.callerWalletControlledByAgentResolver == false and
                .boundaries.callerSpendAuthorizedByAgentResolver == false and
                (.candidates | type) == "array"
              ' /tmp/procure.json >/dev/null &&
              curl -fsS -H 'cache-control: no-cache' "$BASE_URL/openapi.json?$suffix" -o /tmp/procure-openapi.json &&
              jq -e '.paths["/api/procure"].post.operationId == "procureCapability"' /tmp/procure-openapi.json >/dev/null &&
              curl -fsS -H 'cache-control: no-cache' "$BASE_URL/.well-known/x402?$suffix" -o /tmp/procure-x402.json &&
              jq -e '.freeDiscovery.procure == "https://agentresolver.vercel.app/api/procure"' /tmp/procure-x402.json >/dev/null; then
              procure_ready=1
              break
            fi
            sleep 2
          done

          if [ "$procure_ready" != "1" ]; then
            echo "::error::New production deployment did not expose the procurement control-plane contract."
            cat /tmp/procure.json 2>/dev/null || true
            cat /tmp/procure-openapi.json 2>/dev/null || true
            cat /tmp/procure-x402.json 2>/dev/null || true
            exit 1
          fi

          procure_get_ready=0
          for attempt in {1..15}; do
            suffix="deployment=$VALIDATED_SHA&procureGetSmokeAttempt=$attempt"
            if curl -fsS -H 'cache-control: no-cache' \
              -H 'x-agentresolver-internal: 1' \
              -H 'user-agent: AgentResolver-Production-Smoke/1.0' \
              "$BASE_URL/api/procure?goal=compute%20a%20SHA-256%20digest&limit=3&maxPriceUsd=0.01&requireHttps=true&$suffix" \
              -o /tmp/procure-get.json &&
              jq -e '
                .resolver == "AgentResolver" and
                .mode == "open_world_non_custodial_procurement" and
                .goal == "compute a SHA-256 digest" and
                .constraints.maxPriceUsd == 0.01 and
                .boundaries.callerSpendAuthorizedByAgentResolver == false and
                (.candidates | type) == "array"
              ' /tmp/procure-get.json >/dev/null; then
              procure_get_ready=1
              break
            fi
            sleep 2
          done

          if [ "$procure_get_ready" != "1" ]; then
            echo "::error::New production deployment did not preserve GET/query procurement compatibility."
            cat /tmp/procure-get.json 2>/dev/null || true
            exit 1
          fi

          verified_resolve_get_ready=0
          for attempt in {1..15}; do
            suffix="deployment=$VALIDATED_SHA&verifiedResolveGetSmokeAttempt=$attempt"
            code="$(curl -sS -D /tmp/verified-resolve-get-headers.txt -o /tmp/verified-resolve-get-body.json -w '%{http_code}'               -H 'cache-control: no-cache'               -H 'x-agentresolver-internal: 1'               "$BASE_URL/api/verified-resolve?goal=Find%20and%20verify%20a%20paid%20web%20search%20service&maxPriceUsd=0.05&protocol=x402&requireHttps=true&$suffix" || true)"
            payment_required="$(awk 'BEGIN{IGNORECASE=1} /^payment-required:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub("\r",""); print; exit}' /tmp/verified-resolve-get-headers.txt)"
            if [ "$code" = "402" ] && [ -n "$payment_required" ] &&
              printf '%s' "$payment_required" | base64 --decode > /tmp/verified-resolve-get-challenge.json 2>/dev/null &&
              jq -e '
                .x402Version == 2 and
                ([.accepts[] | select(.network == "eip155:8453" and .amount == "20000")] | length) >= 1 and
                .extensions.bazaar.info.input.method == "GET" and
                .extensions.bazaar.info.input.queryParams.goal == "Find and verify a paid web search service" and
                .extensions.bazaar.info.input.queryParams.maxPriceUsd == 0.05 and
                .extensions.bazaar.info.input.queryParams.protocol == "x402"
              ' /tmp/verified-resolve-get-challenge.json >/dev/null; then
              verified_resolve_get_ready=1
              break
            fi
            sleep 2
          done

          if [ "$verified_resolve_get_ready" != "1" ]; then
            echo "::error::New production deployment did not expose the $0.02 GET-first Verified Resolve purchase path."
            cat /tmp/verified-resolve-get-body.json 2>/dev/null || true
            cat /tmp/verified-resolve-get-challenge.json 2>/dev/null || true
            exit 1
          fi

          provider_ready=0
          for attempt in {1..15}; do
            suffix="deployment=$VALIDATED_SHA&providerSmokeAttempt=$attempt"
            if curl -fsS -H 'cache-control: no-cache' "$BASE_URL/api/providers?$suffix" -o /tmp/providers.json &&
              jq -e '
                .service == "AgentResolver Provider Network" and
                .providerFunding.feeModel == "provider_success_fee" and
                .sellerMonetization.successFeeBps == 200 and
                .sellerMonetization.minimumSuccessFeeUsd == 0.001 and
                .sellerMonetization.buyerExtraFeeUsd == 0 and
                .domainEnrollment.status == "open" and
                .domainEnrollment.operatorReviewRequired == false and
                .domainEnrollment.liveX402ChallengeRequired == true and
                .domainEnrollment.unsignedEnrollmentProbeOnly == true
              ' /tmp/providers.json >/dev/null &&
              curl -fsS -H 'cache-control: no-cache' "$BASE_URL/provider-integration.json?$suffix" -o /tmp/provider-integration.json &&
              jq -e '
                .providerEnrollment.mode == "domain-controlled-well-known" and
                .providerEnrollment.reviewRequired == false and
                .providerEnrollment.liveVerification.requiredBeforeAttributedProcurement == true and
                .providerEnrollment.liveVerification.protocol == "x402-v2" and
                .providerEnrollment.liveVerification.challengeStatus == 402 and
                .providerEnrollment.liveVerification.unsignedProbeOnly == true and
                .providerEnrollment.liveVerification.failureMode == "fail-closed" and
                .providerEnrollment.bootstrap.url == "https://agentresolver.vercel.app/api/provider-bootstrap" and
                .providerEnrollment.bootstrap.immediateProcurement.requestField == "providerOrigins" and
                .providerEnrollment.bootstrap.durableDiscovery.registrationSentByAgentResolver == false and
                .attribution.signedReceipt.dedicatedSecret == "AGENTRESOLVER_ATTRIBUTION_SIGNING_SECRET" and
                .attribution.signedReceipt.enforcedForFeeEligibilityWhenConfigured == true and
                .attribution.signedReceipt.settlementTimestampSource == "independently verified Base block timestamp" and
                .commercial.successFeeBps == 200 and
                .commercial.minimumSuccessFeeUsd == 0.001 and
                .commercial.buyerExtraFeeUsd == 0
              ' /tmp/provider-integration.json >/dev/null &&
              curl -fsS -H 'cache-control: no-cache' "$BASE_URL/provider-manifest.example.json?$suffix" -o /tmp/provider-example.json &&
              jq -e '
                .schemaVersion == 1 and
                .provider.id and
                (.routes | type) == "array" and
                (.routes | length) >= 1
              ' /tmp/provider-example.json >/dev/null &&
              curl -fsS -H 'cache-control: no-cache' "$BASE_URL/openapi.json?$suffix" -o /tmp/provider-openapi.json &&
              jq -e '
                .paths["/api/providers"].get.operationId == "getProviderNetwork" and
                .paths["/api/provider-bootstrap"].post.operationId == "bootstrapProviderDiscovery" and
                .paths["/api/provider-attribution-verify"].post.operationId == "verifyProviderConversion" and
                .paths["/api/provider-success-fee-quote"].post.operationId == "quoteProviderSuccessFee" and
                .paths["/api/provider-success-fee-verify"].post.operationId == "verifyProviderSuccessFee"
              ' /tmp/provider-openapi.json >/dev/null; then
              provider_ready=1
              break
            fi
            sleep 2
          done

          if [ "$provider_ready" != "1" ]; then
            echo "::error::New production deployment did not expose the zero-account provider network contract."
            cat /tmp/providers.json 2>/dev/null || true
            cat /tmp/provider-integration.json 2>/dev/null || true
            cat /tmp/provider-example.json 2>/dev/null || true
            cat /tmp/provider-openapi.json 2>/dev/null || true
            exit 1
          fi

          mcp_control_ready=0
          for attempt in {1..15}; do
            suffix="deployment=$VALIDATED_SHA&mcpControlSmokeAttempt=$attempt"
            control_code="$(curl -sS -I -o /tmp/mcp-control-headers.txt -w '%{http_code}'               -H 'cache-control: no-cache'               "$BASE_URL/mcp/control?$suffix" || true)"
            if [ "$control_code" = "200" ] &&
              curl -fsS -H 'cache-control: no-cache' "$BASE_URL/server.json?$suffix" -o /tmp/mcp-server.json &&
              jq -e '
                .name == "io.github.waxsway/agentresolver" and
                .version == "0.2.0" and
                .remotes[0].url == "https://agentresolver.vercel.app/mcp/control"
              ' /tmp/mcp-server.json >/dev/null &&
              curl -fsS -H 'cache-control: no-cache' "$BASE_URL/integrations.json?$suffix" -o /tmp/integrations.json &&
              jq -e '
                .mcp.url == "https://agentresolver.vercel.app/mcp/control" and
                .mcp.fullCompatibilityUrl == "https://agentresolver.vercel.app/mcp" and
                .mcp.primaryTool == "procure" and
                .mcp.free == true and
                .mcp.spendingAuthorized == false
              ' /tmp/integrations.json >/dev/null &&
              curl -fsS -H 'cache-control: no-cache' "$BASE_URL/.well-known/agent-skills/index.json?$suffix" -o /tmp/agent-skills.json &&
              jq -e '
                [.skills[].name] |
                index("agentresolver-payment-guard") != null and
                index("agentresolver-procurement") != null and
                index("agentresolver-provider") != null
              ' /tmp/agent-skills.json >/dev/null; then
              mcp_control_ready=1
              break
            fi
            sleep 2
          done

          if [ "$mcp_control_ready" != "1" ]; then
            echo "::error::New production deployment did not expose the lean MCP procurement control plane."
            cat /tmp/mcp-control-headers.txt 2>/dev/null || true
            cat /tmp/mcp-server.json 2>/dev/null || true
            exit 1
          fi

          echo "VERIFIED_RESOLVE_GET_PRODUCTION_SMOKE=true"
          echo "UNSIGNED_402_PROCUREMENT_FALLBACK_SMOKE=true"
          echo "MCP_CONTROL_PRODUCTION_SMOKE=true"
          echo "PROVIDER_NETWORK_PRODUCTION_SMOKE=true"
          echo "PROCUREMENT_PRODUCTION_SMOKE=true"
          echo "CDP_PRODUCTION_SMOKE=true"

      - name: Restore known-good CDP runtime if release smoke fails
        if: failure() && steps.production_deploy.outcome != 'skipped'
        shell: bash
        env:
          HEALTHY_DEPLOYMENT_ID: dpl_Hh3SU83Ee4bS4a23eftmovdbDhks
          HEALTHY_SHA: 2d3175cfc983ecf27503d28adba9db936c5b8e5a
          CANONICAL_ALIAS: agentresolver.vercel.app
          BASE_URL: https://agentresolver.vercel.app
        run: |
          set -euo pipefail
          code="$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/rollback-alias.json -w '%{http_code}' \
            -X POST "https://api.vercel.com/v2/deployments/$HEALTHY_DEPLOYMENT_ID/aliases?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "$(jq -nc --arg alias "$CANONICAL_ALIAS" '{alias:$alias,redirect:null}')")"
          case "$code" in
            200|201) ;;
            *) cat /tmp/rollback-alias.json; exit 1 ;;
          esac

          restored=0
          for attempt in {1..30}; do
            suffix="releaseRollback=$GITHUB_RUN_ID-$attempt"
            canary_code="$(curl -sS --max-time 15 -D /tmp/rollback-canary-h -o /tmp/rollback-canary-b -w '%{http_code}' "$BASE_URL/api/x402-cdp-canary?$suffix" || true)"
            canary_sha="$(awk 'BEGIN{IGNORECASE=1} /^x-agentresolver-deployment:/ {gsub("\r",""); print $2; exit}' /tmp/rollback-canary-h)"
            ping_code="$(curl -sS --max-time 15 -o /tmp/rollback-ping-b -w '%{http_code}' "$BASE_URL/api/x402-ping?$suffix" || true)"
            if [ "$canary_code" = "402" ] && [ "$canary_sha" = "$HEALTHY_SHA" ] && [ "$ping_code" = "402" ] &&
              jq -e '
                .x402Version == 2 and
                (.accepts | length) == 1 and
                .accepts[0].network == "eip155:8453" and
                .accepts[0].amount == "2000"
              ' /tmp/rollback-canary-b >/dev/null; then
              restored=1
              break
            fi
            sleep 2
          done

          if [ "$restored" != "1" ]; then
            echo "::error::Release smoke failed and automatic rollback did not restore the known-good CDP runtime."
            exit 1
          fi

          echo "ROLLBACK_RESTORED_KNOWN_GOOD_CDP=true"

      - name: Report non-release deploy suppression
        if: >-
          steps.initial_freshness.outputs.fresh == 'true' &&
          steps.release_pr.outputs.authorized != 'true'
        run: echo "No production deployment occurred because this main merge was not explicitly marked AGENTRESOLVER_PRODUCTION_RELEASE_ONCE."

      - name: Report stale deploy suppression
        if: >-
          steps.initial_freshness.outputs.fresh != 'true' ||
          (steps.application_changes.outputs.deploy == 'true' && steps.prebuild_freshness.outputs.fresh == 'false') ||
          (steps.application_changes.outputs.deploy == 'true' && steps.predeploy_freshness.outputs.fresh == 'false')
        run: echo "No production deployment occurred because this CI result was no longer the tip of main."

      - name: Report automation-only deploy suppression
        if: >-
          steps.initial_freshness.outputs.fresh == 'true' &&
          steps.application_changes.outputs.deploy == 'false'
        run: echo "No Vercel build or deployment needed because this merge changed only docs/tests/.github automation."
