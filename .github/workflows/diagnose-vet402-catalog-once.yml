name: Diagnose vet402 Catalog Once

on:
  push:
    branches:
      - diag/vet402-catalog-20260917

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resolve AgentResolver in vet402 without spending
        shell: bash
        run: |
          set -euo pipefail
          queries=(
            "https://agentresolver.vercel.app/api/x402-ping"
            "https://agentresolver.vercel.app/api/payment-guard?url=https%3A%2F%2Fagentresolver.vercel.app%2Fapi%2Fx402-ping&method=GET&maxPriceUsd=0.01&expectedNetwork=eip155%3A8453"
            "https://agentresolver.vercel.app/api/x402-payment-preflight?url=https%3A%2F%2Fagentresolver.vercel.app%2Fapi%2Fx402-ping&method=GET&maxPriceUsd=0.01&expectedNetwork=eip155%3A8453"
            "agentresolver.vercel.app"
          )
          for q in "${queries[@]}"; do
            echo "=== RESOLVE: $q ==="
            out="$(mktemp)"
            code="$(curl -sS --connect-timeout 5 --max-time 20 -G -o "$out" -w '%{http_code}' 'https://vet402.com/api/v1/resolve' --data-urlencode "q=$q" || printf '000')"
            echo "HTTP $code"
            cat "$out" 2>/dev/null || true
            echo
            if [ "$code" = "200" ]; then
              jq -r '[.resource.observatory_id, (.endpoints[]?.observatory_id)] | map(select(. != null)) | unique[]' "$out" | while IFS= read -r oid; do
                echo "=== OBSERVATORY_ID: $oid ==="
                echo "=== FACTS ==="
                curl -sS --connect-timeout 5 --max-time 20 "https://vet402.com/api/v1/observatory/endpoints/$oid/facts" || true
                echo
                echo "=== PURCHASES ==="
                curl -sS --connect-timeout 5 --max-time 20 "https://vet402.com/api/v1/observatory/endpoints/$oid/purchases" || true
                echo
              done
            fi
          done
