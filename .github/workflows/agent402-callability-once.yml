name: One-shot Agent402 Callability Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent402-callability-once.yml"

permissions:
  contents: read
  statuses: write

jobs:
  inspect:
    runs-on: ubuntu-slim
    timeout-minutes: 6
    steps:
      - name: Inspect top AgentResolver routes for executable input contracts
        id: audit
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, urllib.parse, urllib.request

          queries = [
              ("preauth", "prepayment authorization gate"),
              ("txpath", "x402 transaction path payment gate"),
              ("usdc", "USDC payment check"),
          ]

          out = {}
          for label, q in queries:
              u = "https://agent402.tools/api/route?" + urllib.parse.urlencode({"q": q, "include": "external"})
              req = urllib.request.Request(u, headers={"User-Agent":"agentresolver-callability-audit/1.0"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  payload = json.loads(r.read().decode("utf-8", "replace"))
              rows = payload.get("results") or []
              row = None
              rank = 0
              for i, candidate in enumerate(rows, 1):
                  blob = json.dumps(candidate, separators=(",",":"), sort_keys=True).lower()
                  if "agentresolver.vercel.app" in blob or '"sellername":"agentresolver"' in blob:
                      row = candidate
                      rank = i
                      break
              row = row or {}
              schema = row.get("inputSchema") if isinstance(row.get("inputSchema"), dict) else {}
              required = row.get("required") if isinstance(row.get("required"), list) else schema.get("required") if isinstance(schema.get("required"), list) else []
              props = schema.get("properties") if isinstance(schema.get("properties"), dict) else {}
              example = row.get("example") if isinstance(row.get("example"), dict) else {}
              call_example = row.get("callExample")
              route = row.get("route")
              method = row.get("method")
              url = row.get("url") or row.get("endpoint")
              execute_now = row.get("executeViaCallableNow")
              execute_via = row.get("executeVia")
              executable = (
                  rank == 1
                  and execute_now is True
                  and isinstance(url, str) and url.startswith("https://agentresolver.vercel.app/")
                  and ("url" in required or "url" in props)
              )
              out[label] = {
                  "query": q,
                  "rank": rank or None,
                  "slug": row.get("slug"),
                  "method": method,
                  "route": route,
                  "url": url,
                  "priceUsd": row.get("priceUsd"),
                  "score": row.get("score"),
                  "health": row.get("health"),
                  "required": required,
                  "inputProperties": sorted(props.keys()),
                  "example": example,
                  "callExamplePresent": isinstance(call_example, str) and bool(call_example.strip()),
                  "executeViaCallableNow": execute_now,
                  "executeVia": execute_via,
                  "routerDispatchEligible": row.get("routerDispatchEligible"),
                  "routerDispatchReason": row.get("routerDispatchReason"),
                  "executableContract": executable,
              }

          print(json.dumps(out, separators=(",",":"), sort_keys=True))

          def code(v, limit=48):
              if v is None: return "na"
              if isinstance(v, (dict, list)):
                  v = json.dumps(v, separators=(",",":"), sort_keys=True)
              return re.sub(r'[^a-zA-Z0-9._-]+','-',str(v))[:limit] or "na"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              for label, row in out.items():
                  f.write(f"{label}_rank={row['rank'] or 0}\n")
                  f.write(f"{label}_slug={code(row['slug'])}\n")
                  f.write(f"{label}_method={code(row['method'])}\n")
                  f.write(f"{label}_required_url={'true' if 'url' in row['required'] or 'url' in row['inputProperties'] else 'false'}\n")
                  f.write(f"{label}_call_example={'true' if row['callExamplePresent'] else 'false'}\n")
                  f.write(f"{label}_execute_now={code(row['executeViaCallableNow'])}\n")
                  f.write(f"{label}_executable={'true' if row['executableContract'] else 'false'}\n")
          PY

      - name: Publish callability statuses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          PREAUTH_RANK: ${{ steps.audit.outputs.preauth_rank }}
          PREAUTH_SLUG: ${{ steps.audit.outputs.preauth_slug }}
          PREAUTH_URL: ${{ steps.audit.outputs.preauth_required_url }}
          PREAUTH_EXAMPLE: ${{ steps.audit.outputs.preauth_call_example }}
          PREAUTH_NOW: ${{ steps.audit.outputs.preauth_execute_now }}
          PREAUTH_EXEC: ${{ steps.audit.outputs.preauth_executable }}
          TXPATH_RANK: ${{ steps.audit.outputs.txpath_rank }}
          TXPATH_SLUG: ${{ steps.audit.outputs.txpath_slug }}
          TXPATH_URL: ${{ steps.audit.outputs.txpath_required_url }}
          TXPATH_EXAMPLE: ${{ steps.audit.outputs.txpath_call_example }}
          TXPATH_NOW: ${{ steps.audit.outputs.txpath_execute_now }}
          TXPATH_EXEC: ${{ steps.audit.outputs.txpath_executable }}
          USDC_RANK: ${{ steps.audit.outputs.usdc_rank }}
          USDC_SLUG: ${{ steps.audit.outputs.usdc_slug }}
          USDC_URL: ${{ steps.audit.outputs.usdc_required_url }}
          USDC_EXAMPLE: ${{ steps.audit.outputs.usdc_call_example }}
          USDC_NOW: ${{ steps.audit.outputs.usdc_execute_now }}
          USDC_EXEC: ${{ steps.audit.outputs.usdc_executable }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          rows = []
          for prefix, name in (("PREAUTH","preauth"),("TXPATH","txpath"),("USDC","usdc")):
              rows.append((
                  f"distribution/a402-call-{name}-r{os.environ.get(prefix+'_RANK','0')}-{os.environ.get(prefix+'_SLUG','na')}-url-{os.environ.get(prefix+'_URL','false')}-ex-{os.environ.get(prefix+'_EXAMPLE','false')}-now-{os.environ.get(prefix+'_NOW','na')}-ok-{os.environ.get(prefix+'_EXEC','false')}",
                  os.environ.get(prefix+"_EXEC") == "true",
              ))
          for context, ok in rows:
              payload={
                  "state":"success" if ok else "failure",
                  "context":context[:100],
                  "description":"Agent402 selected AgentResolver route callability audit",
                  "target_url":"https://agent402.tools/guides/smart-order-router",
              }
              req=urllib.request.Request(
                  f"https://api.github.com/repos/waxsway/agentresolver/statuses/{os.environ['SHA']}",
                  data=json.dumps(payload).encode(),
                  headers={
                      "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept":"application/vnd.github+json",
                      "Content-Type":"application/json",
                      "X-GitHub-Api-Version":"2022-11-28",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req,timeout=30) as r:
                  print(r.status)
          PY
