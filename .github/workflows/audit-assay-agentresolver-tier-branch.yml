name: Audit Assay AgentResolver Tier

on:
  push:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-slim
    timeout-minutes: 4
    steps:
      - name: Query free Assay tiers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.parse, urllib.request, urllib.error, json
          urls=[
            "https://agentresolver.vercel.app/api/x402-ping",
            "https://agentresolver.vercel.app/api/payment-guard?url=https%3A%2F%2Fagentresolver.vercel.app%2Fapi%2Fx402-ping&method=GET&maxPriceUsd=0.01&expectedNetwork=eip155%3A8453",
          ]
          for target in urls:
              endpoint="https://assay.nominal-labs.com/tier/"+urllib.parse.quote(target,safe="")
              req=urllib.request.Request(endpoint,headers={"user-agent":"agentresolver-free-audit/1.0"})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      code=r.status; body=r.read().decode("utf-8","replace")
              except urllib.error.HTTPError as e:
                  code=e.code; body=e.read().decode("utf-8","replace")
              print(json.dumps({"target":target,"http":code,"body":body[:1000]},separators=(",",":")))
              if code==402:
                  continue
              if code not in (200,404):
                  raise SystemExit(f"unexpected Assay HTTP {code}")
          PY
