name: Submit NoHumans Paid Canary Once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/submit-nohumans-paid-canary-once.yml'

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify paid GET canary before submission
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}'             -X GET 'https://agentresolver.vercel.app/api/x402-ping')"
          test "$code" = "402"
          python3 - "$body" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], "r", encoding="utf-8"))
          assert payload.get("x402Version") == 2
          accepts = payload.get("accepts") or []
          assert any(
              item.get("network") == "eip155:8453"
              and str(item.get("amount")) == "1000"
              and item.get("payTo") == "0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8"
              for item in accepts
          )
          PY

      - name: Submit canary to NoHumans free verification queue
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}'             -X POST 'https://nohumans.directory/v1/listings'             -H 'content-type: application/json'             --data '{
              "name":"AgentResolver Settlement Ping",
              "description":"Minimal $0.001 x402 settlement canary for autonomous agents. Returns a timestamped pong only after successful payment so buyers and independent verifiers can test wallet, facilitator, settlement and delivery end to end.",
              "endpoint_url":"https://agentresolver.vercel.app/api/x402-ping",
              "category":"tools.verification",
              "price_amount":0.001,
              "chains":["base","solana"]
            }')"
          cat "$body" | tee /tmp/nohumans-submit.json
          echo
          case "$code" in
            200|201|202|409) ;;
            *) echo "NoHumans submission failed with HTTP $code" >&2; exit 1 ;;
          esac

      - name: Confirm listing is discoverable or queued
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          curl -fsS -G 'https://nohumans.directory/v1/discover'             --data-urlencode 'q=AgentResolver Settlement Ping'             -o /tmp/nohumans-discover.json || true
          cat /tmp/nohumans-discover.json 2>/dev/null || true
          echo
          if ! grep -qi 'agentresolver' /tmp/nohumans-discover.json 2>/dev/null; then
            echo "::notice::Submission was accepted but search visibility may follow on the next probe/index cycle."
          fi
