name: Update CDP Lockfile Once

on:
  push:
    branches:
      - feat/cdp-facilitator-ready-disabled-20260916
    paths:
      - '.github/workflows/update-cdp-lock-once.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/cdp-facilitator-ready-disabled-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Generate pinned lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install @coinbase/cdp-sdk@1.56.0 --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff -- package.json package-lock.json
          git config user.name "agentresolver-lock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "build: lock Coinbase CDP SDK"
          git push origin HEAD:feat/cdp-facilitator-ready-disabled-20260916
