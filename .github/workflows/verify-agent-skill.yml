name: Verify Agent Skill Indexability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "public/.well-known/agent-skills/**"
      - "src/lib/x402BuyerSetup.ts"
      - ".github/workflows/verify-agent-skill.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.20.0"
          package-manager-cache: false

      - name: Verify public repo skill discovery
        shell: bash
        env:
          CI: "1"
        run: |
          set -euo pipefail
          timeout 90s npx -y skills@1.5.26 add waxsway/agentresolver --list | tee /tmp/skills-list.txt
          grep -F 'agentresolver-payment-guard' /tmp/skills-list.txt >/dev/null
          grep -F 'agentresolver-procurement' /tmp/skills-list.txt >/dev/null
