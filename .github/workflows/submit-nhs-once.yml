name: Submit AgentResolver to Not Human Search

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/submit-nhs-once.yml"

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit AgentResolver
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/out -w "%{http_code}" \
            -X POST "https://nothumansearch.ai/api/v1/submit" \
            -H "Content-Type: application/json" \
            --data '{"url":"https://agentresolver.vercel.app"}')
          echo "HTTP $code"
          cat /tmp/out
          test "$code" -ge 200 && test "$code" -lt 300
