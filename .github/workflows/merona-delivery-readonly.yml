name: Merona Delivery Read-Only Probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/merona-delivery-readonly.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Query Merona free trust and delivery APIs
        shell: bash
        run: |
          set -euo pipefail
          wallet='0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8'
          for path in "v1/trust/base/$wallet" "v1/delivery/base/$wallet"; do
            body="$(mktemp)"
            code="$(curl -sS --connect-timeout 10 --max-time 30 -o "$body" -w '%{http_code}' "https://api.merona.io/$path" || printf '000')"
            echo "GET /$path -> HTTP $code"
            cat "$body" 2>/dev/null || true
            echo
            case "$code" in
              200|404) ;;
              *) echo "Unexpected Merona response $code" >&2; exit 1 ;;
            esac
          done
