name: Register true402 Exact Preflight

on:
  push:

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-slim
    timeout-minutes: 4
    steps:
      - name: Register exact-intent executable Preflight
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE='https://agentresolver.vercel.app/api/x402-payment-preflight?url=https%3A%2F%2Fagentresolver.vercel.app%2Fapi%2Fx402-ping&method=GET&maxPriceUsd=0.01&expectedNetwork=eip155%3A8453'

          code="$(curl -sS --connect-timeout 5 --max-time 20             -o /tmp/challenge.json -w '%{http_code}' "$RESOURCE" || printf '000')"
          echo "challenge_http=$code"
          test "$code" = "402"

          reg="$(mktemp)"
          rcode="$(curl -sS --connect-timeout 5 --max-time 30             -o "$reg" -w '%{http_code}'             -X POST 'https://true402.dev/api/v1/services/register'             -H 'content-type: application/json'             --data "$(jq -cn --arg url "$RESOURCE" '{url:$url}')" || printf '000')"
          echo "register_http=$rcode"
          cat "$reg"
          echo
          case "$rcode" in 200|201|202|409) ;; *) exit 1;; esac

          sleep 2
          echo '=== exact search ==='
          curl -sS --get --connect-timeout 5 --max-time 20             'https://true402.dev/api/v1/services'             --data-urlencode 'q=verify x402 payment before paying'             --data-urlencode 'limit=20'
          echo
