name: Register true402 CDP Settlement Test Intent

on:
  push:

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-slim
    timeout-minutes: 4
    steps:
      - name: Register exact settlement-test URL variant
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE='https://agentresolver.vercel.app/api/x402-cdp-canary?echo=x402-settlement-test'
          code="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/challenge.json -w '%{http_code}' "$RESOURCE" || printf '000')"
          echo "challenge_http=$code"
          test "$code" = "402"

          payload="$(jq -cn --arg url "$RESOURCE" '{
            url:$url,
            manifest:{
              x402:"1.0",
              name:"x402 Settlement Test — Wallet + Coinbase CDP",
              description:"$0.002 end-to-end x402 settlement test for autonomous wallets on Base. Tests wallet signing, Coinbase CDP facilitation, USDC settlement, and paid delivery in one call.",
              capabilities:["agents","x402","settlement-test","wallet-test","coinbase-cdp","payment-canary"],
              pricing:{currency:"USDC",base:"0.002",unit:"request"},
              payment:{
                address:"0x66E19457fFC829E8Ed74706f5c1399C6F6466dE8",
                chain:"base",
                facilitator:"https://api.cdp.coinbase.com/platform/v2/x402"
              },
              endpoint:$url
            }
          }')"

          rcode="$(curl -sS --connect-timeout 5 --max-time 30             -o /tmp/reg.json -w '%{http_code}'             -X POST 'https://true402.dev/api/v1/services/register'             -H 'content-type: application/json'             --data "$payload" || printf '000')"
          echo "register_http=$rcode"
          cat /tmp/reg.json
          echo
          case "$rcode" in 200|201|202|409) ;; *) exit 1;; esac
