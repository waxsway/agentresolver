# Quote-only compatibility check. Never fund a Dexter payer wallet in CI.
name: Dexter x402 Quote Check

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dexter-x402-ping-audition.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Inspect x402 payment terms without paying
        id: check
        shell: bash
        run: |
          set +e
          npx --yes @dexterai/opendexter@1.23.3 check https://agentresolver.vercel.app/api/x402-ping > dexter-check.txt 2>&1
          RC=$?
          cat dexter-check.txt
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          if [ "$RC" -eq 0 ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish auditable commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          CHECK_SUCCESS: ${{ steps.check.outputs.success }}
          CHECK_EXIT: ${{ steps.check.outputs.exit_code }}
        run: |
          if [ "$CHECK_SUCCESS" = "true" ]; then
            STATE=success
            DESC="Dexter quote-only x402 check passed"
          else
            STATE=failure
            DESC="Dexter quote-only check failed exit ${CHECK_EXIT:-unknown}"
          fi
          export STATE DESC
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/waxsway/agentresolver/statuses/{os.environ['SHA']}"
          payload = {
              "state": os.environ["STATE"],
              "context": "distribution/dexter-quote-check",
              "description": os.environ["DESC"][:140],
              "target_url": "https://docs.dexter.cash/docs/operator/opendexter-for-non-developers/"
          }
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28"
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print(resp.status, resp.read().decode("utf-8", "replace")[:500])
          PY

      - name: Fail job after publishing status
        if: steps.check.outputs.success != 'true'
        run: exit 1
