name: Register AgentResolver with AgentCash
# Current-state refresh after exact-intent Guard/Preflight release.

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/agentcash-register.yml"
permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate live discovery and canonical paid route
        shell: bash
        run: |
          set -euo pipefail
          npx -y @agentcash/discovery@1.7.5 discover https://agentresolver.vercel.app
          echo "=== canonical preflight route check ==="
          if ! npx -y @agentcash/discovery@1.7.5 check https://agentresolver.vercel.app/api/x402-payment-preflight; then
            echo "::warning::Canonical x402 payment preflight failed AgentCash route validation."
          fi
          echo "=== AgentResolver Guard route check ==="
          if ! npx -y @agentcash/discovery@1.7.5 check https://agentresolver.vercel.app/api/payment-guard; then
            echo "::warning::AgentResolver Guard failed AgentCash route validation."
          fi
          echo "=== Provider Launch Check route check ==="
          if ! npx -y @agentcash/discovery@1.7.5 check https://agentresolver.vercel.app/api/provider-launch-check; then
            echo "::warning::Provider Launch Check failed AgentCash route validation."
          fi

      - name: Register origin with AgentCash
        env:
          HOME: ${{ runner.temp }}/agentcash-home
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          npx -y agentcash@0.17.1 register https://agentresolver.vercel.app --yes --format json | tee /tmp/agentcash-register.json

      - name: Attempt exact Guard resource registration
        env:
          HOME: ${{ runner.temp }}/agentcash-home
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          body="$(mktemp)"
          if npx -y agentcash@0.17.1 register https://agentresolver.vercel.app/api/payment-guard --yes --format json > "$body" 2>&1; then
            cat "$body"
            echo "AGENTCASH_GUARD_DIRECT_REGISTRATION=true"
          else
            cat "$body"
            echo "::notice::AgentCash CLI did not accept endpoint-only Guard registration. Origin registration remains authoritative; no runtime change or spend occurred."
          fi

      - name: Attempt exact Provider Launch Check resource registration
        env:
          HOME: ${{ runner.temp }}/agentcash-home
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          body="$(mktemp)"
          if npx -y agentcash@0.17.1 register https://agentresolver.vercel.app/api/provider-launch-check --yes --format json > "$body" 2>&1; then
            cat "$body"
            echo "AGENTCASH_PROVIDER_LAUNCH_DIRECT_REGISTRATION=true"
          else
            cat "$body"
            echo "::notice::AgentCash CLI did not accept endpoint-only Provider Launch Check registration. Origin registration remains authoritative; no runtime change or spend occurred."
          fi

      - name: Verify buyer-search visibility after registration
        shell: bash
        run: |
          set -euo pipefail
          queries=(
            "AgentResolver"
            "x402 payment preflight"
            "verify endpoint before paying"
            "payTo verification"
            "endpoint safety"
            "USDC payment check"
            "AgentResolver Guard"
            "payment authorization"
            "agent wallet firewall"
            "verify x402 payment before signing"
            "verify x402 payment before paying"
            "provider launch check"
            "sell API to agents"
            "x402 provider onboarding"
            "agent service distribution"
          )
          found_queries=0
          for attempt in 1 2 3; do
            echo "=== SEARCH ATTEMPT $attempt ==="
            attempt_found=0
            for query in "${queries[@]}"; do
              echo "=== QUERY: $query ==="
              out="$(mktemp)"
              npx -y agentcash@0.17.1 search "$query" --format json > "$out"
              jq '{
                query: .data.results.query,
                totalResults: .data.results.totalResults,
                top5: [(.data.results.results // [])[0:5][]? | {
                  path,
                  summary,
                  score,
                  origin: .origin.url,
                  resourceTransactions: .signals.resourceUsage.transactionCount,
                  originTransactions: .signals.originUsage.transactionCount
                }],
                agentresolver: [(.data.results.results // [])[]? | select((.origin.url // "") == "https://agentresolver.vercel.app") | {
                  path,
                  summary,
                  score,
                  resourceTransactions: .signals.resourceUsage.transactionCount,
                  originTransactions: .signals.originUsage.transactionCount
                }]
              }' "$out"
              if grep -Fq 'agentresolver.vercel.app' "$out"; then
                echo "AgentResolver visible for: $query"
                attempt_found=$((attempt_found+1))
              else
                echo "::warning::AgentResolver not visible for: $query"
              fi
            done
            found_queries=$attempt_found
            if [ "$attempt_found" -gt 0 ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "No buyer-search visibility yet; waiting briefly for index propagation."
              sleep 20
            fi
          done
          echo "AgentResolver visible in $found_queries of ${#queries[@]} buyer searches on final attempt."
