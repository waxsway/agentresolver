name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Only the newest commit on a PR branch or main needs a full validation build.
# main is cumulative, so canceling an older in-flight CI run cannot drop changes;
# the newer SHA validates the complete tree and is the only one eligible to deploy.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build client package
        run: ./node_modules/.bin/tsc -p packages/agentresolver-client/tsconfig.json

      - name: Validate client package tarball
        working-directory: packages/agentresolver-client
        run: npm pack --dry-run

      - name: Build
        run: npm run build

      - name: Smoke test built app
        shell: bash
        run: |
          set -euo pipefail
          PORT=3001 npm run start -- --hostname 127.0.0.1 --port 3001 > /tmp/agentresolver-next.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; cat /tmp/agentresolver-next.log || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/api/health >/tmp/health.json; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3001/agentresolver.md | grep -F 'AgentResolver' >/dev/null
          curl -fsS http://127.0.0.1:3001/integrations.json | grep -F 'https://agentresolver.vercel.app/mcp' >/dev/null
          curl -fsS http://127.0.0.1:3001/openapi.json | grep -F 'resolveCapability' >/dev/null
          grep -F '"ok":true' /tmp/health.json >/dev/null
          grep -F '"version":"0.1.4"' /tmp/health.json >/dev/null
          grep -F '"paidManifest":"/.well-known/x402"' /tmp/health.json >/dev/null

          kill "$app_pid"
          wait "$app_pid" || true
          trap - EXIT
